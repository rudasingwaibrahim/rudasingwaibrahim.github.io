title: "Σ Sigma"
description: "Cours, exercices, devoirs et corrigés"
url: "https://ibrahim-rudasingwa.fr"
theme: null

markdown: kramdown

school_name: "Lycée Younoussa Bamana"
school_address: "-"
school_city: "Mamoudzou, Mayotte"

contact_name: "Ibrahim Rudasingwa"
contact_email: "brhmrudasingwa@gmail.com"

# Statistiques de fréquentation anonymes, sans cookies (GoatCounter).
# Indiquer ici le code du compte (ex. "sigma" pour https://sigma.goatcounter.com). Vide = désactivé.
goatcounter_code: "rudasingwa"

# Devoirs en ligne : adresse de l'application Web Google Apps Script du professeur
# (se termine par /exec, voir tools/devoirs/README.md). Vide = « bientôt disponibles » + mode démo.
devoirs_url: ""

# Fichiers du dépôt qui ne sont pas publiés sur le site (outils du professeur, dont le serveur des devoirs).
exclude:
  - tools/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Toutes les pages (Markdown et HTML) utilisent la mise en page du site par défaut.
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
