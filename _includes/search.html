<div class="search-dialog" id="search" role="dialog" aria-modal="true" aria-label="Rechercher dans le site" hidden>
  <div class="search-box">
    <div class="search-field">
      {% include icon.html n="search" %}
      <label class="sr-only" for="search-input">Rechercher un chapitre, une notion, un document ou un jeu</label>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Chapitre, notion, jeu…"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results">
      <button class="icon-btn search-close" type="button" data-search-close aria-label="Fermer la recherche">{% include icon.html n="close" %}</button>
    </div>
    <div class="search-filters" role="group" aria-label="Filtrer les résultats">
      <button type="button" data-k="" aria-pressed="true">Tout</button>
      <button type="button" data-k="Classe" aria-pressed="false">Classes</button>
      <button type="button" data-k="Chapitre" aria-pressed="false">Chapitres</button>
      <button type="button" data-k="Cours" aria-pressed="false">Cours</button>
      <button type="button" data-k="Exercices" aria-pressed="false">Exercices</button>
      <button type="button" data-k="Évaluation" aria-pressed="false">Évaluations</button>
      <button type="button" data-k="Jeu" aria-pressed="false">Jeux</button>
    </div>
    <ul class="search-results" id="search-results" role="listbox" aria-label="Résultats"></ul>
    <p class="search-help" aria-hidden="true"><span><kbd>↑</kbd> <kbd>↓</kbd> naviguer</span><span><kbd>Entrée</kbd> ouvrir</span><span><kbd>Échap</kbd> fermer</span></p>
    <p class="sr-only" id="search-status" role="status" aria-live="polite"></p>
  </div>
</div>
