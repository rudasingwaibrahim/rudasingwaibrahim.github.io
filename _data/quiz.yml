# Entraînement interactif (Questions flash, QCM, texte à trous) : page de classe → dossier de données.
# Les données d'un chapitre N sont dans /assets/quiz/<dossier>/chN.json ; une carte n'apparaît que si ce fichier existe.
# Plusieurs classes peuvent partager un dossier (Seconde 219 et 220). Pour ajouter une classe : une ligne de plus.
# Le dossier sert aussi d'identifiant des scores (sur l'appareil) et des statistiques : ne pas renommer un dossier existant.
classes:
  - url: /classes/seconde219/
    dossier: seconde
  - url: /classes/seconde220/
    dossier: seconde
  - url: /classes/tale-techno-commun/
    dossier: tale-techno-commun
  - url: /classes/premiere-spe-maths/
    dossier: premiere-spe-maths
