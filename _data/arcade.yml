# Sigma Arcade — catalogue des jeux (les jeux eux-mêmes sont dans /sigma-arcade/<slug>/).
# niveaux : bases (bases du collège), seconde, premiere, terminale
# themes  : nombres, litteral, equations, fonctions, arithmetique, pourcentages, geometrie, statistiques, probabilites
# chapitres : chapitres des classes de Seconde (219 et 220) où le jeu est proposé (étape « Jouer »).
# chapitres_classes (facultatif) : même rôle pour les autres classes, indexé par l'identifiant de la classe
#   (dernier segment de son URL /classes/<id>/), par ex. chapitres_classes: { tale-techno-commun: [2], premiere-spe-maths: [1, 3] }
# remise_a_niveau : true → affiché dans le bloc « Revoir les bases du collège » des classes de Seconde.

niveaux:
  - id: bases
    nom: Bases du collège
  - id: seconde
    nom: Seconde
  - id: premiere
    nom: Première
  - id: terminale
    nom: Terminale

themes:
  - id: nombres
    nom: Nombres et calculs
  - id: litteral
    nom: Calcul littéral
  - id: equations
    nom: Équations
  - id: fonctions
    nom: Fonctions
  - id: arithmetique
    nom: Arithmétique
  - id: pourcentages
    nom: Information chiffrée
  - id: geometrie
    nom: Vecteurs et géométrie
  - id: statistiques
    nom: Statistiques
  - id: probabilites
    nom: Probabilités
  - id: suites
    nom: Suites

