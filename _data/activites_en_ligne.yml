  # ───────────────────────── Terminale spécialité ─────────────────────────

  terminale-spe-ch2:
    activites:
      - n: 1
        titre: Découvrir la notion d'asymptotes et de limites
        outils: GeoGebra · tableur GeoGebra
        outils_pdf: GeoGebra
        consigne: |-
          <p>On considère les fonctions $f:x\mapsto\dfrac1x$, $g:x\mapsto\dfrac{\sin(5x)}x+10$ et $h:x\mapsto\sqrt x$.</p>
          <p><b>A. Observations graphiques.</b> 1. Ouvrir le logiciel GeoGebra et tracer les courbes représentatives de $f$, $g$ et $h$ (pour $h$, écrire <code>h(x)=sqrt(x)</code>). 2. À l'aide de l'outil réduction, dézoomer jusqu'aux marques $-200$ et $200$ en abscisses. a) À quoi ressemblent les courbes représentatives des fonctions $f$ et $g$ à leurs extrémités ? (Les faire afficher séparément.) b) Peut-on faire la même affirmation pour la courbe de $h$ ? Lorsque $x$ tend vers l'infini, les courbes de $f$ et $g$ se rapprochent de plus en plus d'une droite parallèle à l'axe des abscisses. On dit qu'elles possèdent une <b>asymptote horizontale</b>. 3. Relever graphiquement l'équation de chaque asymptote observée.</p>
          <p><b>B. Observations numériques.</b> 1. Ouvrir le tableur de GeoGebra. a) Dans la colonne A, écrire la liste des nombres $10$, $20$, $30$, …, $300$. b) Écrire dans la colonne B les images de ces nombres par $f$. c) De même, calculer les images par $g$ et par $h$ dans les colonnes C et D. 2. Parmi les trois fonctions, on dit que certaines ont une <b>limite finie</b> et d'autres une <b>limite infinie</b>. Quelle(s) fonction(s) semble(nt) avoir une limite infinie en $+\infty$ ? une limite finie ? (Préciser la valeur de la limite dans ce cas.)</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 1 p. 50 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            titre: GeoGebra — partie A
            app: classic
            perspective: AG
            fenetre: [-10, -4, 10, 14]
            commandes: []
            aide: |-
              <p>Pour dézoomer : outil « Réduire » (dans le menu de l'outil « Déplacer graphique », dernière icône) ou molette de la souris, ou deux doigts sur l'écran.</p>
            commandes_aide:
              - "f(x)=1/x"
              - "g(x)=10+sin(5x)/x"
              - "h(x)=sqrt(x)"
          - type: geogebra
            titre: Tableur de GeoGebra — partie B
            app: classic
            perspective: S
            commandes: []
            aide: |-
              <p>Une formule commence par <code>=</code> ; pour recopier vers le bas, fais glisser le petit carré du coin de la cellule.</p>
            aide_titre: "Coup de pouce : les formules"
            commandes_aide:
              - "A1 : 10"
              - "A2 : =A1+10   (puis recopier vers le bas jusqu'à A30)"
              - "B1 : =1/A1"
              - "C1 : =sin(5A1)/A1+10"
              - "D1 : =sqrt(A1)"
      - n: 2
        titre: Découvrir la notion de limite en un point
        outils: Tableur GeoGebra
        outils_pdf: tableur GeoGebra
        consigne: |-
          <p>On reprend les fonctions $f:x\mapsto\dfrac1x$ et $g:x\mapsto\dfrac{\sin(5x)}x+10$ de l'activité précédente.</p>
          <p><b>1.</b> Ces fonctions semblent-elles définies en $0$ ? Justifier. <b>2.</b> Ouvrir la partie tableur de GeoGebra. On peut approcher $0$ de deux manières : en décroissant à partir d'un nombre positif (« depuis la droite ») ; en croissant à partir d'un nombre négatif (« depuis la gauche »).</p>
          <p><b>3.</b> On commence par approcher $0$ « depuis la gauche ». a) Entre A1 et A31, écrire la liste des nombres $-0{,}3$ ; $-0{,}29$ ; $-0{,}28$ ; … ; $-0{,}01$ ; $0$. b) Dans les colonnes B et C, faire calculer les images des nombres de la colonne A par $f$ et $g$. c) Comment semblent se comporter les images par $f$ lorsque l'on se rapproche de $0$ « depuis la gauche » ? Que dire des images par $g$ ?</p>
          <p><b>4.</b> Approchons maintenant $0$ « depuis la droite ». a) Entre A31 et A61, écrire la liste des nombres $0$ ; $0{,}01$ ; $0{,}02$ ; … ; $0{,}29$ ; $0{,}3$. b) En procédant de la même manière, observer le comportement des images par $f$ et $g$ lorsque l'on se rapproche de $0$ « depuis la droite ». Est-ce le même comportement que précédemment ?</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 2 p. 50 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            titre: Tableur de GeoGebra
            app: classic
            perspective: S
            commandes: []
            aide: |-
              <p>La virgule s'écrit avec un point. Une formule commence par <code>=</code> ; pour recopier vers le bas, fais glisser le petit carré du coin de la cellule. En A31, tape directement <code>0</code>.</p>
            aide_titre: "Coup de pouce : les formules"
            commandes_aide:
              - "A1 : -0.3"
              - "A2 : =A1+0.01   (puis recopier vers le bas jusqu'à A30)"
              - "B1 : =1/A1"
              - "C1 : =sin(5A1)/A1+10"
      - n: 3
        titre: Effectuer des opérations sur les limites
        outils: GeoGebra · NumWorks
        outils_pdf: GeoGebra, calculatrice NumWorks
        consigne: |-
          <p>On considère les fonctions $f:x\mapsto\dfrac1{x^2}$, $g:x\mapsto\dfrac1x$, $h:x\mapsto x$ et $k:x\mapsto x^2$.</p>
          <p><b>1.</b> Préciser les limites de $f$, $g$, $h$ et $k$ en $0$ et en $+\infty$.</p>
          <p><b>2.</b> Conjecturer les limites de sommes suivantes à l'aide de la question précédente et vérifier, le cas échéant, avec la calculatrice et GeoGebra : a) $\lim\limits_{x\to0}f(x)+h(x)$ ; b) $\lim\limits_{x\to-\infty}g(x)+k(x)$ ; c) $\lim\limits_{x\to+\infty}k(x)+h(x)$ ; d) $\lim\limits_{x\to-\infty}h(x)+k(x)$ ; e) $\lim\limits_{x\to0}f(x)+g(x)$ ; f) $\lim\limits_{x\to-\infty}f(x)+h(x)$ ; g) $\lim\limits_{x\to+\infty}f(x)+h(x)$ ; h) $\lim\limits_{x\to+\infty}f(x)+g(x)$.</p>
          <p><b>3.</b> Même travail pour les produits : a) $\lim\limits_{x\to+\infty}f(x)\times h(x)$ ; b) $\lim\limits_{x\to-\infty}f(x)\times k(x)$ ; c) $\lim\limits_{x\to0}g(x)\times k(x)$ ; d) $\lim\limits_{x\to+\infty}f(x)\times k(x)$ ; e) $\lim\limits_{x\to-\infty}k(x)\times h(x)$ ; f) $\lim\limits_{x\to-\infty}g(x)\times h(x)$ ; g) $\lim\limits_{x\to0}f(x)\times h(x)$ ; h) $\lim\limits_{x\to+\infty}g(x)\times k(x)$.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 3 p. 51 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-6, -6, 6, 10]
            commandes: ['f(x)=1/x^2', 'g(x)=1/x', 'h(x)=x', 'k(x)=x^2']
            cacher: [f, g, h, k]
            aide: |-
              <p>Les quatre fonctions de l'énoncé sont déjà définies (courbes masquées : clique sur une pastille pour en afficher une). Tape la somme ou le produit à étudier, puis dézoome ou zoome autour de $0$.</p>
            commandes_aide:
              - "s(x)=f(x)+h(x)"
              - "p(x)=f(x)*h(x)"
          - type: numworks
            aide: |-
              <p>Application <b>Grapheur</b> : saisis par exemple $1/x^2+x$, puis consulte le <b>Tableau</b> de valeurs pour des valeurs de $x$ proches de $0$ ou très grandes.</p>

  terminale-spe-ch4:
    activites:
      - n: 1
        titre: Encadrer et comparer des fonctions
        outils: GeoGebra
        consigne: |-
          <p>On considère les fonctions $f:x\mapsto x+10+10\sin(x)$ et $g:x\mapsto\dfrac{\sin(10x)}x$.</p>
          <p><b>A.</b> 1. Peut-on déterminer $\lim\limits_{x\to+\infty}f(x)$ et $\lim\limits_{x\to+\infty}g(x)$ à partir d'opérations sur les limites ? 2. Ouvrir le logiciel GeoGebra et tracer les courbes de $f$ et $g$. Quelles conjectures peut-on émettre quant à leur comportement en $+\infty$ ?</p>
          <p>La partie B se traite sur la fiche (puis « Vérifier graphiquement » ici).</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 5 p. 51 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-5, -15, 60, 75]
            commandes: []
            aide: |-
              <p>Les deux courbes n'ont pas la même échelle : regarde-les l'une après l'autre (pastille à gauche) et zoome ou dézoome.</p>
            commandes_aide:
              - "f(x)=x+10+10sin(x)"
              - "g(x)=sin(10x)/x"
              - "y=x"

  terminale-spe-ch5:
    activites:
      - n: 1
        titre: Découvrir les vecteurs dans l'espace
        outils: GeoGebra 3D
        consigne: |-
          <p><b>1.</b> Ouvrir la fenêtre 3D de GeoGebra. Chercher l'icône correspondant à la construction d'un cube, pour voir les instructions à suivre. <b>2.</b> Cliquer sur le point origine du repère (nommé $A$), puis sur un point de l'axe des abscisses nommé $B$ (par exemple $B(3,0,0)$). Le cube $ABCDEFGH$ peut alors se construire. <b>3.</b> Construire alors les vecteurs $\overrightarrow{AB}$, $\overrightarrow{AD}$ et $\overrightarrow{AE}$ ($\vec u$, $\vec v$ et $\vec w$ dans GeoGebra). <b>4.</b> Taper <code>u + v</code> dans la ligne de saisie. Qu'observe-t-on ? <b>5.</b> Taper <code>u + 2v</code> dans la ligne de saisie. Qu'observe-t-on ? Faire tourner la figure pour conclure sur le point obtenu en termes de plan. <b>6.</b> Taper <code>u + v + w</code>. Qu'observe-t-on ? <b>7.</b> Construire un représentant du vecteur $\vec u+\vec v$ à partir du point $E$. Qu'observe-t-on ?</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 1 p. 278 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            titre: GeoGebra 3D
            app: classic
            perspective: AT
            commandes: []
            aide: |-
              <p>Pour faire tourner la figure : fais glisser le fond avec la souris (ou un doigt). Les commandes ci-dessous construisent le cube sans les outils.</p>
            commandes_aide:
              - "A=(0,0,0)"
              - "B=(3,0,0)"
              - "Cube(A,B)"
              - "u=Vecteur(A,B)"
              - "v=Vecteur(A,D)"
              - "w=Vecteur(A,E)"
              - "u+v"
              - "Vecteur(E,E+u+v)"

  terminale-spe-ch6:
    activites:
      - n: 1
        titre: Voir des fonctions à l'intérieur d'autres fonctions
        outils: Python
        consigne: |-
          <p><b>A.</b> On considère la fonction $f$ définie par $f(x)=\sqrt{3x}$.</p>
          <p><b>3.</b> Lequel des deux algorithmes ci-dessous, écrits en langage Python, retourne $f(x)$ ?</p>
          <p>Les autres questions se traitent sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 1 p. 138 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: python
            titre: Algorithme A
            lignes: 4
            console: "f(1)"
            code: |-
              from math import sqrt
              def f(x):
                  x=3*x
                  return(sqrt(x))
            aide: |-
              <p>La première ligne (<code>from math import sqrt</code>) est ajoutée pour que Python connaisse la racine carrée. Clique sur « Exécuter », puis calcule <code>f(1)</code>, <code>f(3)</code>… dans la console et compare avec $\sqrt{3x}$.</p>
          - type: python
            titre: Algorithme B
            lignes: 4
            console: "f(1)"
            code: |-
              from math import sqrt
              def f(x):
                  x=sqrt(x)
                  return(3*x)

  terminale-spe-ch7:
    activites:
      - n: 1
        titre: Calculatrice et loi binomiale
        outils: NumWorks · Python
        outils_pdf: Calculatrice NumWorks, Python
        consigne: |-
          <p>Il s'agit de calculer directement des probabilités de la forme $p(X=k)$ ou $p(X\leqslant k)$ où $X$ suit une loi binomiale, à l'aide d'une calculatrice.</p>
          <p><b>A. Probabilité $p(X=k)$.</b> On souhaite calculer $p(X=3)$ où $X$ suit la loi $\mathcal B(11\,;0{,}4)$. Calculer $p(X=3)$.</p>
          <p><b>B. Probabilité $p(X\leqslant k)$.</b> On souhaite calculer $p(X\leqslant5)$ avec la variable $X$ de la partie A. Calculer $p(X\leqslant5)$.</p>
          <p>Sur la fiche, la marche à suivre est donnée pour les TI-83 Premium CE, CASIO Graph 90+ et NumWorks. En ligne, on utilise l'émulateur NumWorks (il n'existe pas d'émulateur gratuit en ligne pour TI et CASIO) ; Python permet de contrôler le résultat.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), travaux pratiques 1 p. 398 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: numworks
            aide: |-
              <ol>
              <li>Application <b>Probabilités</b>, choisir <b>Binomiale</b>, régler $n=11$ et $p=0{,}4$.</li>
              <li>Partie A : choisir le calcul $P(X=\ldots)$ et saisir $3$.</li>
              <li>Partie B : choisir le calcul $P(X\leqslant\ldots)$ et saisir $5$.</li>
              </ol>
          - type: python
            titre: Contrôler avec Python
            lignes: 12
            code: |-
              from math import comb

              n = 11
              p = 0.4

              # Partie A : p(X = 3)
              print(comb(n, 3) * p**3 * (1 - p)**(n - 3))

              # Partie B : p(X <= 5)
              s = 0
              for k in range(6):
                  s = s + comb(n, k) * p**k * (1 - p)**(n - k)
              print(s)
            aide: |-
              <p><code>comb(n, k)</code> donne le coefficient binomial $\binom{n}{k}$. Clique sur « Exécuter » et compare avec la calculatrice.</p>
      - n: 2
        titre: La planche de Galton
        outils: Python
        consigne: |-
          <p>Dans un jeu télévisé, on fait glisser un palet le long d'une planche cloutée. À chaque étage, le palet rencontre un clou et va à gauche ou à droite puis, après 3 étages, il arrive dans un des quatre réceptacles qui indiquent, de gauche à droite, les gains $1\,000$ €, $5$ €, $10$ € et $500$ € (figure sur la fiche).</p>
          <p><b>3.</b> Écrire et compléter le programme Python ci-dessous afin qu'il simule le lancer d'un palet et affiche le gain correspondant.</p>
          <p>Les questions 1, 2 et 4 se traitent sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), travaux pratiques 4, partie A, p. 401 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: python
            lignes: 11
            code: |-
              import random
              gauche=0
              for i in range(3):
                  if random.random() <= 0.5:
                      gauche = gauche+1
              if gauche == 0:
                  print("... euros")
              ...
            aide: |-
              <p>Complète le programme à la place des <code>...</code> pour que chaque valeur possible de <code>gauche</code> affiche le gain correspondant. Exécute-le plusieurs fois : chaque exécution simule un nouveau lancer.</p>

  terminale-spe-ch8:
    activites:
      - n: 2
        titre: Comprendre le lien entre continuité et dérivabilité
        outils: GeoGebra · NumWorks
        outils_pdf: GeoGebra, calculatrice NumWorks
        consigne: |-
          <p><b>A.</b> Soit la fonction $f$ définie sur $\mathbb R$ par $f(x)=|2x-3|$. <b>3.</b> Tracer la fonction $f$ à l'aide de la calculatrice. Comment interpréter graphiquement les résultats obtenus pour les questions 1. et 2. ?</p>
          <p><b>B.</b> Soit la fonction $g$ définie sur $\mathbb R$ par $g(x)=\sqrt{x^2}$. <b>3.</b> Tracer la fonction $g$ à l'aide de la calculatrice. Comment interpréter graphiquement les résultats obtenus pour les questions 1. et 2. ?</p>
          <p>Les questions 1 et 2 se traitent sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 2 p. 110 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: numworks
            aide: |-
              <p>Application <b>Grapheur</b> : saisis $f(x)=\mathrm{abs}(2x-3)$ (touche <b>Toolbox</b>, rubrique « Nombres », pour la valeur absolue), puis <b>Afficher le graphique</b>. Même chose avec $\sqrt{x^2}$.</p>
          - type: geogebra
            titre: Ou avec GeoGebra
            app: classic
            perspective: AG
            fenetre: [-4, -1, 5, 6]
            commandes: []
            commandes_aide:
              - "f(x)=abs(2x-3)"
              - "g(x)=sqrt(x^2)"

  terminale-spe-ch10:
    activites:
      - n: 2
        titre: Voir le lien entre courbes, sécantes et tangentes
        outils: GeoGebra
        consigne: |-
          <ol>
          <li>À l'aide d'un logiciel de géométrie dynamique, tracer dans un repère la courbe $\mathscr C_f$ représentative de la fonction $f:x\mapsto x^3$.</li>
          <li>Placer deux points $A$ et $B$ d'abscisses négatives et tracer le segment $[AB]$ (aussi appelé sécante). Comment est situé ce segment par rapport à la courbe $\mathscr C_f$ ? Faire de même avec deux points $C$ et $D$ d'abscisses positives puis avec le point $E$ d'abscisse $-2$ et le point $F$ d'abscisse $2$.</li>
          <li>Pour tout point $M$ de $\mathscr C_f$, on note $T_M$ la tangente à $\mathscr C_f$ au point $M$. Tracer $T_A$, $T_B$, $T_C$, $T_D$, $T_E$ et $T_F$. Donner la position de chaque tangente par rapport à $\mathscr C_f$.</li>
          </ol>
          <p>Les questions 4 à 6 se traitent sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 4 p. 139 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-3, -9, 3, 9]
            commandes: []
            aide: |-
              <p>Un point placé sur la courbe avec l'outil « Point » reste sur la courbe quand on le déplace. Même travail pour $C$, $D$, $E$ et $F$.</p>
            commandes_aide:
              - "f(x)=x^3"
              - "A=(-1.5,f(-1.5))"
              - "B=(-0.5,f(-0.5))"
              - "Segment(A,B)"
              - "Tangente(A,f)"

  terminale-spe-ch12:
    activites:
      - n: 1
        titre: Approcher graphiquement une nouvelle fonction
        outils: GeoGebra
        consigne: |-
          <p>La partie A se traite sur la fiche ; $\Delta$ est la droite d'équation $y=x$.</p>
          <p><b>B. Construction de la courbe de la fonction logarithme népérien.</b> 1. À l'aide d'un logiciel de géométrie dynamique, tracer la courbe représentative $\mathscr C$ de la fonction exponentielle et y placer un point $N$. 2. Construire le symétrique $N'$ de $N$ par rapport à la droite $\Delta$. Activer la trace de $N'$ et déplacer le point $N$. 3. Afficher la courbe $\mathscr C'$ de la fonction $\ln$ en saisissant <code>y = ln(x)</code>.</p>
          <p><b>C. 5.</b> a) Tracer la tangente au point $N'$ à la courbe $\mathscr C'$ et afficher son coefficient directeur. b) Après avoir déplacé plusieurs fois $N$, conjecturer le lien entre l'abscisse de $N'$ et ce coefficient directeur.</p>
          <p>Les autres questions de la partie C se traitent sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 1 p. 170 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-4, -4, 8, 8]
            commandes: []
            aide: |-
              <p>Pour activer la trace : clic droit (ou appui long) sur $N'$, puis « Afficher la trace ». Le point $N'$ se tape <code>N'</code>. Si la commande <code>Symétrie</code> n'est pas reconnue (accent), tape son nom anglais <code>Mirror(N,d)</code> : GeoGebra l'affiche ensuite en français.</p>
            commandes_aide:
              - "f(x)=exp(x)"
              - "N=Point(f)"
              - "d:y=x"
              - "N'=Symétrie(N,d)"
              - "SoitTrace(N',true)"
              - "c:y=ln(x)"
              - "t=Tangente(N',c)"
              - "Pente(t)"

  terminale-spe-ch13:
    activites:
      - n: 1
        titre: Distance d'un point à une courbe
        outils: GeoGebra
        consigne: |-
          <p>On recherche la plus petite distance entre le point $J(0\,;1)$ et un point $M$ de la courbe $\mathscr C_f$ de $f(x)=\ln(x+1)$, définie sur $]-1\,;+\infty[$, dans un repère orthonormé $(O\,;I,J)$.</p>
          <p><b>A. Modélisation à l'aide d'un logiciel.</b> 1. Tracer $\mathscr C_f$ ; créer un curseur $a$ variant de $-0{,}5$ à $5$ avec un pas de $0{,}1$ ; placer $M(a\,;f(a))$ et $J(0\,;1)$. 2. Tracer le segment $[JM]$ et afficher sa longueur. 3. En faisant varier $a$, conjecturer la valeur de $x$ pour laquelle $JM$ est minimale et une valeur approchée de cette distance minimale.</p>
          <p>La partie B se traite sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), TP 3 « Distance d'un point à une courbe » p. 200 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-2, -2, 6, 3]
            commandes: []
            aide: |-
              <p>La longueur du segment s'affiche dans la colonne de gauche. Pour plus de précision, tu peux régler l'incrément du curseur à $0{,}01$ (clic droit sur le curseur, « Propriétés »).</p>
            commandes_aide:
              - "f(x)=ln(x+1)"
              - "a=Curseur(-0.5,5,0.1)"
              - "M=(a,f(a))"
              - "J=(0,1)"
              - "s=Segment(J,M)"

  terminale-spe-ch15:
    activites:
      - n: 3
        titre: Introduire l'étude des équations y' = ay et y' = ay + b
        outils: GeoGebra
        consigne: |-
          <p><b>B. 3.</b> À l'aide de GeoGebra, en créant des curseurs $a$ et $K$, étudier les courbes des fonctions $x\mapsto K\mathrm{e}^{ax}$.</p>
          <p><b>4.</b> Associer chaque fonction à sa courbe (courbes ① à ⑤ sur la fiche) et donner l'équation différentielle dont elle est solution : a) $f(x)=-3\mathrm{e}^{2x}$ ; b) $f(x)=0{,}5\mathrm{e}^x$ ; c) $f(x)=0{,}5\mathrm{e}^{-2x}$ ; d) $f(x)=-3\mathrm{e}^{-2x}$ ; e) $f(x)=0{,}5\mathrm{e}^{-0{,}1x}$.</p>
          <p>Les autres questions se traitent sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 3 p. 205 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-4.5, -4.5, 4.5, 4.5]
            commandes: []
            aide: |-
              <p>La fenêtre est celle des courbes de la fiche ($-4{,}5$ à $4{,}5$ sur chaque axe).</p>
            commandes_aide:
              - "a=Curseur(-3,3,0.1)"
              - "K=Curseur(-5,5,0.1)"
              - "f(x)=K*exp(a*x)"

  terminale-spe-ch16:
    activites:
      - n: 2
        titre: Décomposer une variable aléatoire suivant une loi binomiale
        outils: Python
        consigne: |-
          <p>On considère la fonction <code>binomiale</code> ci-dessous, qui simule une variable aléatoire $X$ en Python.</p>
          <p><b>1.</b> Écrire une fonction <code>bernoulli(p)</code> simulant une loi de Bernoulli de paramètre $p$ (ne pas oublier d'importer le module <code>random</code>).</p>
          <p><b>2.</b> Tester la fonction <code>binomiale</code> depuis la console pour simuler une variable aléatoire de loi binomiale de paramètres $n=50$ et $p=0{,}21$.</p>
          <p><b>3.</b> Expliquer pourquoi la variable aléatoire $X$ suit une loi binomiale de paramètres $n$ et $p$ (sur la fiche).</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 2 p. 404 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: python
            lignes: 11
            console: "binomiale(50, 0.21)"
            code: |-
              import random

              def bernoulli(p):
                  ...

              def binomiale(n, p):
                  s = 0
                  for i in range(n):
                      s = s + bernoulli(p)
                  return s
            aide: |-
              <p>Écris le corps de <code>bernoulli(p)</code> à la place de <code>...</code>, clique sur « Exécuter », puis valide <code>binomiale(50, 0.21)</code> dans la console (plusieurs fois).</p>

  terminale-spe-ch17:
    activites:
      - n: 3
        titre: Valeur approchée des solutions d'une équation
        outils: Python
        consigne: |-
          <p>$f(x)=3\cos(2x-1)$ sur $[0\,;\pi]$. <b>1.</b> (sur la fiche) a) Tableau de variations de $f$ sur $[0\,;\pi]$. b) En déduire que $f(x)=0$ admet exactement deux solutions sur $[0\,;\pi]$.</p>
          <p><b>2.</b> On considère le programme ci-dessous. a) Faire fonctionner cet algorithme pour $n=4$ ; que retourne-t-il ? b) Modifier l'algorithme pour obtenir la deuxième solution. c) Donner des valeurs approchées des deux solutions à $10^{-4}$ près.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 3 p. 83 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: python
            lignes: 11
            console: "dichotomie(4)"
            code: |-
              from math import *
              def dichotomie(n):
                  a = 0.5
                  b = pi/2 + 0.5
                  while abs(b - a) > 1/10**n:
                      c = (a + b)/2
                      if 3*cos(2*c - 1) > 0:
                          a = c
                      else:
                          b = c
                  print("Une valeur approchée de x est comprise entre", a, "et", b)
            aide: |-
              <p>Clique sur « Exécuter » (cela définit la fonction), puis valide <code>dichotomie(4)</code> dans la console. Pour la question b), modifie le programme puis exécute-le à nouveau.</p>

  terminale-spe-ch18:
    activites:
      - n: 1
        titre: Évaluer l'intégrale d'une fonction continue positive
        outils: Python
        consigne: |-
          <p><b>C. Déterminer $\int_0^1x^2\,\mathrm{d}x$ par la méthode des rectangles.</b> $g(x)=x^2$ sur $[0\,;1]$ ; on découpe $[0\,;1]$ en $n$ intervalles égaux ; $U_n$ est la somme des aires des rectangles « sous » la courbe et $V_n$ celle des rectangles « au-dessus ».</p>
          <p><b>1.</b> Écrire un programme Python calculant $U_n$ et $V_n$.</p>
          <p>La partie A et les questions 2 et 3 se traitent sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths Terminale spécialité (Magnard, 2020), activité 1 p. 240 (parties A et C) — licence CC BY-SA 3.0 FR."
        blocs:
          - type: python
            lignes: 7
            code: |-
              n = 10
              U = 0
              V = 0
              ...
              print(U, V)
            aide: |-
              <p>Remplace <code>...</code> par ton programme (une boucle qui ajoute l'aire de chaque rectangle), puis essaie $n=10$, $n=100$, $n=1000$.</p>
