# Activités « à faire en ligne » des fiches d'activités (Python, GeoGebra, calculatrice).
# Clé de chapitre = nom du PDF de la fiche sans « -activites.pdf » (ex. seconde-ch4 → seconde-ch4-activites.pdf) :
# le bloc « Activités d'introduction » de chaque page de chapitre qui publie cette fiche affiche alors
# un bouton « Faire l'activité N en ligne » vers /en-ligne/<clé>-a<N>/ (page en-ligne/<clé>-a<N>/index.html).
# Champs d'une activité : n, titre, consigne (HTML, maths entre $…$), source, blocs.
# Blocs : python (code, console, lignes, aide) · geogebra (app, perspective, commandes en anglais pour préparer
# la figure, fenetre [xmin, ymin, xmax, ymax], commandes_aide = commandes en français proposées à l'élève, aide)
# · numworks (aide). Voir _includes/activite-en-ligne.html.
chapitres:

  # ───────────────────────── Seconde ─────────────────────────

  seconde-ch1:
    activites:
      - n: 2
        titre: Bien débuter un calcul littéral fractionnaire
        outils: Tableur GeoGebra
        outils_pdf: tableur GeoGebra
        consigne: |-
          <p><b>A. Explorer les possibles</b></p>
          <p><b>1.</b> À l'aide d'un tableur, calculer les expressions suivantes pour tous les nombres entiers entre $-10$ et $10$.</p>
          <p>a) $A=\dfrac{x-1}{x+4}$ &nbsp; b) $B=\dfrac{2x-1}{3x-7}$ &nbsp; c) $C=\dfrac{3x+4}{x+4}$ &nbsp; d) $D=\dfrac{x+5}{2x-6}$</p>
          <p><b>2.</b> a) Au vu des résultats trouvés, conjecturer les conditions nécessaires à un calcul en écriture fractionnaire. b) Les expliciter en détail, dans le cas des expressions $A$ et $B$.</p>
          <p>La partie B se traite sur la fiche.</p>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 3 p. 99 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            titre: Tableur de GeoGebra
            app: classic
            perspective: S
            commandes: []
            aide: |-
              <p>Touche une cellule, tape son contenu puis valide. Une formule commence par <code>=</code>. Pour recopier une formule vers le bas : sélectionne la cellule puis fais glisser le petit carré de son coin inférieur droit. Une valeur impossible à calculer s'affiche vide ou avec <code>?</code>.</p>
            aide_titre: "Coup de pouce : ce qu'on peut taper dans les cellules"
            commandes_aide:
              - "A1 : -10"
              - "A2 : =A1+1   (puis recopier vers le bas jusqu'à A21)"
              - "B1 : =(A1-1)/(A1+4)"
              - "C1 : =(2A1-1)/(3A1-7)"

  seconde-ch4:
    activites:
      - n: 2
        titre: Quotient et reste en Python
        outils: Python
        consigne: |-
          <p><b>1.</b> a) En posant la division, déterminer le quotient et le reste de $89$ par $6$.</p>
          <p>b) Saisir successivement dans la console Python, en validant à chaque fois, <code>89//6</code> et <code>89%6</code>.</p>
          <p>c) Que semblent faire les instructions <code>a//b</code> et <code>a%b</code> ? Contrôler avec un autre exemple.</p>
        source: "D'après Sésamath, Maths 2de (Magnard, 2023), TP 1 « Mathématiques et langage Python », partie A, question 2, p. 42 — licence CC BY-SA 3.0."
        blocs:
          - type: python
            titre: Console Python
            console: "89//6"
            aide: |-
              <p>La console attend une instruction après <code>&gt;&gt;&gt;</code>. <code>89//6</code> est déjà écrit : valide avec la touche Entrée (ou le bouton « Valider »). Saisis ensuite <code>89%6</code>, puis un autre exemple de ton choix.</p>

  seconde-ch5:
    activites:
      - n: 1
        titre: Multiplier un vecteur par un réel
        outils: GeoGebra
        consigne: |-
          <p><b>1.</b> À l'aide d'un logiciel de géométrie dynamique : a) Créer un vecteur $\vec u$. <i>(Le logiciel note le vecteur $u$ sans la flèche, mais il apparaît bien dans la catégorie vecteur.)</i> b) Créer un curseur $k$ de $-5$ à $5$ et d'incrément $0{,}2$.</p>
          <p><b>2.</b> Dans la barre de saisie, taper <code>k*u</code>. On obtient alors un nouveau vecteur nommé $\vec v$ par défaut.</p>
          <p><b>3.</b> Comparer le sens, la direction et la norme des vecteurs $\vec u$ et $\vec v$ lorsque : a) $k=1$ b) $k&gt;1$ c) $k&lt;-1$ d) $0&lt;k&lt;1$ e) $-1&lt;k&lt;0$.</p>
          <p><b>4.</b> On considère deux vecteurs $\vec p$ et $\vec n$. Le vecteur $3\vec p+3\vec n$ est-il égal au vecteur $3\left(\vec p+\vec n\right)$ ?</p>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 4 p. 125 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-8, -6, 8, 6]
            commandes: []
            aide: |-
              <p>Crée le vecteur avec l'outil « Vecteur » (deux clics) ou par une commande, puis le curseur.</p>
            commandes_aide:
              - "u=Vecteur((0,0),(2,1))"
              - "k=Curseur(-5,5,0.2)"
              - "k*u"

  seconde-ch6:
    activites:
      - n: 2
        titre: Approcher √2 par balayage
        outils: Calculatrice NumWorks · Python
        outils_pdf: calculatrice NumWorks ou Python
        consigne: |-
          <p><b>1.</b> On veut déterminer une valeur approchée de $\sqrt2$. Sans calculatrice, donner un encadrement à l'unité de ce nombre.</p>
          <p><b>2.</b> Après avoir recopié et complété le tableau suivant, donner un encadrement de $\sqrt2$ au dixième.</p>
          <p>$N$ : $1$ ; $1{,}1$ ; $1{,}2$ ; $1{,}3$ ; $1{,}4$ ; $1{,}5$ ; $1{,}6$ ; $1{,}7$ ; $1{,}8$ ; $1{,}9$ ; $2$ — ligne $N^2$ à compléter.</p>
          <p><b>3.</b> Quel est l'encadrement de $\sqrt2$ au centième ?</p>
        source: "Sésamath, Maths 2de (Magnard, 2023), TP 1 « Approximation de √2 », partie A, p. 68 — licence CC BY-SA 3.0."
        blocs:
          - type: numworks
            aide: |-
              <p>Application <b>Calculs</b> : tape <code>1.1^2</code> puis <b>EXE</b>, et ainsi de suite (la virgule s'écrit avec un point).</p>
          - type: python
            titre: Ou la console Python
            console: "1.1**2"
            aide: |-
              <p>La console calcule comme une calculatrice. En Python, $N^2$ s'écrit <code>N**2</code> et la virgule s'écrit avec un point : <code>1.1**2</code>.</p>

  seconde-ch13:
    activites:
      - n: 3
        titre: Linéarité de la moyenne
        outils: Tableur GeoGebra
        outils_pdf: tableur GeoGebra
        consigne: |-
          <ol>
          <li>Préparer une feuille de calcul avec les en-têtes : A1 Valeurs, B1 Valeurs*k, C1 Valeurs+k, D1 Valeurs/k, E1 Valeurs−k, G1 k=, H1 $2$.</li>
          <li>Dans la cellule A2, générer un entier aléatoire entre $1$ et $100$ avec la commande <code>=ALEA.ENTRE.BORNES(1;100)</code> puis recopier vers le bas jusqu'à la cellule A21.</li>
          <li>a) Saisir la formule <code>=A2*H1</code> dans la cellule B2 et la recopier vers le bas jusqu'à B21. b) Les valeurs qui apparaissent dans les cellules sont-elles correctes ? Expliquer pourquoi. c) Comment écrire correctement la formule en B2 ?<br><i>Coup de pouce : pour qu'un élément d'une adresse (colonne et/ou ligne) ne soit pas modifié quand la formule est étendue, on écrit le symbole <code>$</code> devant la lettre de la colonne et/ou le nombre de la ligne.</i></li>
          <li>Faire de même pour les colonnes C, D et E (adapter au titre de la colonne !).</li>
          <li>Saisir <code>=MOYENNE(A2:A21)</code> dans la cellule A22. À quoi la valeur obtenue correspond-elle ?</li>
          <li>Quelle va être la moyenne des valeurs de la colonne B ? Vérifier en tirant la formule en A22 d'une seule cellule vers la droite.</li>
          <li>Reprendre cette question avec chacune des colonnes.</li>
          <li>a) Modifier la valeur de k en H1 et observer les différentes moyennes dans la ligne 22. b) Énoncer des règles que l'on peut conjecturer sur la moyenne d'une série pour laquelle on multiplie (respectivement ajoute, divise, etc.) toutes les valeurs par un même nombre.</li>
          </ol>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 2, p. 314 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            titre: Tableur de GeoGebra
            app: classic
            perspective: S
            commandes: ['A1="Valeurs"', 'B1="Valeurs*k"', 'C1="Valeurs+k"', 'D1="Valeurs/k"', 'E1="Valeurs-k"', 'G1="k="', 'H1=2']
            aide: |-
              <p>Les en-têtes de la question 1 sont déjà en place. GeoGebra écrit les formules avec ses propres noms et une virgule entre les nombres : <code>=ALEA.ENTRE.BORNES(1;100)</code> devient <code>=AléaEntreBornes(1,100)</code> et <code>=MOYENNE(A2:A21)</code> devient <code>=Moyenne(A2:A21)</code>. Le symbole <code>$</code> s'utilise comme dans la fiche. Pour recopier vers le bas, fais glisser le petit carré du coin de la cellule.</p>
            aide_titre: "Coup de pouce : les formules dans le tableur de GeoGebra"
            commandes_aide:
              - "A2 : =AléaEntreBornes(1,100)"
              - "B2 : =A2*H1"
              - "A22 : =Moyenne(A2:A21)"
      - n: 4
        titre: Écart type
        outils: Tableur GeoGebra
        outils_pdf: tableur GeoGebra
        consigne: |-
          <p>Nombre de buts marqués par certaines joueuses de handball durant les championnats d'Europe 2016, 2018, 2020 et 2022 (tableau de la fiche, déjà recopié dans la feuille ci-dessous).</p>
          <ol>
          <li>Saisir <code>=MOYENNE(B2:B5)</code> dans la cellule B6 puis recopier vers la droite afin de remplir la ligne 6.</li>
          <li>a) Pourquoi peut-on considérer que les trois premières joueuses sont globalement du même niveau ? b) Classer intuitivement ces trois joueuses de la moins régulière à la plus régulière. c) L'écart type est un indicateur permettant de mesurer si les valeurs d'une série statistique sont plus ou moins proches de sa moyenne : plus il est petit, plus elles en sont proches. Saisir <code>=ECARTYPEP(B2:B5)</code> dans la cellule B7 et recopier vers la droite jusqu'à D7 (et pas plus loin). d) Les résultats affichés confirment-ils la réponse à la question 2. b) ?</li>
          <li>Laquelle des séries des buts marqués par Stine Bredal Oftedal et Nathalie Hagman paraît avoir le plus grand écart type ? Expliquer pourquoi. Vérifier avec le tableur.</li>
          </ol>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 3 (questions 1 à 3), p. 315 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            titre: Tableur de GeoGebra
            app: classic
            perspective: S
            commandes: ['B1="Bölk"', 'C1="Tranborg"', 'D1="Van der Heijden"', 'E1="Oftedal"', 'F1="Hagman"', 'A2=2016', 'A3=2018', 'A4=2020', 'A5=2022', 'B2=16', 'C2=24', 'D2=18', 'E2=20', 'F2=17', 'B3=20', 'C3=18', 'D3=14', 'E3=33', 'F3=35', 'B4=19', 'C4=19', 'D4=21', 'E4=31', 'F4=14', 'B5=28', 'C5=23', 'D5=34', 'E5=34', 'F5=43', 'A6="Moyenne de buts"', 'A7="Écart type"']
            aide: |-
              <p>Le tableau de la fiche est déjà recopié. Dans GeoGebra, <code>=MOYENNE(B2:B5)</code> s'écrit <code>=Moyenne(B2:B5)</code> et <code>=ECARTYPEP(B2:B5)</code> s'écrit <code>=EcartType(B2:B5)</code> (c'est le même écart type). Pour recopier vers la droite, fais glisser le petit carré du coin de la cellule.</p>
            aide_titre: "Coup de pouce : les formules dans le tableur de GeoGebra"
            commandes_aide:
              - "B6 : =Moyenne(B2:B5)"
              - "B7 : =EcartType(B2:B5)"

  seconde-ch14:
    activites:
      - n: 3
        titre: Variations des fonctions de référence
        outils: GeoGebra
        consigne: |-
          <p>Le but de cette activité est de dresser les tableaux de variations de fonctions de référence.</p>
          <ol>
          <li>a) On considère la fonction carré définie sur $\mathbb{R}$ par $f(x)=x^2$. À l'aide d'un logiciel ou d'une calculatrice, tracer la courbe de la fonction carré. b) Compléter le tableau de variations de la fiche.</li>
          <li>En procédant de la même manière, dresser le tableau de variations des fonctions suivantes. a) La fonction racine carrée définie sur $\mathbb{R}^+$ par $x\mapsto\sqrt{x}$. b) La fonction cube définie sur $\mathbb{R}$ par $x\mapsto x^3$. c) La fonction inverse définie sur $\mathbb{R}^*$ par $x\mapsto\dfrac1x$.</li>
          </ol>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 3 (questions 1 et 2), p. 239 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-5, -4, 5, 6]
            commandes: []
            aide: |-
              <p>Tape l'expression de chaque fonction dans « Saisie ». Pour n'en voir qu'une, clique sur la pastille à gauche des autres.</p>
            commandes_aide:
              - "f(x)=x^2"
              - "g(x)=sqrt(x)"
              - "h(x)=x^3"
              - "q(x)=1/x"
      - n: 4
        titre: Extremum d'une fonction
        outils: GeoGebra
        consigne: |-
          <p>Une entreprise produit et vend des bonnets de bain. Le prix de vente unitaire peut être fixé entre $1$ € et $10$ €. Le gérant modélise la recette journalière, en milliers d'euros, en fonction du prix de vente par une fonction $f$ définie sur $[1\,;10]$ par $f(x)=-x^2+10x$.</p>
          <p><b>1.</b> a) Tracer sa courbe représentative à l'aide d'un logiciel de géométrie dynamique ou d'une calculatrice. b) En déduire la plus grande image par la fonction $f$. Préciser pour quelle valeur de $x$ cette image maximale est atteinte.</p>
          <p>Les questions 2 et 3 se traitent sur la fiche.</p>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 4 (questions 1 à 3), p. 239 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-1, -3, 11, 28]
            commandes: []
            aide: |-
              <p>Pour tracer $f$ seulement sur $[1\,;10]$, utilise la commande <code>Fonction</code> ci-dessous. Pour lire les coordonnées d'un point de la courbe, place un point dessus avec l'outil « Point ».</p>
            commandes_aide:
              - "f(x)=Fonction(-x^2+10x,1,10)"

  seconde-ch15:
    activites:
      - n: 2
        titre: Droite et vecteur
        outils: GeoGebra
        consigne: |-
          <p>On considère deux points $A$ et $B$ distincts.</p>
          <ol>
          <li>Sur GeoGebra, construire une droite $(AB)$, créer le vecteur $\overrightarrow{AB}$, un curseur $k$ dans l'intervalle $[-5\,;5]$ avec un incrément de $0{,}1$ et le vecteur $k\overrightarrow{AB}$, puis son représentant d'origine $A$ pour créer le point $M$. Le point $M$ est donc défini par $\overrightarrow{AM}=k\overrightarrow{AB}$ où $k$ est un réel que l'on appelle « paramètre ».</li>
          <li>Pour quelle valeur de $k$ le point $M$ est-il confondu avec le point $A$ ?</li>
          <li>Pour quelle valeur de $k$ le point $M$ est-il confondu avec le point $B$ ?</li>
          <li>Pour quelle valeur de $k$ le point $M$ est-il au milieu $C$ du segment $[AB]$ ?</li>
          <li>Où se situent tous les points $M$ pour lesquels : a) $k$ est un réel compris entre $0$ et $1$ ? b) $k&gt;1$ ? c) $k&lt;0$ ?</li>
          <li>On considère maintenant les points $N$ tels que $\overrightarrow{BN}=h\overrightarrow{BC}$ où $h$ est un réel. a) Où se situent tous les points $N$ ? b) Quelles sont alors les valeurs du paramètre $h$ correspondant aux points $A$, $B$ et $C$ ? c) Dans ce cas, quel point joue le rôle de l'origine et quel est un vecteur directeur de la droite $(AB)$ ?</li>
          </ol>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 1, p. 178 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-6, -4, 8, 6]
            commandes: []
            aide: |-
              <p>Tu peux construire avec les outils (Point, Droite, Vecteur, Curseur) ou taper les commandes ci-dessous. Le point $M$ s'obtient en ajoutant à $A$ le vecteur $k\overrightarrow{AB}$.</p>
            commandes_aide:
              - "A=(1,1)"
              - "B=(4,2)"
              - "d=Droite(A,B)"
              - "u=Vecteur(A,B)"
              - "k=Curseur(-5,5,0.1)"
              - "M=A+k*u"
              - "Vecteur(A,M)"

  seconde-ch17:
    activites:
      - n: 2
        titre: Familles de droites
        outils: GeoGebra
        consigne: |-
          <ol>
          <li>Sur GeoGebra, créer deux curseurs $m$ et $p$, en les faisant varier de $-5$ à $5$ avec un incrément de $0{,}5$, puis taper dans la zone de saisie l'équation $y=mx+p$. Donner l'équation de la droite qui s'affiche.</li>
          <li>Faire varier la valeur de $p$ à l'aide du curseur. a) Que peut-on dire de l'intersection de ces droites avec l'axe des ordonnées ? b) Comment sont toutes les droites obtenues ?</li>
          <li>Faire varier la valeur de $m$ à l'aide du curseur. a) Que peut-on remarquer ? b) Que se passe-t-il selon le signe de $m$ ?</li>
          </ol>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 2, p. 178 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-10, -8, 10, 8]
            commandes: []
            aide: |-
              <p>Le repère est prêt, à toi de créer les curseurs : outil « Curseur » (icône <i>a=2</i>) ou commande dans la zone « Saisie » à gauche. Pour bouger un curseur, fais glisser son point.</p>
            commandes_aide:
              - "m=Curseur(-5,5,0.5)"
              - "p=Curseur(-5,5,0.5)"
              - "y=m*x+p"
      - n: 3
        titre: Intersection de deux droites
        outils: GeoGebra
        consigne: |-
          <p>On souhaite trouver les coordonnées du point d'intersection des droites d'équations cartésiennes $5x-6y+4=0$ et $-6x+9y-7=0$.</p>
          <p><b>1.</b> a) Tracer les deux droites (à la main ou avec un logiciel) et donner une valeur approchée des coordonnées de leur point d'intersection.</p>
          <p>b) Vérifier par le calcul que le point $I\left(\frac23\,;\frac{11}{9}\right)$ appartient bien aux deux droites.</p>
        source: "Sésamath, Maths 2de (Magnard, 2023), d'après l'activité 4 (question 1), p. 179 — licence CC BY-SA 3.0."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-4, -3, 4, 3]
            commandes: []
            aide: |-
              <p>Tape chaque équation dans la zone « Saisie », puis place le point d'intersection (outil « Intersection » ou commande). La question b) se fait sur ta feuille.</p>
            commandes_aide:
              - "d1:5x-6y+4=0"
              - "d2:-6x+9y-7=0"
              - "I=Intersection(d1,d2)"

  seconde-ch18:
    activites:
      - n: 1
        titre: Simuler une expérience aléatoire
        outils: Python
        consigne: |-
          <ol>
          <li>Écrire le programme Python ci-dessous puis l'exécuter plusieurs fois. Que fait la commande <code>random.random()</code> ?</li>
          <li>Quelle est la probabilité que le résultat de la commande <code>random.random()</code> soit inférieur à : a) $0{,}5$ ? b) $0{,}25$ ? c) $\frac15$ ?</li>
          <li>Recopier et compléter : « Lorsque l'on lance un dé équilibré à $6$ faces, la probabilité d'obtenir $6$ est $p=\ldots$ c'est-à-dire la même que la probabilité que le résultat de <code>random.random()</code> soit inférieur à … »</li>
          <li>Écrire et compléter le programme permettant de simuler le lancer d'un dé suivant que le résultat soit $6$ ou non (deuxième éditeur).</li>
          <li>a) Reprendre la question 1. en remplaçant <code>random.random()</code> par <code>random.randint(1,4)</code> puis par <code>random.randint(5,12)</code>. b) Écrire un programme simulant le lancer d'un dé à $10$ faces à l'aide de la commande <code>random.randint</code>.</li>
          </ol>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 4 (questions 1 à 5), p. 344 — licence CC BY-SA 3.0."
        blocs:
          - type: python
            titre: Python — questions 1 et 5
            lignes: 3
            code: |-
              import random
              print(random.random())
          - type: python
            titre: Python — question 4
            lignes: 6
            code: |-
              import random
              if random.random()<...:
                  print("Le résultat est 6.")
              else:
                  print("Le résultat n'est pas 6.")
            aide: |-
              <p>Remplace <code>...</code> par le nombre trouvé à la question 3, puis exécute le programme plusieurs fois.</p>
      - n: 2
        titre: Fluctuation d'échantillonnage et loi des grands nombres
        outils: Python (à la place du tableur)
        outils_pdf: Python, à la place du tableur
        consigne: |-
          <p>On rappelle que la fonction <code>ALEA()</code> du tableur renvoie un nombre décimal dans l'intervalle $[0\,;1[$. En 2022, dans la population française, il y a $23{,}7\,\%$ de personnes âgées de moins de $20$ ans.</p>
          <ol>
          <li>a) Si l'on interroge une personne au hasard dans la population française, quelle est la probabilité $p$ qu'elle ait moins de $20$ ans ? b) Écrire dans la cellule A1 : <code>=SI(ALEA()&lt;0,237;"MOINS DE 20";"20 OU PLUS")</code>. c) Recopier et compléter : « Dans la cellule A1, on a simulé le tirage au sort d'une personne dans la population française en tirant au hasard un nombre décimal entre … et … et en considérant que si ce nombre est … alors la personne tirée au sort a moins de $20$ ans. »</li>
          <li>a) Simuler un échantillon de $500$ personnes en recopiant le contenu de A1 jusqu'à A500. b) Saisir <code>=NB.SI(A1:A500;"MOINS DE 20")</code> dans la cellule C1. À quoi ce résultat correspond-il ? c) Simuler un nouvel échantillon de $500$ personnes en appuyant sur la touche F9. Qu'observe-t-on ? d) Saisir une formule dans la cellule C2, faisant référence à C1, donnant la fréquence $f$ d'individus de moins de $20$ ans dans l'échantillon. Calculer l'écart entre $f$ et $p$. e) Simuler quelques autres échantillons à l'aide de la touche F9 et calculer l'écart entre $f$ et $p$ dans chaque cas.</li>
          <li>a) Simuler un échantillon de $10\,000$ personnes en recopiant jusqu'à la cellule A10000. b) Modifier les formules des cellules C1 et C2 pour qu'elles affichent le nombre et la fréquence $f$ de personnes de moins de $20$ ans dans l'échantillon de taille $10\,000$. c) Simuler plusieurs échantillons et calculer l'écart entre $f$ et $p$ dans chaque cas. d) Comparer les écarts obtenus avec ceux de la question 2. e). Que peut-on conclure ?</li>
          </ol>
        source: "Sésamath, Maths 2de (Magnard, 2023), activité 5, p. 344 — licence CC BY-SA 3.0."
        blocs:
          - type: python
            titre: Python — même simulation que le tableur
            lignes: 11
            code: |-
              import random
              n = 500
              compteur = 0
              for i in range(n):
                  if random.random() < 0.237:
                      compteur = compteur + 1
              print("Moins de 20 ans :", compteur)
              f = ...
              print("Fréquence :", f)
            aide: |-
              <p>Un tableur en ligne de 500 ou 10 000 lignes est trop lent sur un téléphone : ce programme fait le même travail. Chaque passage dans la boucle tire une personne au hasard (comme une cellule <code>=SI(ALEA()&lt;0,237;…)</code>) et <code>compteur</code> joue le rôle de <code>NB.SI</code>. Chaque exécution simule un nouvel échantillon (comme la touche F9). Complète la ligne <code>f = ...</code> (question 2. d), puis remplace <code>500</code> par <code>10000</code> pour la question 3.</p>

  # ───────────────────────── Première spécialité ─────────────────────────

  premiere-spe-ch1:
    activites:
      - n: 1
        titre: Découvrir les fonctions polynômes de degré 2
        outils: GeoGebra
        consigne: |-
          <p>L'objectif de cette activité est d'étudier les fonctions dont l'expression est de la forme $ax^2+bx+c$, avec $a$, $b$ et $c$ trois réels.</p>
          <p><b>1.</b> Ouvrir un logiciel de géométrie dynamique. <b>2.</b> Tracer en bleu la fonction $f$ définie sur $\mathbb R$ par $f(x)=x^2$.</p>
          <p><b>A. Influence du paramètre $a$.</b> 1. Créer un curseur $a$ ayant pour minimum $-10$, maximum $10$ et pour incrément $1$. 2. Tracer en rouge la fonction $g$ définie sur $\mathbb R$ par $g(x)=ax^2$. 3. Faire varier la valeur du curseur $a$ et observer comment évolue la courbe représentative de $g$. 4. Selon les valeurs de $a$, dresser le tableau de variations de $g$.</p>
          <p><b>B. Influence du paramètre $c$.</b> 1. Créer un curseur $c$ ayant pour minimum $-10$, maximum $10$ et pour incrément $1$. 2. Tracer en vert la fonction $h$ définie sur $\mathbb R$ par $h(x)=ax^2+c$. 3. Pour différentes valeurs du curseur $a$, faire varier la valeur du curseur $c$ et observer comment évolue la courbe représentative de $h$. 4. Que peut-on dire des variations de $g$ et $h$ ?</p>
          <p><b>C. Influence du paramètre $b$.</b> 1. Créer un curseur $b$ ayant pour minimum $-10$, maximum $10$ et pour incrément $1$. 2. Ne plus afficher la courbe représentative de $g$ et tracer en rose la fonction $k$ définie sur $\mathbb R$ par $k(x)=ax^2+bx+c$. 3. Faire varier la valeur du curseur $b$ et observer comment évolue la courbe représentative de $k$. 4. Que peut-on dire des variations de $h$ et $k$ ?</p>
        source: "D'après Sésamath, manuel Maths 1re spécialité (Magnard, 2019), p. 82, activité 1 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-10, -12, 10, 12]
            commandes: []
            aide: |-
              <p>Pour changer la couleur d'une courbe : clic droit (ou appui long) sur la courbe, puis « Propriétés », onglet « Couleur ». Pour masquer $g$, clique sur sa pastille dans la colonne de gauche.</p>
            commandes_aide:
              - "f(x)=x^2"
              - "a=Curseur(-10,10,1)"
              - "g(x)=a*x^2"
              - "c=Curseur(-10,10,1)"
              - "h(x)=a*x^2+c"
              - "b=Curseur(-10,10,1)"
              - "k(x)=a*x^2+b*x+c"

  premiere-spe-ch2:
    activites:
      - n: 2
        titre: Calculer un accroissement moyen, une vitesse moyenne
        outils: GeoGebra
        consigne: |-
          <p>Soit la fonction $f$ définie sur l'intervalle $[0\,;\,2]$ par $f(x)=32x^3-90x^2+100x$. Les parties A et B se traitent sur la fiche ; en ligne, on fait la partie C.</p>
          <p><b>C. Vérification graphique.</b> On souhaite confirmer les résultats à l'aide de GeoGebra.</p>
          <ol>
          <li>Saisir <code>f(x)=Fonction[32x^3-90x^2+100x,0,2]</code>.</li>
          <li>Ajuster les unités sur chaque axe : clic droit sur le graphique, puis « axe X : axeY » et sélectionner « 1:100 ».</li>
          <li>Pour vérifier la réponse à la question 2. de la première partie, placer deux points $A$ et $B$ aux extrémités de la courbe et lire le coefficient directeur de la droite $(AB)$ à l'aide de l'outil « pente ».</li>
          <li>Pour vérifier le résultat de la question 4. (partie A ou B) : a) Construire le point $M(0{,}5\,;\,f(0{,}5))$. b) Créer un curseur $h$ variant de $-0{,}1$ à $0{,}1$ avec un incrément de $0{,}001$. c) Construire le point $N(0{,}5+h\,;\,f(0{,}5+h))$. d) Tracer la droite $(MN)$ et afficher son coefficient directeur. e) En faisant varier le curseur, rapprocher le plus possible le point $N$ du point $M$ sans qu'ils ne soient confondus. Vérifier que le résultat correspond à celui trouvé dans la partie précédente.</li>
          </ol>
          <p>Cette « ultime droite » obtenue lorsque les deux points sont (presque) confondus s'appelle la <b>tangente</b> à la courbe.</p>
        source: "D'après Sésamath, manuel Maths 1re spécialité (Magnard, 2019), p. 112-113, activité 2 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-0.3, -10, 2.3, 120]
            commandes: []
            aide: |-
              <p>La fenêtre est déjà réglée pour voir toute la courbe (question 2). Avec le clavier, on peut aussi taper les commandes ci-dessous.</p>
            commandes_aide:
              - "f(x)=Fonction(32x^3-90x^2+100x,0,2)"
              - "A=(0,f(0))"
              - "B=(2,f(2))"
              - "d=Droite(A,B)"
              - "Pente(d)"
              - "M=(0.5,f(0.5))"
              - "h=Curseur(-0.1,0.1,0.001)"
              - "N=(0.5+h,f(0.5+h))"
              - "s=Droite(M,N)"
              - "Pente(s)"

  premiere-spe-ch4:
    activites:
      - n: 1
        titre: Relier une fonction et sa dérivée
        outils: GeoGebra
        consigne: &relier-consigne |-
          <p>On considère la fonction $f$ définie sur $\mathbb R$ par $f(x)=x^3-6x^2-15x+34$.</p>
          <p><b>A. Conjecturer avec un logiciel de géométrie dynamique</b></p>
          <p><b>1.</b> a) Tracer la courbe de la fonction $f$. Pour cela, saisir <code>f(x) = x^3 - 6x^2 - 15x + 34</code>. b) Ajuster les unités sur chaque axe en faisant clic droit sur le graphique, puis « axe X : axeY », sélectionner <code>1:10</code>. c) Créer un curseur $a$ variant de $-5$ à $9$, avec un incrément de $0.1$. d) Créer un point $A$ d'abscisse $a$ sur la courbe de $f$. Pour cela, saisir <code>A=(a,f(a))</code>. e) Créer la tangente à la courbe de $f$ en $A$. f) Afficher le coefficient directeur (ou pente) de la tangente à la courbe en $A$.</p>
          <p><b>2.</b> Déplacer le point $A$ sur la courbe de $f$ à l'aide du curseur et observer le signe du coefficient directeur de la tangente en chaque point. a) Que peut-on dire de la tangente si son coefficient directeur est positif ? Que peut-on alors en déduire pour la courbe ? b) Même question si le coefficient directeur est négatif.</p>
          <p>Les questions 3 à 6 et la partie B se traitent sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths 1re spécialité (Magnard, 2019), p. 144, activité 1 — licence CC BY-SA 3.0 FR."
        blocs:
          - &relier-ggb
            type: geogebra
            app: classic
            perspective: AG
            fenetre: [-6, -100, 10, 100]
            commandes: []
            aide: |-
              <p>La fenêtre est déjà réglée pour voir les deux « bosses » de la courbe (question 1. b).</p>
            commandes_aide:
              - "f(x)=x^3-6x^2-15x+34"
              - "a=Curseur(-5,9,0.1)"
              - "A=(a,f(a))"
              - "t=Tangente(A,f)"
              - "Pente(t)"

  premiere-spe-ch6:
    activites:
      - n: 2
        titre: Optimisation
        outils: Tableur GeoGebra
        outils_pdf: tableur GeoGebra
        consigne: |-
          <p>Un bassin rectangulaire de $80$ m² est installé au pied d'un rocher, qui forme l'un de ses côtés (schéma sur la fiche) ; $L_1$ est la longueur des deux côtés perpendiculaires au rocher et $L_2$ celle du côté parallèle. On cherche les dimensions pour lesquelles la longueur totale de la bordure est minimale.</p>
          <p><b>A. Utilisation d'un tableur</b></p>
          <ol>
          <li>Ouvrir une feuille de calcul et noter les intitulés des quantités que l'on souhaite étudier (A1 : Longueur $L_1$ du bassin ; B1 : Longueur $L_2$ du bassin ; C1 : Longueur totale de la bordure). On fera varier le côté $L_1$ de $0{,}1$ à $20$ avec un pas de $0{,}1$ afin d'avoir une bonne précision.</li>
          <li>Quelle formule doit-on entrer dans la cellule B2, et recopier vers le bas, pour obtenir la longueur $L_2$ du bassin en fonction de sa longueur $L_1$ ?</li>
          <li>Quelle formule doit-on entrer dans la cellule C2, et recopier vers le bas, pour obtenir la longueur totale de la bordure ?</li>
          <li>Quelles semblent être les dimensions qui permettent de réduire au minimum la longueur de la bordure ?</li>
          </ol>
          <p>La partie B se traite sur la fiche.</p>
        source: "D'après Sésamath, manuel Maths 1re spécialité (Magnard, 2019), p. 145, activité 2 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            titre: Tableur de GeoGebra
            app: classic
            perspective: S
            commandes: ['A1="L1"', 'B1="L2"', 'C1="Bordure"']
            aide: |-
              <p>Les intitulés sont en place. Tape <code>0.1</code> en A2 (la virgule s'écrit avec un point), <code>=A2+0.1</code> en A3, puis recopie vers le bas jusqu'à la ligne 201 (fais glisser le petit carré du coin de la cellule). Écris ensuite tes formules en B2 et C2 et recopie-les vers le bas.</p>
            aide_titre: "Coup de pouce : la colonne A"
            commandes_aide:
              - "A2 : 0.1"
              - "A3 : =A2+0.1"

  premiere-spe-ch9:
    activites:
      - n: 1
        titre: Des triangles presque rectangles
        outils: GeoGebra
        consigne: |-
          <p>Quand un triangle $ABC$ est rectangle en $A$, on sait d'après le théorème de Pythagore que l'on a $AB^2+AC^2=BC^2$, mais combien vaut le nombre $P=\dfrac12\left(AB^2+AC^2-BC^2\right)$ si le triangle n'est pas rectangle ?</p>
          <p><b>1.</b> Dans GeoGebra, construire un triangle $ABC$ quelconque et le projeté orthogonal $H$ de $B$ sur la droite $(AC)$.</p>
          <p><b>2.</b> Quand on a créé les segments et l'angle, des nombres sont apparus dans la fenêtre d'algèbre qui correspondent aux longueurs de ces segments et à la valeur de l'angle. Dans la ligne de saisie, écrire alors une formule qui calcule $P$ à l'aide des lettres correspondantes.</p>
          <p><b>3.</b> Vérifier que quand le triangle est rectangle en $A$ alors $P=0$.</p>
          <p>Les questions 4 à 6 se traitent sur la fiche.</p>
        source: "D'après Sésamath, Maths 1re spécialité (Magnard, 2019), p. 224, activité 1 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-2, -2, 8, 5]
            commandes: []
            aide: |-
              <p>Avec <code>Polygone(A, B, C)</code>, GeoGebra nomme chaque côté par la lettre minuscule du sommet opposé : $a=BC$, $b=CA$, $c=AB$. Déplace ensuite les points pour rendre le triangle rectangle en $A$.</p>
            commandes_aide:
              - "A=(0,0)"
              - "B=(2,3)"
              - "C=(5,0)"
              - "Polygone(A,B,C)"
              - "d=Droite(A,C)"
              - "H=PointPlusProche(d,B)"
              - "Angle(C,A,B)"
              - "P=0.5*(c*c+b*b-a*a)"

  premiere-spe-ch12:
    activites:
      - n: 3
        titre: Ensemble de points
        outils: GeoGebra
        consigne: |-
          <p>On donne deux points $A$ et $B$ tels que $AB=6$ et on cherche à étudier la valeur du produit scalaire $\overrightarrow{MA}\cdot\overrightarrow{MB}$ quand $M$ est un point du plan. La partie A se traite sur la fiche.</p>
          <p><b>B. Manipulation avec GeoGebra.</b> 1. Dans GeoGebra, créer un segment $[AB]$ de longueur $6$. 2. Placer un point quelconque dans le plan et le renommer $M$. 3. Créer les vecteurs $\vec u=\overrightarrow{MA}$ et $\vec v=\overrightarrow{MB}$, leurs coordonnées apparaissent dans la fenêtre d'Algèbre (dans GeoGebra il n'y a pas de flèche sur les vecteurs). 4. Dans la ligne de saisie, écrire <code>ProduitScalaire(u,v)</code>, un Nombre $a$ se crée dans la fenêtre d'Algèbre. 5. Faire varier le point $M$ et retrouver les résultats de la partie A. 6. Conjecturer l'ensemble des points $M$ tels que $\overrightarrow{MA}\cdot\overrightarrow{MB}=0$.</p>
          <p><b>C. 3.</b> Avec l'icône Lier/Libérer Point, lier le point $M$ au cercle de diamètre $[AB]$ pour vérifier votre résultat.</p>
          <p><b>D. 1.</b> Créer plusieurs cercles de centre $I$ et lier le point $M$ sur chacun d'entre eux successivement. 2. Qu'observe-t-on pour le produit scalaire $\overrightarrow{MA}\cdot\overrightarrow{MB}$ ? 3. Créer un cercle de centre un point $C$, distinct de $I$, et lier $M$ à ce cercle. Observe-t-on le même résultat ?</p>
          <p>Les autres questions des parties C et D se traitent sur la fiche.</p>
        source: "D'après Sésamath, Maths 1re spécialité (Magnard, 2019), p. 225, activité 3 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            app: classic
            perspective: AG
            fenetre: [-3, -5, 9, 5]
            commandes: []
            aide: |-
              <p>L'outil « Lier/Libérer point » se trouve dans le menu des points (deuxième icône de la barre d'outils) : clique sur $M$ puis sur le cercle.</p>
            commandes_aide:
              - "A=(0,0)"
              - "B=(6,0)"
              - "Segment(A,B)"
              - "M=(2,3)"
              - "u=Vecteur(M,A)"
              - "v=Vecteur(M,B)"
              - "ProduitScalaire(u,v)"
              - "I=MilieuCentre(A,B)"
              - "Cercle(I,3)"

  premiere-spe-ch13:
    activites:
      - n: 2
        titre: Construction graphique de la fonction exponentielle
        outils: Calculatrice NumWorks · Python
        outils_pdf: calculatrice NumWorks ou Python
        consigne: |-
          <p>On cherche à construire une fonction $f$ définie et dérivable sur $\mathbb R$ telle que $f'=f$ et $f(0)=1$ (méthode d'Euler : questions 1 et 2 sur la fiche).</p>
          <p><b>3.</b> Dans cette question, on suppose que $h=\dfrac1n$ où $n\in\mathbb N^*$. a) Expliquer pourquoi le $n$-ième point a pour coordonnées $\left(1\,;\,\left(1+\dfrac1n\right)^n\right)$. b) Soit $(u_n)$ la suite définie par $u_n=\left(1+\dfrac1n\right)^n$. Observer les termes de la suite à l'aide de la calculatrice. c) Quel est le comportement de la suite $(u_n)$ quand $n$ tend vers $+\infty$ ? On note $e$ la limite de la suite $(u_n)$. Donner une valeur approchée de $e$.</p>
        source: "D'après Sésamath, Maths 1re spécialité (Magnard, 2019), p. 170, activité 2 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: numworks
            aide: |-
              <p>Application <b>Suites</b> : définis $u_n=(1+1/n)^n$, puis ouvre le <b>Tableau</b> des valeurs (commence à $n=1$ dans les réglages de l'intervalle).</p>
          - type: python
            titre: Ou avec Python
            lignes: 3
            code: |-
              n = 10
              u = (1 + 1/n)**n
              print(u)
            aide: |-
              <p>Change la valeur de <code>n</code> (100, 1000, 1000000…) et exécute à nouveau.</p>

  premiere-spe-ch15:
    activites:
      - n: 3
        titre: Découvrir la notion d'espérance
        outils: Python (à la place du tableur)
        outils_pdf: Python, à la place du tableur
        consigne: &esperance-consigne |-
          <p>Anouk propose le jeu suivant : on mise 1 €, on lance deux dés équilibrés dont les faces sont numérotées de 1 à 6, puis on gagne une somme égale à la différence entre les deux dés (le plus grand résultat auquel on soustrait le plus petit). Par exemple, en tenant compte de la mise de départ, si les dés tombent sur 6 et 3, on gagne $6-3-1=2$ €. Reyanne souhaite étudier la situation, et notamment le gain moyen qu'elle peut espérer à ce jeu. Pour cela, elle établit une simulation du jeu sur tableur.</p>
          <p><b>1.</b> Obtenir à l'aide du tableur une simulation similaire. On établira un échantillon de 1 000 simulations (fonctions du tableur données sur la fiche : <code>ALEA.ENTRE.BORNES</code>, <code>MIN</code>, <code>MAX</code>, <code>MOYENNE</code>).</p>
          <p><b>2.</b> En utilisant la simulation, donner une approximation du gain qu'elle peut espérer en moyenne à ce jeu.</p>
          <p>Les questions 3 à 5 se traitent sur la fiche.</p>
        source: "D'après Sésamath, Maths 1re spécialité (Magnard, 2019), p. 299, activité 3 — licence CC BY-SA 3.0 FR."
        blocs:
          - &esperance-py
            type: python
            titre: Python — même simulation que le tableur
            lignes: 11
            code: |-
              import random
              n = 1000
              total = 0
              for i in range(n):
                  d1 = random.randint(1, 6)
                  d2 = random.randint(1, 6)
                  gain = ...
                  total = total + gain
              print("Gain moyen :", total / n)
            aide: |-
              <p>Un tableur en ligne de 1 000 lignes est trop lent sur un téléphone : ce programme fait le même travail. Chaque passage dans la boucle joue une partie (une ligne du tableur) : <code>random.randint(1, 6)</code> correspond à <code>ALEA.ENTRE.BORNES(1;6)</code>, et <code>max(d1, d2)</code>, <code>min(d1, d2)</code> à <code>MAX</code> et <code>MIN</code>. Complète la ligne <code>gain = ...</code>, puis exécute plusieurs fois.</p>

  # ───────────────────────── Terminale technologique (tronc commun) ─────────────────────────

  tale-techno-commun-ch1:
    activites:
      - n: 1
        titre: Le paradoxe d'Achille et de la tortue
        outils: Tableur GeoGebra
        outils_pdf: tableur GeoGebra
        consigne: |-
          <p>Achille laisse une avance de $900$ mètres à la tortue et court à une vitesse dix fois supérieure à celle de la tortue. On note $A_n$ la position d'Achille à l'étape $n$ et $T_n$ celle de la tortue. Étape 0 : Achille est au départ de la course et la tortue est à $900$ mètres. Étape 1 : Achille arrive à la position $900$ mètres et la tortue est arrivée à une position $T_1$. Étape 2 : Achille arrive à la position $T_1$ et la tortue est arrivée à une position $T_2$. Et ainsi de suite.</p>
          <p><b>A. Étude à l'aide d'un tableur</b> (colonnes : A $n$, B $A_n$, C $T_n$, D $T_n-A_n$)</p>
          <ol>
          <li>Ouvrir un tableur, recopier le tableau et remplir la colonne A avec les valeurs de $n$ allant de $0$ à $20$.</li>
          <li>Quelle est la valeur à mettre dans la cellule B2 ? dans la cellule C2 ?</li>
          <li>Quelle est la formule à entrer dans la cellule D2 ?</li>
          <li>Lorsque Achille parcourt $k$ mètres, combien de mètres parcourt la tortue ?</li>
          <li>En déduire les formules à entrer dans les cellules B3 et C3.</li>
          <li>Par recopie vers le bas, compléter les colonnes B, C et D. Que constate-t-on ?</li>
          </ol>
          <p>Les parties B et C se traitent sur la fiche.</p>
        source: "D'après Sésamath, Maths Terminale spécialité (Magnard, 2020), travaux pratiques 2 « Paradoxe de Zénon », p. 45 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            titre: Tableur de GeoGebra
            app: classic
            perspective: S
            commandes: ['A1="n"', 'B1="An"', 'C1="Tn"', 'D1="Tn-An"']
            aide: |-
              <p>Les en-têtes sont en place. Une formule commence par <code>=</code> ; pour recopier vers le bas, fais glisser le petit carré du coin de la cellule.</p>
            aide_titre: "Coup de pouce : la colonne A"
            commandes_aide:
              - "A2 : 0"
              - "A3 : =A2+1   (puis recopier vers le bas jusqu'à A22)"
      - n: 2
        titre: Le modèle de Malthus
        outils: Tableur GeoGebra · Python
        outils_pdf: tableur GeoGebra, Python
        consigne: |-
          <p>On s'intéresse à la population d'un pays. On suppose qu'en 1800, il y avait $5$ millions d'habitants, et que la population augmente chaque année de $1\,\%$. En 1800, les subsistances peuvent nourrir $10$ millions d'habitants et chaque année, grâce au progrès de la technologie, elles peuvent nourrir $100\,000$ personnes de plus. On note $P_n$ la population en millions d'habitants en $1800+n$ et $a_n$ le nombre d'individus, en millions, pouvant être nourris par les subsistances en $1800+n$. (Partie A sur la fiche.)</p>
          <p><b>B. 1.</b> Ouvrir un tableur et recopier le tableau (A1 Année, B1 $P_n$, C1 $a_n$). <b>2.</b> a) Compléter la colonne A pour qu'elle contienne toutes les années de 1800 à 2000. b) Quelle valeur faut-il entrer dans la cellule B2 ? dans la cellule C2 ? c) Quelle formule faut-il entrer dans la cellule B3 pour obtenir par recopie vers le bas tous les termes de la suite $(P_n)$ dans la colonne B ? d) Quelle formule faut-il entrer dans la cellule C3 pour obtenir par recopie vers le bas tous les termes de la suite $(a_n)$ dans la colonne C ? e) Compléter les colonnes B et C.</p>
          <p><b>3.</b> À l'aide de la fonction « nuage de points », représenter graphiquement $P_n$ et $a_n$ en fonction de l'année. <b>4.</b> À l'aide du tableur, déterminer au bout de combien d'années la population aura doublé. <b>5.</b> À l'aide du tableur, déterminer en quelle année la situation devient problématique.</p>
          <p><b>6.</b> Écrire un programme en Python permettant de déterminer l'année où la situation devient problématique. <b>7.</b> Que peut-on penser de ce modèle ? (sur la fiche)</p>
        source: "D'après Sésamath, Maths Terminale spécialité (Magnard, 2020), travaux pratiques 3 « Modèle de Malthus », p. 46 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            titre: Tableur de GeoGebra (questions 1 à 5)
            app: classic
            perspective: SG
            fenetre: [1790, -5, 2010, 40]
            commandes: ['A1="Année"', 'B1="Pn"', 'C1="an"']
            aide: |-
              <p>Les en-têtes sont en place. Pour le nuage de points (question 3) : sélectionne les cellules des colonnes A et B, puis outil « Liste de points » (deuxième icône de la barre). Fais de même avec les colonnes A et C.</p>
            aide_titre: "Coup de pouce : la colonne A"
            commandes_aide:
              - "A2 : 1800"
              - "A3 : =A2+1   (puis recopier vers le bas jusqu'à A202)"
          - type: python
            titre: Python (question 6)
            lignes: 9
            code: |-
              annee = 1800
              P = 5
              a = 10
              while False:
                  annee = annee + 1
                  P = ...
                  a = ...
              print(annee)
            aide: |-
              <p>Remplace <code>False</code> par la condition qui fait continuer la boucle (tant que les subsistances suffisent), puis complète les <code>...</code>.</p>

  tale-techno-commun-ch2:
    activites:
      - n: 3
        titre: Condition de croissance d'une population
        outils: Tableur GeoGebra
        outils_pdf: tableur GeoGebra
        consigne: |-
          <p>Pour modéliser la forte croissance d'une population de lapins élevés en captivité, un chercheur suppose que cette population double chaque mois. Il dispose initialement de $100$ lapins. On note $N(t)$ le nombre de lapins (en centaines) au bout de $t$ mois.</p>
          <p><b>1.</b> a) Ouvrir une feuille de calcul, reproduire et compléter le tableau de la fiche ($t$ de $0$ à $5$ mois ; lignes $N(t)$, avec $N(0)=1$, et $2^t$). b) Que peut-on dire des lignes 2 et 3 ?</p>
          <p><b>2.</b> On suppose maintenant que la population augmente de $10\,\%$ tous les dixièmes de mois (tous les trois jours). a) Reproduire et compléter le tableau ($t$ de $0$ à $0{,}5$ par pas de $0{,}1$ ; $N(0)=1$). b) Quelle relation peut-on conjecturer entre les quantités $N(t)$ et $N(t+0{,}1)$ ?</p>
        source: "D'après Sésamath, Maths 1re spécialité (Magnard, 2019), activité 1 « Condition de croissance d'une population », questions 1 et 2 p. 170 — licence CC BY-SA 3.0 FR."
        blocs:
          - type: geogebra
            titre: Tableur de GeoGebra
            app: classic
            perspective: S
            commandes: ['A1="t"', 'A2="N(t)"', 'A3="2^t"', 'B1=0', 'B2=1']
            aide: |-
              <p>Le début du premier tableau est en place (comme sur la fiche, les valeurs de $t$ sont en ligne). Une formule commence par <code>=</code> ; pour recopier vers la droite, fais glisser le petit carré du coin de la cellule. $2^t$ s'écrit <code>2^B1</code>.</p>
            aide_titre: "Coup de pouce : la ligne 1"
            commandes_aide:
              - "C1 : =B1+1   (puis recopier vers la droite jusqu'à G1)"

