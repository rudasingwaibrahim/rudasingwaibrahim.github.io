<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Pilote du Lagon · Sigma Arcade</title>
<meta name="description" content="Vecteurs en Seconde : translation, somme et relation de Chasles, produit par un réel, colinéarité et déterminant, alignement, parallélisme, milieu et distance. Tu pilotes une vedette dans le lagon : chaque vecteur est un déplacement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sigma-arcade/sigma-theme.css">
<style>
/* VOICE : complice, précis, jamais enfantin ; on réessaie toujours.
   IDEA : l'élève pilote une vedette de nuit dans le lagon ; un vecteur EST un déplacement : on l'enchaîne, on l'additionne, on l'étire.
   PICTURE : le lagon la nuit, quadrillé par un repère de balises ; la vedette glisse et laisse un sillage.
   COLOUR and TYPE : nuit « océan profond », accent violet-bleu pour l'action, or pour les réussites, corail pour les erreurs ; Outfit.
   LAYOUT : lagon et bandeau à gauche (collés en haut sur téléphone), carnet de bord à droite. */
:root{
--ink:var(--sg-text);--mut:var(--sg-muted);--line:var(--sg-border-strong);--soft:var(--sg-border);
--ac:var(--sg-accent);--acsoft:var(--sg-accent-soft);--on:var(--sg-on-accent);--ok:var(--sg-ok);--ko:var(--sg-coral);
--gold:var(--sg-gold);--gold2:var(--sg-gold-bright);--solid:var(--sg-panel-solid);--raise:var(--sg-raise);
--cu:#8ea6ff;--cv:#e8c766;--cw:#4fd1c5}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{overflow-x:clip}
body{margin:0;color:var(--ink);font:17px/1.55 var(--sg-font)}
header{max-width:1320px;margin:auto;padding:18px max(3vw,16px) 4px}
h1{font-size:clamp(32px,4vw,46px);font-weight:800;letter-spacing:-.01em;line-height:1.08;margin:2px 0 6px}
header p{margin:0;color:var(--mut);max-width:72ch}
.back{display:inline-flex;align-items:center;min-height:32px;margin:0 0 6px;font-weight:600;text-decoration:none;border-bottom:2px solid var(--ac)}
button{font-family:var(--sg-font)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
/* barre des niveaux */
.lv{max-width:1320px;margin:10px auto 0;padding:0 max(3vw,16px);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.lv button{min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 15px var(--sg-font);cursor:pointer;transition:background .15s,border-color .15s}
.lv button:hover{background:var(--sg-hover);border-color:var(--ac)}
.lv button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 6px 20px -10px var(--sg-glow)}
.lv .ck{margin-left:6px;color:var(--gold2);letter-spacing:-1px}
.lv button[aria-pressed=true] .ck{color:#3b2c00}
.lv .sp{flex:1}
.lv .tool{border-style:dashed;font-size:14px;padding:0 11px}
.lv .tool[aria-pressed=true]{background:var(--acsoft);color:var(--ink);border-color:var(--ac);box-shadow:none}
/* mise en page */
.app{max-width:1320px;margin:auto;padding:14px max(3vw,16px) 48px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:clamp(18px,2.4vw,32px);align-items:start}
.scol{position:sticky;top:10px}
.stage{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;border:1px solid var(--soft);box-shadow:var(--sg-shadow-card);background:#040b1a;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.badge{position:absolute;left:10px;top:10px;z-index:2;font:600 13px var(--sg-font);padding:3px 11px;border-radius:999px;background:rgba(4,9,20,.78);color:var(--mut);border:1px solid var(--soft);pointer-events:none;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.capt{margin-top:10px;min-height:54px;padding:10px 16px;border-radius:14px;background:linear-gradient(150deg,#10213d,#081224 75%);border:1px solid var(--soft);
  font:700 clamp(18px,1.9vw,22px)/1.35 var(--sg-font);text-align:center;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 .35em}
.capt .k{color:var(--gold2)}.capt .r{color:var(--ko)}.capt .m{color:var(--mut);font-weight:600}.capt .w{color:var(--cw)}
.panel{background:var(--sg-panel);border:1px solid var(--soft);box-shadow:var(--sg-shadow-card);border-radius:16px;padding:20px clamp(16px,2.2vw,26px)}
.chap{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#aebfff}
.panel h2{font-size:24px;line-height:1.2;margin:2px 0 10px}
.cours{margin:0 0 14px;border:1px solid var(--soft);border-radius:12px;background:rgba(255,255,255,.025)}
.cours summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 14px;font-weight:600;color:var(--mut);list-style:none}
.cours summary::-webkit-details-marker{display:none}
.cours summary::before{content:"▸";margin-right:8px;transition:transform .2s}
.cours[open] summary::before{transform:rotate(90deg)}
.cours .rule{padding:0 14px 12px;border-left:4px solid var(--gold);margin:0 14px 12px;font-size:16px;line-height:1.75}
.cours .rule p{margin:6px 0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.c{background:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}.dot.g{background:var(--ok)}.dot.r{background:var(--ko)}
.qn{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.prompt{font-size:18px;line-height:1.75;margin:0 0 12px}
.prompt b{color:var(--gold2)}
.part{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--soft)}
.part:first-child{border-top:0;padding-top:0;margin-top:0}
.part.done{opacity:.72}
.ask{font-weight:600;margin:0 0 10px;line-height:1.75}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--raise);color:var(--ink);font:600 16px var(--sg-font);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--ac);background:#18305a}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.or{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 6px 20px -8px var(--sg-glow)}.btn.or:hover:not(:disabled){background:#86a2ff;border-color:#86a2ff}
.btn.gh{background:transparent}.btn.gh:hover:not(:disabled){background:var(--sg-hover)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.did{background:transparent;border-color:rgba(95,210,124,.5);color:var(--ok);opacity:1}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts{display:grid;gap:10px}
.opt{min-height:52px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);color:var(--ink);font:600 17px/1.7 var(--sg-font);text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ac);background:rgba(108,142,255,.1)}
.opt.ok{border-color:var(--ok);background:rgba(95,210,124,.14)}.opt.ko{border-color:var(--ko);background:rgba(255,107,107,.1);opacity:.75}
.opt:disabled{cursor:default}
.fill{font:700 clamp(19px,2.2vw,23px)/2.3 var(--sg-font);font-variant-numeric:tabular-nums}
.in{width:3.4em;height:46px;margin:0 3px;padding:0 6px;font:700 20px var(--sg-font);text-align:center;border:1.5px solid var(--line);border-bottom:3px solid var(--ac);border-radius:10px;background:var(--solid);color:var(--ink);vertical-align:middle}
.in.ok{border-color:var(--ok);color:var(--ok)}.in.ko{border-color:var(--ko);color:var(--ko)}
.in:disabled{opacity:1}
.hint{color:var(--mut);font-size:15px;margin:8px 0 0}
/* écritures mathématiques */
.vec{display:inline-block;position:relative;padding-top:.36em;line-height:1;font-style:normal}
.vec.it{font-style:italic;padding-right:.06em}
.vec::before{content:"";position:absolute;left:.04em;right:.1em;top:.14em;border-top:.085em solid currentColor}
.vec::after{content:"";position:absolute;right:.06em;top:.03em;width:.22em;height:.22em;border-top:.085em solid currentColor;border-right:.085em solid currentColor;transform:rotate(45deg)}
.cv{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .08em;font-variant-numeric:tabular-nums}
.cv>.pa{font-weight:300;font-size:1.9em;line-height:1;transform:translateY(-.06em)}
.cv>.cs{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;padding:0 .12em}
.cv .in,.cv .sk-in{margin:2px 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;line-height:1.1;font-variant-numeric:tabular-nums}
.fr>span{padding:0 .2em}.fr>span:first-child{border-bottom:2px solid currentColor}
.sq{white-space:nowrap}.sq>span{border-top:.08em solid currentColor;padding:0 .08em;margin-left:.02em}
.det{display:inline-flex;align-items:center;vertical-align:middle;border-left:2px solid currentColor;border-right:2px solid currentColor;padding:0 .3em;margin:0 .15em;line-height:1.15}
.det>span{display:inline-flex;flex-direction:column;align-items:center;padding:0 .25em}
.sk-q,.sk-ch{line-height:1.75}
.nw{white-space:nowrap}
.sk-q sup .sk-in{width:3em!important}
/* pilotage */
.pilot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:2px 0 12px}
.pilot .lab{font:700 21px var(--sg-font);display:inline-flex;align-items:center;gap:8px}
.steps{display:inline-flex;flex-direction:column;gap:6px}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--solid)}
.step button{width:48px;height:46px;font:600 24px var(--sg-font);border:0;background:transparent;color:var(--ink);cursor:pointer}
.step button:hover{background:var(--sg-hover)}
.step input{width:3.4em;height:46px;border:0;border-left:1px solid var(--soft);border-right:1px solid var(--soft);background:transparent;color:var(--ink);font:700 21px var(--sg-font);text-align:center;font-variant-numeric:tabular-nums}
.step .ax{width:38px;text-align:center;font:600 14px var(--sg-font);color:var(--mut)}
.paren{font:300 64px/1 var(--sg-font);color:var(--mut);transform:translateY(-4px)}
/* retours */
.fb{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,107,107,.07);border-left:4px solid var(--ko)}
.fb .mk svg{width:52px;height:52px;flex:none}
.fb b{display:block;font-size:18px}
.fb p{margin:2px 0 0;line-height:1.7}
.win{margin-top:16px;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(200,168,75,.55);background:linear-gradient(150deg,rgba(200,168,75,.12),rgba(200,168,75,.03));animation:pop .35s ease-out}
.win .top{display:flex;gap:12px;align-items:center}
.win .mk svg{width:60px;height:60px;flex:none}
.win .big{font-size:22px;font-weight:800;color:var(--gold2)}
.win p{margin:6px 0 12px;line-height:1.75}
.mk{display:inline-flex}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding-top:8px}
  .scol{top:0;z-index:6;margin:0 calc(-1 * max(3vw,16px));padding:6px max(3vw,16px) 8px;background:rgba(6,13,26,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--soft)}
  .stage{aspect-ratio:auto;height:clamp(210px,36svh,330px);border-radius:14px}
  .capt{margin-top:6px;min-height:40px;padding:5px 10px;font-size:16px;border-radius:10px}
}
@media (max-width:520px){
  .lv{gap:6px}.lv button{padding:0 11px;font-size:14px}
  .panel{padding:16px 14px}
  .panel h2{font-size:21px}
  .prompt{font-size:17px}
  .pilot{gap:10px}
  .step button{width:46px}
  .sk-final-btn .s{display:inline!important}
}
@media (prefers-reduced-motion:reduce){.win{animation:none}}
</style>
</head>
<body>
<header>
<a class="back" href="/sigma-arcade/">← Sigma Arcade</a>
<h1>Le Pilote du Lagon</h1>
<p>Cette nuit, tu pilotes la vedette du lagon. Chaque ordre de pilotage est un vecteur&nbsp;: on l'enchaîne, on l'additionne, on l'étire, on le renverse. Le lagon est quadrillé par un repère de balises&nbsp;: à toi de viser juste.</p>
</header>
<nav class="lv" id="lv" aria-label="Niveaux"></nav>
<main class="app">
<div class="scol" id="scol">
  <div class="stage" id="stage" role="img" aria-label="Le lagon quadrillé, la vedette et ses vecteurs de déplacement">
    <canvas id="cv" aria-hidden="true"></canvas>
    <span class="badge" id="badge"></span>
  </div>
  <div class="capt" id="capt" aria-live="polite"></div>
</div>
<section class="panel" id="panel">
  <div class="chap" id="chap"></div>
  <h2 id="lvt"></h2>
  <details class="cours" id="cours"><summary>Le cours</summary><div class="rule" id="rule"></div></details>
  <div class="qhead"><div class="dots" id="dots"></div><span class="qn" id="qn"></span></div>
  <div class="prompt" id="prompt"></div>
  <div id="work"></div>
  <div class="fb" id="fb" hidden><span class="mk" id="fbmk"></span><div><b id="fbt">Pas tout à fait.</b><p id="fbp"></p></div></div>
  <div class="win" id="win" hidden><div class="top"><span class="mk" id="winmk"></span><div class="big" id="winx"></div></div><p id="winp"></p>
    <div class="btns"><button class="btn or" id="next" type="button">Question suivante →</button></div></div>
</section>
</main>
<script>
/* ======================= LE PILOTE DU LAGON — outils et scène ======================= */
(function(){
'use strict';
const $=id=>document.getElementById(id);
const reduceM=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- nombres et écritures ---------- */
const f=n=>{if(Object.is(n,-0)||Math.abs(n)<1e-12)n=0;const a=Math.abs(n),s=Number.isInteger(a)?String(a):String(+a.toFixed(6)).replace('.',',');return (n<0?'−':'')+s};
const ans=n=>{const s=f(n);return s[0]==='−'?[s,'-'+s.slice(1)]:[s]};
const P=(nm,p)=>`${nm}(${f(p[0])}&nbsp;; ${f(p[1])})`;
const V=s=>`<span class="vec${s.length===1?' it':''}">${s}</span>`;
const nw=h=>String(h).replace(/(^|[\s(;,=+])(k|−|\d+)(<span class="vec[^"]*">[^<]*<\/span>)/g,'$1<span class="nw">$2$3</span>').replace(/((?:<span class="(?:vec|cv|sq|fr)[^"]*">(?:(?!<\/span><\/span><\/span>).)*?<\/span>(?:<\/span>)*)|\))(&nbsp;|\u00a0)([:;!?])/g,'<span class="nw">$1$2$3</span>');
const Vi=V('ı'),Vj=V('ȷ'),V0=V('0');
const col=(a,b)=>`<span class="cv"><span class="pa">(</span><span class="cs"><span>${typeof a==='number'?f(a):a}</span><span>${typeof b==='number'?f(b):b}</span></span><span class="pa">)</span></span>`;
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sq=n=>`<span class="sq">√<span>${n}</span></span>`;
const dett=(u,v)=>`<span class="det"><span><span>${f(u[0])}</span><span>${f(u[1])}</span></span><span><span>${f(v[0])}</span><span>${f(v[1])}</span></span></span>`;
const kfmt=k=>{if(k===1)return '';if(k===-1)return '−';if(Number.isInteger(k))return f(k);for(let d=2;d<=12;d++){const n=Math.round(Math.abs(k)*d);if(Math.abs(Math.abs(k)*d-n)<1e-9)return (k<0?'−':'')+fr(n,d)}return f(k)};
const kV=(k,s)=>kfmt(k)+V(s);
/* x ı + y ȷ sans « + − » ni « 1ı » */
const lin=(x,y)=>{const t=(c,v,first)=>c===0?'':(first?(c<0?'−':''):(c<0?' − ':' + '))+(Math.abs(c)===1?'':f(Math.abs(c)))+v;
  if(!x&&!y)return V0;const a=t(x,Vi,true),b=t(y,Vj,!x);return a+b};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=(a,b)=>{let v;do v=ri(a,b);while(!v);return v};
const add=(p,q,s=1)=>[p[0]+s*q[0],p[1]+s*q[1]];
const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
const mul=(k,v)=>[k*v[0],k*v[1]];
const det=(a,b)=>a[0]*b[1]-b[0]*a[1];
const same=(a,b)=>Math.abs(a[0]-b[0])<1e-9&&Math.abs(a[1]-b[1])<1e-9;
const inG=p=>Math.abs(p[0])<=6&&Math.abs(p[1])<=4;
const rp=(m=6,n=4)=>[ri(-m,m),ri(-n,n)];
const rv=(m=4,n=3)=>{let v;do v=[ri(-m,m),ri(-n,n)];while(!v[0]&&!v[1]);return v};
const until=g=>{for(let i=0;i<4000;i++){const r=g();if(r)return r}throw new Error('génération impossible')};
const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
/* racine : a√b avec b sans facteur carré */
const rad=n=>{let k=1,b=n;for(let d=2;d*d<=b;d++)while(b%(d*d)===0){b/=d*d;k*=d}return [k,b]};
const radH=n=>{const [k,b]=rad(n);return b===1?f(k):(k===1?'':f(k))+sq(b)};
const lens=(...pts)=>new Set(pts.map(p=>p.join(','))).size===pts.length;

/* ---------- scène : le lagon ---------- */
const C={u:'#8ea6ff',v:'#e8c766',w:'#4fd1c5',ko:'#ff6b6b',pt:'#f0f4ff',mut:'rgba(200,215,255,.62)',ghost:'rgba(240,244,255,.55)',gold:'#e8c766'};
const SC=(function(){
  const cv=$('cv'),cx=cv.getContext('2d');
  let W=1,H=1,dpr=1,u=40,ox=0,oy=0,bg=null;
  let S;
  function reset(o){S={pts:{},arr:{},boats:[],lines:[],segs:[],marks:[],goals:{},ij:!!(o&&o.ij),rt:null}}
  reset();
  const T=(x,y)=>[ox+x*u,oy-y*u];
  function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);u=Math.min(W/14.6,H/9.4);ox=W/2;oy=H/2;bg=null}
  new ResizeObserver(fit).observe(cv);fit();
  /* décor fixe : eau, lune, côte de Grande-Terre (mis en cache) */
  function decor(){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const g=c.getContext('2d');g.scale(dpr,dpr);
    const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#071631');gr.addColorStop(.5,'#06122a');gr.addColorStop(1,'#030a18');g.fillStyle=gr;g.fillRect(0,0,W,H);
    const mx=W*.86,my=H*.1,rg=g.createRadialGradient(mx,my,0,mx,my,H*.55);rg.addColorStop(0,'rgba(233,237,247,.13)');rg.addColorStop(1,'rgba(233,237,247,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
    g.fillStyle='rgba(238,241,248,.85)';g.beginPath();g.arc(mx,my,Math.max(7,H*.035),0,7);g.fill();g.fillStyle='#071631';g.beginPath();g.arc(mx+H*.012,my-H*.008,Math.max(6,H*.031),0,7);g.fill();
    /* reflet de lune */
    for(let i=0;i<12;i++){const y=my+H*.1+i*H*.045,w=(16-i)*W*.0035;g.strokeStyle=`rgba(238,241,248,${(.06-i*.004).toFixed(3)})`;g.lineWidth=1.5;g.beginPath();g.moveTo(mx-w/2+(i%2?3:-3),y);g.quadraticCurveTo(mx+(i%2?3:-3),y-2,mx+w/2+(i%2?3:-3),y);g.stroke()}
    /* côte lointaine */
    g.fillStyle='rgba(9,20,40,.95)';g.beginPath();g.moveTo(0,H*.1);
    for(let x=0;x<=W;x+=W/24){g.lineTo(x,H*(.07+.035*Math.sin(x/W*7.3)+.02*Math.sin(x/W*17)))}g.lineTo(W,0);g.lineTo(0,0);g.fill();
    for(let i=0;i<26;i++){const x=(i*97)%W,y=H*(.05+.03*Math.sin(i*1.7));g.fillStyle=i%4?'rgba(243,207,106,.5)':'rgba(159,180,255,.45)';g.fillRect(x,y,2,2)}

  /* ---------- dessin ---------- */

function nextPart(){const prev=$('work').lastElementChild;if(prev)prev.classList.add('done');
  pi++;if(pi<Q.parts.length){const box=startPart();scrollPart(box)}else win()}
function scrollPart(box){if(innerWidth<=860){const r=box.getBoundingClientRect(),top=$('scol').getBoundingClientRect().bottom;if(r.top<top||r.top>innerHeight-120)scrollTo({top:scrollY+r.top-top-12,behavior:S.reduceM?'auto':'smooth'})}}
const LV=[];
function newQ(){Q=LV[lvl].qs[qi]();pi=0;errs=0;
  SC.reset({ij:!!Q.ij});Q.scene();cap(Q.cap0||'&nbsp;');$('badge').textContent=LV[lvl].ch;
  $('prompt').innerHTML=nw(Q.prompt);$('work').innerHTML='';fb('');$('win').hidden=true;
  $('qn').textContent=`Question ${qi+1} sur ${LV[lvl].qs.length}`;dots();startPart()}
function dots(){const N=LV[lvl].qs.length;$('dots').innerHTML=Array.from({length:N},(_,k)=>`<span class="dot ${k<run.length?(run[k]?'g':'r'):k===qi?'c':''}"></span>`).join('')}
function win(){fb('');SND.win();run.push(errs===0);dots();
  const N=LV[lvl].qs.length,lvlDone=run.length>=N;
  $('winx').textContent=errs===0?pick(['Cap tenu !','Exactement !','Pile sur la balise !','Bien vu !']):pick(['C\'est ça !','Voilà !','Bien rattrapé !']);
  $('winmk').innerHTML=MAKI(errs===0?'joie':'neutre');$('winp').innerHTML=nw(Q.done);
  $('next').textContent=lvlDone?'Voir le bilan du niveau':'Question suivante →';$('next').dataset.go=lvlDone?'end':'';
  $('win').hidden=false;setTimeout(()=>scrollPart($('win')),60)}
function endLevel(){const L=lvl+1,sc=run.filter(Boolean).length,tot=run.length;
  if(window.SigmaKit)SigmaKit.levelComplete({level:L,score:sc,total:tot}).then(v=>{renderLv();if(lvl+1!==L)return;if(v==='next')goLevel(Math.min(lvl+1,LV.length-1));else if(v==='replay')goLevel(lvl)})}
$('next').onclick=()=>{if($('next').dataset.go==='end'){endLevel();return}qi++;newQ();$('scol').scrollIntoView({block:'nearest',behavior:S.reduceM?'auto':'smooth'})};

  `<span class="sp"></span><button type="button" class="tool" id="snd" aria-pressed="${snd}">♪ Bruitages : ${snd?'oui':'non'}</button>`}

  if(b.id==='snd'){snd=!snd;try{localStorage.setItem('sigma-fanfare',snd?'1':'0')}catch(_){}renderLv();SND.pop();return}

/* raison d'un mauvais déplacement */
function whyMove(v,sol,fromNm,toNm,B,A){const parts=[];
  if(same(v,[sol[1],sol[0]])&&sol[0]!==sol[1])return `Tu as échangé les deux nombres&nbsp;: en haut le déplacement horizontal (abscisses), en bas le déplacement vertical (ordonnées).`;
  if(same(v,mul(-1,sol)))return `Bonne direction, mauvais sens&nbsp;: tu es parti de ${toNm} vers ${fromNm}. On calcule <b>arrivée − départ</b>.`;
  if(B&&same(v,B)&&!same(B,sol))return `${col(B[0],B[1])}, ce sont les coordonnées du point ${toNm}, pas le déplacement. On calcule x<sub>${toNm}</sub> − x<sub>${fromNm}</sub> et y<sub>${toNm}</sub> − y<sub>${fromNm}</sub>.`;
  if(A&&B&&same(v,add(A,B))&&!same(add(A,B),sol))return `On ne fait pas la somme des coordonnées&nbsp;: on calcule <b>arrivée − départ</b>.`;
  if(v[0]!==sol[0])parts.push(`horizontalement, compte les carreaux de ${fromNm} à ${toNm}${sol[0]<0?' (vers la gauche&nbsp;: négatif)':''}`);
  if(v[1]!==sol[1])parts.push(`verticalement, compte les carreaux de ${fromNm} à ${toNm}${sol[1]<0?' (vers le bas&nbsp;: négatif)':''}`);
  return `La vedette a manqué la balise. ${parts.length?parts.join('&nbsp;; ').replace(/^./,c=>c.toUpperCase())+'.':''}`}
const dist0=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function projCh(A,Hh,hz,c){const pa=x=>x<0?'('+f(x)+')':f(x);const d=dist0(A,Hh),L=[OK(f(d),d)];const ax=hz?Math.abs(A[1]):Math.abs(A[0]),ot=hz?Math.abs(A[0]-c):Math.abs(A[1]-c);
  if(ax&&ax!==d)L.push(NO(f(ax),hz?'C\'est la distance à l\'axe des abscisses (y = 0), pas au quai.':'C\'est la distance à l\'axe des ordonnées (x = 0), pas au quai.',ax));
  if(ot&&ot!==d&&ot!==ax)L.push(NO(f(ot),hz?'Le quai est horizontal&nbsp;: c\'est l\'écart des <b>ordonnées</b> qui compte, |y<sub>A</sub> − '+pa(c)+'|.':'Le quai est vertical&nbsp;: c\'est l\'écart des <b>abscisses</b> qui compte, |x<sub>A</sub> − '+pa(c)+'|.',ot));
  const sm=d+Math.abs(c);if(L.length<3&&sm!==ax&&sm!==ot&&sm!==d)L.push(NO(f(sm),'On ne cumule pas&nbsp;: AH est l\'écart entre A et le quai, le long de la perpendiculaire.',sm));
  for(let e=1;L.length<3;e++){const x=d+e;if(!L.some(q=>q.v===x))L.push(NO(f(x),'Compte les carreaux le long de la perpendiculaire, de A jusqu\'au quai.',x))}return L}
