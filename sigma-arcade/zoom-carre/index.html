<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoom Carré · Sigma Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sigma-arcade/sigma-theme.css">
<style>
/* IDÉE : le viseur carré d'un appareil photo de téléphone.
   Puissances = appuis répétés sur le zoom (un facteur négatif retourne la photo) ;
   notation scientifique = régler le zoom ×10 jusqu'à lire entre 1 et 10 sur la règle ;
   racine carrée = recadrer un carré : son aire et son côté. */
:root{color-scheme:dark;
--ink:var(--sg-text);--mut:var(--sg-muted);--line:var(--sg-border-strong);--soft:var(--sg-border);
--ac:var(--sg-accent);--acsoft:var(--sg-accent-soft);--on:var(--sg-on-accent);
--gold:var(--sg-gold);--gold2:var(--sg-gold-bright);--ok:var(--sg-ok);--ko:var(--sg-coral);
--solid:var(--sg-panel-solid);--raise:var(--sg-raise)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:17px/1.55 var(--sg-font);overflow-x:clip}
header{max-width:1320px;margin:auto;padding:18px max(3vw,16px) 4px}
h1{font-size:clamp(32px,4vw,46px);font-weight:800;letter-spacing:-.01em;line-height:1.08;margin:2px 0 6px}
header p{margin:0;color:var(--mut);max-width:72ch}
.back{display:inline-flex;align-items:center;min-height:32px;margin:0 0 6px;font-weight:600;text-decoration:none;border-bottom:2px solid var(--ac)}
.lv{max-width:1320px;margin:12px auto 0;padding:0 max(3vw,16px);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.lv button{min-height:44px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 15px var(--sg-font);cursor:pointer;transition:background .15s,border-color .15s}
.lv button:hover{background:var(--sg-hover);border-color:var(--ac)}
.lv button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 6px 20px -10px var(--sg-glow)}
.lv .ck{margin-left:6px;color:var(--gold2);letter-spacing:-1px}
.lv button[aria-pressed=true] .ck{color:#3b2c00}
.lv .sp{flex:1}
.lv .tool{border-style:dashed;font-size:14px;padding:0 12px}
.app{max-width:1320px;margin:auto;padding:14px max(3vw,16px) 48px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(340px,1fr);gap:clamp(18px,2.4vw,32px);align-items:start}
.scol{position:sticky;top:10px}
.stage{position:relative;aspect-ratio:1;width:100%;max-width:min(100%,max(430px,calc(100svh - 330px)));margin:0 auto;border-radius:22px;overflow:hidden;border:1px solid var(--soft);box-shadow:var(--sg-shadow-card);background:#03060e;user-select:none;-webkit-user-select:none}
#vf{display:block;width:100%;height:100%;font-family:var(--sg-font)}
.badge{position:absolute;left:12px;top:12px;z-index:2;font:600 13px var(--sg-font);padding:4px 11px;border-radius:999px;background:rgba(4,9,20,.74);color:var(--mut);border:1px solid var(--soft);pointer-events:none;max-width:calc(100% - 150px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zv{position:absolute;right:12px;top:12px;z-index:2;font:700 15px var(--sg-font);font-variant-numeric:tabular-nums;padding:3px 12px;border-radius:999px;background:rgba(4,9,20,.74);color:var(--gold2);border:1px solid rgba(200,168,75,.4);pointer-events:none}
.zv sup,.capt sup{font-size:.62em;line-height:0}
.capt{max-width:min(100%,max(430px,calc(100svh - 330px)));margin:10px auto 0;min-height:58px;padding:10px 16px;border-radius:14px;background:linear-gradient(150deg,#10213d,#081224 75%);border:1px solid var(--soft);
  font:700 clamp(18px,2.1vw,23px)/1.45 var(--sg-font);font-variant-numeric:tabular-nums;text-align:center;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0 .3em}
.capt>span{display:block;max-width:100%}.capt .g{color:var(--gold2)}.capt .ok{color:var(--ok)}.capt .m{color:var(--mut);font-weight:600;font-size:.82em}
.panel{background:var(--sg-panel);border:1px solid var(--soft);box-shadow:var(--sg-shadow-card);border-radius:16px;padding:20px clamp(16px,2.2vw,26px)}
.kick{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9fb4ff}
.panel h2{font-size:24px;line-height:1.2;margin:2px 0 12px}
.cours{margin:0 0 14px;border:1px solid var(--soft);border-radius:12px;background:rgba(255,255,255,.025)}
.cours summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 14px;font-weight:600;color:var(--mut);list-style:none}
.cours summary::-webkit-details-marker{display:none}
.cours summary::before{content:"▸";margin-right:8px;transition:transform .2s}
.cours[open] summary::before{transform:rotate(90deg)}
.cours .rule{padding:2px 14px 10px;border-left:4px solid var(--gold);margin:0 14px 12px;font-size:16px}
.cours .rule p{margin:6px 0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.c{background:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}.dot.g{background:var(--ok)}.dot.r{background:var(--ko)}
.qn{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.prompt{font-size:18px;line-height:1.55;margin:0 0 12px}
.prompt b{color:var(--gold2)}
.part{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--soft)}
.part:first-child{border-top:0;padding-top:0;margin-top:0}
.part.done{opacity:.7}
.ask{font-weight:600;margin:0 0 10px}
.ask b{color:var(--gold2)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--raise);color:var(--ink);font:600 16px var(--sg-font);cursor:pointer;transition:background .15s,border-color .15s,transform .1s;font-variant-numeric:tabular-nums}
.btn:hover:not(:disabled){border-color:var(--ac);background:#18305a}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.or{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 6px 20px -8px var(--sg-glow)}.btn.or:hover:not(:disabled){background:#86a2ff;border-color:#86a2ff}
.btn.gh{background:transparent}.btn.gh:hover:not(:disabled){background:var(--sg-hover)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn sup{font-size:.65em;line-height:0}
.btn .cnt{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:rgba(0,0,0,.25);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts{display:grid;gap:10px}
.opt{min-height:52px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);color:var(--ink);font:600 18px/1.4 var(--sg-font);text-align:left;cursor:pointer;transition:border-color .15s,background .15s;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--ac);background:rgba(108,142,255,.1)}
.opt.ok{border-color:var(--ok);background:rgba(95,210,124,.14)}.opt.ko{border-color:var(--ko);background:rgba(255,107,107,.1);opacity:.75}
.opt:disabled{cursor:default}
.fl{font:700 clamp(20px,2.2vw,24px)/2.2 var(--sg-font);font-variant-numeric:tabular-nums;margin:0 0 4px}
.fl sup{font-size:.62em;vertical-align:.95em;line-height:0}
.in{width:3.6em;height:46px;margin:0 3px;padding:0 6px;font:700 21px var(--sg-font);text-align:center;border:1.5px solid var(--line);border-bottom:3px solid var(--ac);border-radius:10px;background:var(--solid);color:var(--ink);vertical-align:middle}
.in.w{width:5.4em}.in.xw{width:7.6em}
sup .in{width:2.7em;height:44px;font-size:18px;vertical-align:baseline}
.in:focus{outline:3px solid var(--ac);outline-offset:1px}
.in.ok{border-color:var(--ok);color:var(--ok)}.in.ko{border-color:var(--ko);color:var(--ko)}
.in:disabled{opacity:1}
.kp{display:none;grid-template-columns:repeat(5,minmax(44px,1fr));gap:6px;margin-top:10px;max-width:340px}
body.touch .kp{display:grid}
.kp button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--solid);color:var(--ink);font:700 19px var(--sg-font);cursor:pointer}
.kp button:active{background:var(--acsoft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:52px;min-height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);color:var(--ink);font:700 18px var(--sg-font);font-variant-numeric:tabular-nums;cursor:pointer}
.chip:hover:not(:disabled){border-color:var(--ac)}
.chip.no{border-color:rgba(255,107,107,.45);color:rgba(255,160,150,.85);background:transparent}
.chip.mid{border-color:rgba(200,168,75,.45)}
.chip.yes{border-color:var(--gold);background:rgba(200,168,75,.16);color:var(--gold2)}
.hint{color:var(--mut);font-size:15px;margin:8px 0 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.15;font-variant-numeric:tabular-nums}
.fr>span{padding:0 .22em}
.fr>span:first-child{border-bottom:2px solid currentColor}
.fl .fr{line-height:1.25}.fl .fr .in{margin:2px 3px}
.rt,.nw{white-space:nowrap}.rad{border-top:2px solid currentColor;padding:0 .08em;margin-left:.04em}
.sk-q .rad,.sk-ch .rad{border-top-width:1.5px}
.sk-q sup .sk-in{width:3em!important;height:44px;font-size:18px}
.sk-q .fr .sk-in{margin:3px 4px}
.fb{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,107,107,.07);border-left:4px solid var(--ko)}
.fb.info{background:rgba(108,142,255,.08);border-left-color:var(--ac)}
.fb .mk svg{width:52px;height:52px;flex:none}
.fb b{display:block;font-size:18px}
.fb p{margin:2px 0 0}
.win{margin-top:16px;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(200,168,75,.55);background:linear-gradient(150deg,rgba(200,168,75,.12),rgba(200,168,75,.03));animation:pop .35s ease-out}
.win .top{display:flex;gap:12px;align-items:center}
.win .mk svg{width:60px;height:60px;flex:none}
.win .big{font-size:22px;font-weight:800;color:var(--gold2)}
.win p{margin:8px 0 12px}
.mk{display:inline-flex}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
/* scène */
.lbl{font:600 13px var(--sg-font);fill:rgba(220,230,255,.8)}
.lblb{font:700 15px var(--sg-font);fill:#f0f4ff}
.lblg{font:700 15px var(--sg-font);fill:#e8c766}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#hdl{cursor:grab;touch-action:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding-top:8px}
  .scol{top:0;z-index:6;margin:0 calc(-1 * max(3vw,16px));padding:6px max(3vw,16px) 8px;background:rgba(6,13,26,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--soft)}
  .stage{width:auto;height:clamp(210px,36svh,340px);border-radius:16px}
  .capt{margin-top:6px;min-height:40px;padding:5px 10px;font-size:17px;border-radius:10px;max-width:none}
}
@media (max-width:520px){
  .lv{gap:6px}.lv button{padding:0 11px;font-size:14px}
  .panel{padding:16px 14px}
  .panel h2{font-size:21px}
  .prompt{font-size:17px}
  .fl{font-size:20px}
  .sk-final-btn .s{display:inline!important}
  .badge{display:none}
}
@media (prefers-reduced-motion:reduce){.win,.shake{animation:none}}
</style>
</head>
<body>
<header>
<a class="back" href="/sigma-arcade/">← Sigma Arcade</a>
<h1>Zoom Carré</h1>
<p>Ton téléphone a un viseur carré. Chaque appui sur le zoom multiplie l'image, un facteur négatif la retourne, la règle ×10 mesure de l'atome aux étoiles, et chaque carré cache sa racine&nbsp;: son côté.</p>
</header>
<nav class="lv" id="lv" aria-label="Niveaux"></nav>
<main class="app">
<div class="scol">
  <div class="stage" id="stage" role="img" aria-label="Viseur carré de l'appareil photo">
    <svg id="vf" viewBox="0 0 400 400" aria-hidden="true"></svg>
    <span class="badge" id="badge"></span>
    <span class="zv" id="zv"></span>
  </div>
  <div class="capt" id="capt" aria-live="polite"></div>
</div>
<section class="panel" id="panel">
  <div class="kick" id="kick"></div>
  <h2 id="lt"></h2>
  <details class="cours"><summary>Le cours</summary><div class="rule" id="rule"></div></details>
  <div class="qhead"><div class="dots" id="dots"></div><span class="qn" id="qn"></span></div>
  <p class="prompt" id="prompt"></p>
  <div id="work"></div>
  <div id="fbw"></div>
  <div id="winw"></div>
</section>
</main>

<script>window.SIGMA_MUSIC_STYLE='epique'</script>
<script src="/sigma-arcade/sigma-music.js"></script>
<script src="/sigma-arcade/sigma-kit.js"></script>
<script>
'use strict';
/* ====================================================================
   OUTILS : nombres exacts, écritures françaises
   ==================================================================== */
const $=id=>document.getElementById(id);
const MI='−',NN=' ';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function grp(s){return s.length>4?s.replace(/\B(?=(\d{3})+(?!\d))/g,NN):s}
function N(n){n=Math.round(n);return (n<0?MI:'')+grp(String(Math.abs(n)))}
/* M × 10^k en écriture décimale (M entier) */
function dec(M,k){
  const neg=M<0;let s=String(Math.abs(M));let ip,fp='';
  if(k>=0){ip=s+'0'.repeat(k)}else{const q=-k;if(s.length<=q)s='0'.repeat(q-s.length+1)+s;ip=s.slice(0,s.length-q);fp=s.slice(s.length-q).replace(/0+$/,'')}
  ip=ip.replace(/^0+(?=\d)/,'');
  let out=grp(ip);
  if(fp)out+=','+(fp.length>4?fp.replace(/(\d{3})(?=\d)/g,'$1'+NN):fp);
  return (neg&&out!=='0'?MI:'')+out;
}
function decPlain(M,k){return dec(M,k).replace(/ /g,'').replace(MI,'-')}
const sup=n=>`<sup>${N(n)}</sup>`;
const bH=b=>typeof b==='string'?b:(b<0?`(${N(b)})`:N(b));
const pw=(b,n)=>`${bH(b)}${sup(n)}`;
const rt=x=>`<span class="rt">√<span class="rad">${x}</span></span>`;
const crt=(c,x)=>(c===1?'':c===-1?MI:N(c))+rt(x);
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const ex=h=>`<span class="ex">${h}</span>`;
const p10=n=>`10${sup(n)}`;
const dig=M=>String(Math.abs(M)).length;
function strip(M,e){if(M===0)return[0,0];while(M%10===0){M/=10;e++}return[M,e]}
/* notation scientifique de M×10^e : [D, n] avec a = D×10^-(len-1) */
function sciOf(M,e){[M,e]=strip(M,e);return[M,e+dig(M)-1]}
function sciH(M,e){const[D,n]=sciOf(M,e);return `${dec(D,-(dig(D)-1))} × ${p10(n)}`}
const mant=(D)=>dec(D,-(dig(D)-1));
function divDec(a,b){for(let k=0;k<9;k++){const A=a*10**k;if(A%b===0)return[A/b,-k]}return null}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function frac(p,q){const g=gcd(p,q);p/=g;q/=g;if(q<0){p=-p;q=-q}return q===1?N(p):(p<0?MI:'')+fr(N(Math.abs(p)),N(q))}
function ipow(b,n){let v=1;for(let i=0;i<n;i++)v*=b;return v}
/* valeur exacte de b^n : [p,q] */
function powPQ(b,n){return n>=0?[ipow(b,n),1]:(ipow(b,-n)<0?[-1,-ipow(b,-n)]:[1,ipow(b,-n)])}
function pqH(pq){return frac(pq[0],pq[1])}
/* plus grand k tel que k² divise n */
function kmaxOf(n){let k=1;for(let j=2;j*j<=n;j++)if(n%(j*j)===0)k=j;return k}
function parseNum(s){
  s=String(s).replace(/[\s  ]/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
  if(s[0]==='+')s=s.slice(1);
  let m=s.match(/^(-?)(\d+)\/(\d+)$/);if(m){const q=+m[3];return q?[(m[1]?-1:1)*+m[2],q]:null}
  m=s.match(/^(-?)(\d*)(?:\.(\d*))?$/);if(!m||!(m[2]+(m[3]||'')).length)return null;
  const f=m[3]||'';return[(m[1]?-1:1)*Number((m[2]||'0')+f),10**f.length];
}
const eqNum=(a,b)=>a&&b&&a[0]*b[1]===b[0]*a[1];

/* ====================================================================
   SONS (bruitages) — clé partagée sigma-fanfare
   ==================================================================== */
let soundOn=true;try{soundOn=localStorage.getItem('sigma-fanfare')!=='0'}catch(e){}
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,v,type,at){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;const t=c.currentTime+(at||0);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02)}
function sfx(k){if(!soundOn)return;try{
  if(k==='clic'){tone(1800,.04,.05,'square');tone(900,.06,.04,'triangle',.03)}
  else if(k==='flip'){tone(520,.12,.05,'triangle');tone(780,.12,.04,'triangle',.06)}
  else if(k==='ok'){tone(660,.14,.07);tone(990,.22,.06,'sine',.09)}
  else if(k==='ko'){tone(220,.18,.06,'triangle')}
  else if(k==='pop'){tone(880,.08,.05,'triangle')}
}catch(e){}}

/* ====================================================================
   SCÈNE : le viseur carré
   ==================================================================== */
const VF=$('vf');
let SC={mode:null};
const tw=(d,fn)=>new Promise(r=>{if(RM||d<=0){fn(1);r();return}const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/d);fn(k<1?(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2):1);if(k<1)requestAnimationFrame(f);else r()};requestAnimationFrame(f)});
const wait=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
const SVGDEF=`<defs>
<clipPath id="clip"><rect width="400" height="400" rx="22"/></clipPath>
<linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030814"/><stop offset=".62" stop-color="#0d2147"/><stop offset=".63" stop-color="#0e2a4f"/><stop offset="1" stop-color="#04101f"/></linearGradient>
<linearGradient id="g-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d48a"/><stop offset="1" stop-color="#b98d3d"/></linearGradient>
<linearGradient id="g-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe39a"/><stop offset="1" stop-color="#c8a84b"/></linearGradient>
<radialGradient id="g-moon"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
<linearGradient id="g-sq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c766" stop-opacity=".34"/><stop offset="1" stop-color="#c8a84b" stop-opacity=".14"/></linearGradient>
<pattern id="p-void" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#050a15"/><path d="M0 0H20V20" fill="none" stroke="#0c1628" stroke-width="1"/></pattern>
</defs>`;
/* coins du viseur (cadre de mise au point) */
const BRK=`<g fill="none" stroke="rgba(240,244,255,.1)" stroke-width="1"><path d="M133.3 0V400M266.7 0V400M0 133.3H400M0 266.7H400"/></g>`;
const BRK0='';

/* ---------- mode ZOOM (puissances) ---------- */
const ZMAX=20,ZMIN=1/16,VB=.14; /* à ×1 la photo mesure 56 unités : l'agrandissement affiché est exact de ×1/16 à ×20 */
function zScale(n){const v=Math.pow(Math.abs(SC.base),n);return VB*Math.min(ZMAX,Math.max(ZMIN,v))}
function zAng(n){return (SC.base<0?180*n:0)+(SC.minus?180:0)}
function zApply(s,a){const g=$('photo');if(g)g.setAttribute('transform',`translate(200 190) rotate(${a}) scale(${s}) translate(-200 -200)`)}
function bLab(b){return b<0?`(${N(b)})`:N(b)}
function zValH(b,n,minus){ /* valeur exacte en HTML (ou écriture puissance si trop grande) */
  const big=n>=0?Math.abs(ipow(b,n))>1e7:Math.abs(ipow(b,-n))>1e7;
  if(big)return (minus?MI:'')+pw(b,n);
  let pq=powPQ(b,n);if(minus)pq=[-pq[0],pq[1]];
  if(pq[1]!==1){const d=divDec(Math.abs(pq[0]),pq[1]);if(d&&String(Math.abs(d[0])).length<=4)return (pq[0]<0?MI:'')+dec(d[0],d[1])}
  return pqH(pq);
}
const SUPC=x=>String(x).replace(/[-−]/g,'⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]);
function zTxt(b,n){ /* libellé court pour la règle des zooms */
  const pq=powPQ(b,n),neg=pq[0]*pq[1]<0;
  if(n>=0)return Math.abs(pq[0])<=9999?N(pq[0]):bLab(b)+SUPC(n);
  const d=divDec(Math.abs(pq[0]),Math.abs(pq[1]));if(d&&dig(d[0])<=3)return (neg?MI:'')+dec(d[0],d[1]);
  return Math.abs(pq[1])<=999?(neg?MI:'')+'1/'+Math.abs(pq[1]):bLab(b)+SUPC(n);
}
function sceneZoom(o){
  SC={mode:'zoom',base:o.base,n:o.n||0,lo:o.lo??-1,hi:o.hi??4,minus:!!o.minus,jumps:[]};
  VF.innerHTML=SVGDEF+`<g clip-path="url(#clip)"><rect width="400" height="400" fill="url(#p-void)"/><g id="photo">${PHOTO}</g>${BRK}<rect x="176" y="166" width="48" height="48" rx="6" fill="none" stroke="rgba(232,199,102,.7)" stroke-width="1.5"/></g><g id="jmp"></g><g id="trk"></g>`;
  zApply(zScale(SC.n),zAng(SC.n));drawTrack();zInfo();
  setBadge('Zoom '+(o.base<0?'×('+N(o.base)+')':'×'+N(o.base))+' par appui');
}
function tx(k){return 40+(k-SC.lo)*(320/Math.max(1,SC.hi-SC.lo))}
function drawTrack(){
  const g=$('trk');if(!g)return;let h=`<rect x="14" y="336" width="372" height="52" rx="26" fill="rgba(4,9,20,.78)" stroke="rgba(120,160,255,.28)"/>`;
  h+=`<text x="26" y="352" class="lbl" style="font-size:10px">exposant</text>`;
  const span=SC.hi-SC.lo,many=span>10;
  for(let k=SC.lo;k<=SC.hi;k++){
    const x=tx(k),on=k===SC.n;
    if(!many||k%2===0||on)h+=`<text x="${x}" y="${on?366:368}" text-anchor="middle" class="lbl" style="font-size:${on?0:12}px">${N(k)}</text>`;
    h+=`<circle cx="${x}" cy="376" r="${k===0?3.4:2.4}" fill="${k===0?'#f0f4ff':'rgba(200,215,255,.55)'}"/>`;
  }
  const x=tx(SC.n),t=zTxt(SC.base,SC.n);
  const tl=xL(t),pwid=Math.max(48,tl.length*7.4+12);h+=`<g><rect x="${x-pwid/2}" y="350" width="${pwid}" height="34" rx="17" fill="#e8c766"/><text x="${x}" y="364" text-anchor="middle" style="font:700 10px Outfit,system-ui,sans-serif;fill:#3b2c00">exp. ${N(SC.n)}</text><text x="${x}" y="379" text-anchor="middle" style="font:800 12px Outfit,system-ui,sans-serif;fill:#1d1400">${tl}</text></g>`;
  g.innerHTML=h;
}
const xL=v=>v.startsWith(MI)?`×(${v})`:'×'+v;
function zInfo(){
  const b=SC.base,n=SC.n;
  setZv(xL(zValH(b,n,SC.minus)));
  let h;const P=pw(b,n);
  if(n===0)h=`${(SC.minus?MI:'')+P} = ${SC.minus?MI:''}1 <span class="m">aucun appui : image inchangée</span>`;
  else if(n>0){const f=n<=5?Array(n).fill(bLab(b)).join(' × '):`${bLab(b)} × … × ${bLab(b)} <span class="m">(${n} facteurs)</span>`;
    h=SC.minus?`${MI}${P} = ${MI}(${f}) = <span class="g">${zValH(b,n,true)}</span>`:`${P} = ${f} = <span class="g">${zValH(b,n)}</span>`}
  else h=`${(SC.minus?MI:'')+P} = ${SC.minus?MI:''}${fr(1,pw(b,-n))} = <span class="g">${zValH(b,n,SC.minus)}</span>`;
  setCapt(h);
}
async function zStep(d,dur){
  const n0=SC.n,n1=n0+d;SC.n=n1;sfx(SC.base<0?'flip':'clic');
  const s0=zScale(n0),s1=zScale(n1),a0=zAng(n0),a1=zAng(n1);
  await tw(dur??420,k=>zApply(s0*Math.pow(s1/s0,k),a0+(a1-a0)*k));drawTrack();zInfo();
}
async function zFlipMinus(){const s=zScale(SC.n),a0=zAng(SC.n);SC.minus=true;sfx('flip');await tw(520,k=>zApply(s,a0+180*k));zInfo()}
async function zJump(d,lab){
  const k0=SC.n,k1=k0+d,x0=tx(k0),x1=tx(k1),hgt=Math.min(70,18+Math.abs(x1-x0)*.35);
  const g=$('jmp'),col=d>=0?'#9fb4ff':'#ff9b7a';
  const id='j'+Math.random().toString(36).slice(2,7);
  g.insertAdjacentHTML('beforeend',`<path id="${id}" d="M${x0} 346 Q${(x0+x1)/2} ${346-2*hgt} ${x1} 346" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><text x="${(x0+x1)/2}" y="${346-hgt-8}" text-anchor="middle" style="font:800 14px Outfit,system-ui,sans-serif;fill:${col}">${lab}</text>`);
  const p=$(id),s0=zScale(k0),s1Fin=(SC.n=k1,zScale(k1)),a0=zAng(k0),a1=zAng(k1);SC.n=k0;
  sfx('clic');
  await tw(620,k=>{p.setAttribute('stroke-dashoffset',1-k);zApply(s0*Math.pow(s1Fin/s0,k),a0+(a1-a0)*k)});
  SC.n=k1;drawTrack();zInfo();
}

function band(n){if(n<=-8)return['nano','#170c36','#05030f'];if(n<=-4)return['micro','#05303a','#021219'];if(n<=2)return['à taille humaine','#0d2147','#050c1a'];if(n<=8)return['planète','#0b2a52','#020814'];return['cosmos','#0a0620','#000']}
function sceneSci(o){
  SC={mode:'sci',M:o.M,e:o.e,n:o.n,obj:o.obj,unit:o.unit===undefined?'m':o.unit,name:o.name||''};
  let tk='';for(let i=0;i<=10;i++){const x=40+i*32;tk+=`<path d="M${x} 300v${i%5?10:16}" stroke="#f0f4ff" stroke-width="${i%5?1.5:2.2}"/><text x="${x}" y="334" text-anchor="middle" class="lbl">${i}</text>`;
    if(i<10)for(let j=1;j<10;j++)tk+=`<path d="M${x+j*3.2} 300v5" stroke="rgba(240,244,255,.45)" stroke-width="1"/>`}
  VF.innerHTML=SVGDEF+`<g clip-path="url(#clip)"><rect width="400" height="400" id="sbg"/><g id="sdeco"></g>
  <g transform="translate(200 98)" id="sico">${ICON[o.obj]||ICON.calc}</g>
  <text x="200" y="168" text-anchor="middle" class="lblb" id="sname"></text>
  <rect x="72" y="291" width="288" height="9" fill="rgba(95,210,124,.3)"/><text x="216" y="284" text-anchor="middle" class="lbl" style="fill:#8fe0a4;font-size:11px">zone de lecture : de 1 à 10 (10 exclu)</text>
  <g id="sbar"></g><path d="M40 300H360" stroke="#f0f4ff" stroke-width="2"/>${tk}
  <text x="200" y="364" text-anchor="middle" class="lblg" id="sunit"></text></g>`;
  drawSci(Math.log10(sciLen()));

function sciLen(){return SC.M*Math.pow(10,SC.e-SC.n)}
function sciNorm(){const r=sciLen();return r>=1-1e-12&&r<10-1e-9}
function drawSci(lg){
  const b=band(SC.n);$('sbg').setAttribute('fill',b[2]);
  $('sdeco').innerHTML=`<circle cx="60" cy="60" r="120" fill="${b[1]}" opacity=".55"/><circle cx="360" cy="150" r="90" fill="${b[1]}" opacity=".35"/><g fill="#fff" opacity=".5"><circle cx="40" cy="200" r="1"/><circle cx="330" cy="40" r="1.2"/><circle cx="370" cy="230" r=".8"/><circle cx="120" cy="30" r=".9"/></g>`;

  else if(len>10.4)h=`<rect x="40" y="226" width="372" height="26" rx="6" fill="url(#g-bar)"/><path d="M368 230 l14 9 l-14 9" fill="#1d1400"/><text x="44" y="218" class="lbl" style="fill:#ffe39a">trop long : dépasse la règle, dézoome !</text>`;
  else h=`<rect x="40" y="226" width="${Math.max(3,w)}" height="26" rx="6" fill="url(#g-bar)"/><path d="M${40+w} 220v80" stroke="#ffe39a" stroke-width="2" stroke-dasharray="3 3"/>`;

async function sciZoom(d){ /* d=-1 : zoom avant (graduation 10 fois plus petite) */

  await tw(380,k=>{drawSciBar(l0+(l1-l0)*k)});drawSci(l1);

function drawSciBar(lg){const len=Math.pow(10,lg),w=Math.min(len,11.6)*32;$('sbar').innerHTML=w<2.2?`<circle cx="42" cy="239" r="3.5" fill="#ffe39a"/>`:`<rect x="40" y="226" width="${w}" height="26" rx="6" fill="url(#g-bar)"/>`}

/* ---------- mode CARRÉ (racines carrées) ---------- */
const OX=60,OY=332,SZ=272;
function sceneSq(o){
  SC={mode:'sq',dec:!!o.dec,s:o.s,max:o.max,lab:o.lab||null,neg:false};
  drawSq();setBadge('Recadrage carré · aire et côté');
}
function sqSide(){return SC.dec?SC.s/10:SC.s}
function sqSideH(){return SC.dec?dec(SC.s,-1):N(SC.s)}
function sqAreaH(){return SC.dec?dec(SC.s*SC.s,-2):N(SC.s*SC.s)}
function drawSq(shake){
  const u=SZ/SC.max;let g='';
  for(let i=0;i<=SC.max;i++){g+=`<path d="M${OX+i*u} ${OY}V${OY-SZ}M${OX} ${OY-i*u}H${OX+SZ}" stroke="rgba(120,160,255,${SC.dec?.38:.22})" stroke-width="${SC.dec?1.4:1}"/>`}
  if(SC.dec&&u>=40)for(let i=0;i<=SC.max*10;i++)if(i%10)g+=`<path d="M${OX+i*u/10} ${OY}V${OY-SZ}M${OX} ${OY-i*u/10}H${OX+SZ}" stroke="rgba(120,160,255,.1)" stroke-width="1"/>`;
  const sd=sqSide()*u,top=OY-sd;
  let lbl='';
  for(let i=0;i<=SC.max;i++)lbl+=`<text x="${OX+i*u}" y="${OY+16}" text-anchor="middle" class="lbl" style="font-size:11px">${i}</text>`;
  const aT=SC.lab&&SC.lab.area?SC.lab.area:'aire = '+sqAreaH();
  const sT=SC.lab&&SC.lab.side?SC.lab.side:'côté = '+sqSideH();
  VF.innerHTML=SVGDEF+`<g clip-path="url(#clip)"><rect width="400" height="400" fill="#050c1a"/><rect x="${OX}" y="${OY-SZ}" width="${SZ}" height="${SZ}" fill="#07142a"/>${g}${lbl}
  <g id="sqg" class="${shake?'shake':''}"><rect x="${OX}" y="${top}" width="${Math.max(0,sd)}" height="${Math.max(0,sd)}" fill="url(#g-sq)" stroke="#e8c766" stroke-width="3"/>
  ${sd>6?`<text x="${OX+sd/2}" y="${top+sd/2+5}" text-anchor="middle" class="lblg" style="font-size:${sd>110?17:13}px">${aT}</text>`:''}
  <path d="M${OX} ${OY+24}H${OX+sd}" stroke="#9fb4ff" stroke-width="2.5"/><text x="${OX+Math.max(sd,60)/2}" y="${OY+42}" text-anchor="middle" class="lblb" style="font-size:14px;fill:#9fb4ff">${sT}</text>
  <circle id="hdl" cx="${OX+sd}" cy="${top}" r="15" fill="#6c8eff" stroke="#f0f4ff" stroke-width="2.5"/></g></g>`;
  setZv('aire '+sqAreaH());
  setCapt(SC.lab&&SC.lab.capt?SC.lab.capt:`côté ${sqSideH()} → aire ${sqSideH()}<sup>2</sup> = <span class="g">${sqAreaH()}</span>`);
  wireHandle();
}
function wireHandle(){const h=$('hdl');if(!h)return;
  h.onpointerdown=e=>{if(!SQ_CB)return;e.preventDefault();h.setPointerCapture(e.pointerId);
    const mv=ev=>{const pt=VF.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(VF.getScreenCTM().inverse());
      const u=SZ/SC.max;let s=Math.round(Math.max(p.x-OX,OY-p.y)/u*(SC.dec?10:1));s=Math.max(SC.dec?1:1,Math.min(SC.max*(SC.dec?10:1),s));
      if(s!==SC.s){SC.s=s;sfx('clic');drawSqKeep();SQ_CB&&SQ_CB(false)}};
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);SQ_CB&&SQ_CB(true)};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)};
}
let SQ_CB=null;
function drawSqKeep(){const cap=$('hdl')&&$('hdl').hasPointerCapture;drawSq();}
async function sqTo(s){const s0=SC.s;const st=s>s0?1:-1;for(let v=s0+st;st>0?v<=s:v>=s;v+=st){SC.s=v;drawSq();await wait(60)}}

/* tuiles : √N = k√b */
function sceneTile(o){SC={mode:'tile',N:o.N,k:o.k||1,c:o.c||1};drawTile();setBadge('Mosaïque · carreaux carrés')}
function drawTile(){
  const N0=SC.N,k=SC.k,ok=N0%(k*k)===0,b=N0/(k*k),S0=256,x0=72,y0=58,t=S0/k;let h='';
  if(k===1)h=`<rect x="${x0}" y="${y0}" width="${S0}" height="${S0}" fill="url(#g-sq)" stroke="#e8c766" stroke-width="3"/><text x="${x0+S0/2}" y="${y0+S0/2+6}" text-anchor="middle" class="lblg" style="font-size:20px">aire ${N(N0)}</text>`;
  else{
    h=`<rect x="${x0}" y="${y0}" width="${S0}" height="${S0}" fill="${ok?'none':'rgba(255,107,107,.08)'}" stroke="${ok?'#e8c766':'#ff6b6b'}" stroke-width="3"/>`;
    for(let i=0;i<k;i++)for(let j=0;j<k;j++){
      if(ok)h+=`<rect x="${x0+i*t+2}" y="${y0+j*t+2}" width="${t-4}" height="${t-4}" rx="3" fill="url(#g-sq)" stroke="#e8c766" stroke-width="1.2"/>`+(t>=34?`<text x="${x0+i*t+t/2}" y="${y0+j*t+t/2+5}" text-anchor="middle" class="lblg" style="font-size:${t>=60?15:11}px">${N(b)}</text>`:'');
    }
    if(!ok)for(let i=1;i<k;i++)h+=`<path d="M${x0+i*t} ${y0}V${y0+S0}M${x0} ${y0+i*t}H${x0+S0}" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  }
  const sideTxt=k===1?`côté √${N(N0)}`:ok?`côté = ${k} × √${N(b)}`:`${N(N0)} ÷ ${k*k} n'est pas entier`;
  VF.innerHTML=SVGDEF+`<g clip-path="url(#clip)"><rect width="400" height="400" fill="#050c1a"/>${h}
  <path d="M${x0} 334H${x0+S0}" stroke="${ok||k===1?'#9fb4ff':'#ff6b6b'}" stroke-width="2.5"/><text x="200" y="358" text-anchor="middle" class="lblb" style="fill:${ok||k===1?'#9fb4ff':'#ff9b7a'}">${sideTxt}</text></g>`;
  setZv(k===1?'aire '+N(N0):ok?`${k*k} carreaux`:'ça ne tombe pas juste');
  setCapt(k===1?`${rt(N(N0))} : un carré d'aire ${N(N0)}`:ok?`${rt(N(N0))} = ${rt(N(k*k)+' × '+N(b))} = ${rt(N(k*k))} × ${rt(N(b))} = <span class="g">${crt(k,N(b))}</span>`:`${k}<sup>2</sup> = ${k*k} ne divise pas ${N(N0)}`);
}

/* deux carrés côte à côte puis fusionnés : √a + √b ≠ √(a + b) */
function sceneMerge(o){SC={mode:'merge',a:o.a,b:o.b,t:0};drawMerge(0);setBadge('Deux carrés · un seul carré')}
function drawMerge(t){
  const ra=Math.sqrt(SC.a),rb=Math.sqrt(SC.b),rc=Math.sqrt(SC.a+SC.b),u=300/(ra+rb+.6),x0=40,y0=300;
  let h='';
  if(t<1){const op=1-t;
    h+=`<g opacity="${op}"><rect x="${x0}" y="${y0-ra*u}" width="${ra*u}" height="${ra*u}" fill="rgba(108,142,255,.22)" stroke="#9fb4ff" stroke-width="2.5"/><text x="${x0+ra*u/2}" y="${y0-ra*u/2+5}" text-anchor="middle" class="lblb">${N(SC.a)}</text>
    <rect x="${x0+ra*u}" y="${y0-rb*u}" width="${rb*u}" height="${rb*u}" fill="rgba(200,168,75,.22)" stroke="#e8c766" stroke-width="2.5"/><text x="${x0+ra*u+rb*u/2}" y="${y0-rb*u/2+5}" text-anchor="middle" class="lblg">${N(SC.b)}</text>
    </g>`}
  h+=`<path d="M${x0} ${y0+20}H${x0+(ra+rb)*u}" stroke="#ff9b7a" stroke-width="3"/><text x="${x0+(ra+rb)*u/2}" y="${y0+40}" text-anchor="middle" class="lblb" style="fill:#ff9b7a">√${SC.a} + √${SC.b} = ${N(ra)} + ${N(rb)} = ${N(ra+rb)}</text>`;
  if(t>0){h+=`<g opacity="${t}"><rect x="${x0}" y="${y0-rc*u}" width="${rc*u}" height="${rc*u}" fill="rgba(95,210,124,.16)" stroke="#5fd27c" stroke-width="3"/><text x="${x0+rc*u/2}" y="${y0-rc*u/2+5}" text-anchor="middle" class="lblb">${N(SC.a)} + ${N(SC.b)} = ${N(SC.a+SC.b)}</text>
    <path d="M${x0} ${y0+56}H${x0+rc*u}" stroke="#5fd27c" stroke-width="3"/><text x="${x0+rc*u/2}" y="${y0+76}" text-anchor="middle" class="lblb" style="fill:#8fe0a4">côté √${SC.a+SC.b} = ${N(rc)}</text></g>`}
  VF.innerHTML=SVGDEF+`<g clip-path="url(#clip)"><rect width="400" height="400" fill="#050c1a"/>${h}</g>`;
  setZv(t<1?'côte à côte':'fusionnés');
  setCapt(t<1?`${rt(N(SC.a))} + ${rt(N(SC.b))} = ${N(ra)} + ${N(rb)} = <span class="g">${N(ra+rb)}</span>`:`${rt(N(SC.a)+' + '+N(SC.b))} = ${rt(N(SC.a+SC.b))} = <span class="g">${N(rc)}</span> <span class="m">≠ ${N(ra+rb)}</span>`);
}

/* même famille : rangées de carreaux de côté √a */
function sceneRow(o){SC={mode:'row',rows:o.rows.map(r=>({rad:r.rad,col:r.col,items:[]}))};drawRow();setBadge('Même famille · même carreau')}
function drawRow(){
  let h='',y=70;
  SC.rows.forEach((r,ri)=>{
    const live=r.items.filter(x=>x.st!=='gone');const n=r.items.length;const w=Math.min(30,330/Math.max(10,n));
    h+=`<text x="34" y="${y-12}" class="lblb" style="fill:${r.col}">carreaux de côté √${r.rad}</text>`;
    r.items.forEach((it,i)=>{const x=34+i*(w+2);const c=it.st==='out'?'#ff6b6b':r.col;const op=it.st==='gone'?0:it.st==='out'?.35:1;
      h+=`<rect x="${x}" y="${y}" width="${w}" height="${w}" rx="3" fill="${c}" fill-opacity="${it.st==='out'?.12:.28}" stroke="${c}" stroke-width="1.6" opacity="${op}"/>`});
    const cnt=r.items.filter(x=>x.st==='in').length;
    h+=`<text x="34" y="${y+w+24}" class="lblg">longueur : ${cnt===0?'0':cnt===1?'':N(cnt)}√${r.rad}</text>`;
    y+=130;
  });
  VF.innerHTML=SVGDEF+`<g clip-path="url(#clip)"><rect width="400" height="400" fill="#050c1a"/>${h}</g>`;
  setZv('');
}
async function rowAdd(ri,n,neg){const r=SC.rows[ri];
  if(!neg){for(let i=0;i<n;i++){r.items.push({st:'in'});sfx('pop');drawRow();await wait(110)}}
  else{let c=0;for(let i=r.items.length-1;i>=0&&c<n;i--)if(r.items[i].st==='in'){r.items[i].st='out';c++;sfx('clic');drawRow();await wait(110)}
    await wait(260);r.items=r.items.filter(x=>x.st==='in');drawRow()}}

/* grand carré : (p + √q)² */
function sceneDev(o){SC={mode:'dev',p:o.p,q:o.q,t:0};drawDev(0);setBadge('Le grand carré · développement')}
function drawDev(t){
  const p=SC.p,rq=Math.sqrt(SC.q),u=256/(p+rq),x0=72,y0=58,P=p*u,R=rq*u;
  const op=i=>Math.max(0,Math.min(1,t*4-i));
  let h=`<rect x="${x0}" y="${y0}" width="${P+R}" height="${P+R}" fill="none" stroke="rgba(240,244,255,.5)" stroke-width="2" stroke-dasharray="6 5"/>`;
  h+=`<g opacity="${op(0)}"><rect x="${x0}" y="${y0}" width="${P}" height="${P}" fill="rgba(200,168,75,.22)" stroke="#e8c766" stroke-width="2.5"/><text x="${x0+P/2}" y="${y0+P/2+6}" text-anchor="middle" class="lblg" style="font-size:18px">${N(p)}² = ${N(p*p)}</text></g>`;
  h+=`<g opacity="${op(1)}"><rect x="${x0+P}" y="${y0}" width="${R}" height="${P}" fill="rgba(183,156,255,.18)" stroke="#b79cff" stroke-width="2.5"/><text x="${x0+P+R/2}" y="${y0+P/2+5}" text-anchor="middle" class="lblb" style="fill:#d6c8ff;font-size:13px">${N(p)}√${SC.q}</text></g>`;
  h+=`<g opacity="${op(2)}"><rect x="${x0}" y="${y0+P}" width="${P}" height="${R}" fill="rgba(183,156,255,.18)" stroke="#b79cff" stroke-width="2.5"/><text x="${x0+P/2}" y="${y0+P+R/2+5}" text-anchor="middle" class="lblb" style="fill:#d6c8ff;font-size:13px">${N(p)}√${SC.q}</text></g>`;
  h+=`<g opacity="${op(3)}"><rect x="${x0+P}" y="${y0+P}" width="${R}" height="${R}" fill="rgba(108,142,255,.24)" stroke="#9fb4ff" stroke-width="2.5"/><text x="${x0+P+R/2}" y="${y0+P+R/2+5}" text-anchor="middle" class="lblb" style="font-size:13px">${SC.q}</text></g>`;
  h+=`<path d="M${x0} ${y0+P+R+16}H${x0+P}" stroke="#e8c766" stroke-width="3"/><path d="M${x0+P} ${y0+P+R+16}H${x0+P+R}" stroke="#9fb4ff" stroke-width="3"/>
  <text x="${x0+P/2}" y="${y0+P+R+36}" text-anchor="middle" class="lblg">${N(p)}</text><text x="${x0+P+R/2}" y="${y0+P+R+36}" text-anchor="middle" class="lblb" style="fill:#9fb4ff">√${SC.q}</text>`;
  VF.innerHTML=SVGDEF+`<g clip-path="url(#clip)"><rect width="400" height="400" fill="#050c1a"/>${h}</g>`;
  setZv(t>=1?'aire totale':'');
  setCapt(t>=1?`(${N(p)} + ${rt(SC.q)})<sup>2</sup> = ${N(p*p)} + 2 × ${N(p)}${rt(SC.q)} + ${SC.q} = <span class="g">${N(p*p+SC.q)} + ${N(2*p)}${rt(SC.q)}</span>`:`un carré de côté ${N(p)} + ${rt(SC.q)}`);
}

function setScene(sc){
  SQ_CB=null;
  if(!sc)return;
  if(sc.mode==='zoom')sceneZoom(sc);else if(sc.mode==='sci')sceneSci(sc);else if(sc.mode==='sq')sceneSq(sc);
  else if(sc.mode==='tile')sceneTile(sc);else if(sc.mode==='merge')sceneMerge(sc);else if(sc.mode==='row')sceneRow(sc);else if(sc.mode==='dev')sceneDev(sc);
}

/* ====================================================================
   NIVEAUX : générateurs de questions
   Une question : {prompt, scene, parts:[…], rule}
   Parties : zoom | jumps | sci | side | tile | act | choice | fill
   ==================================================================== */
const prodH=(b,n)=>Array(n).fill(bLab(b)).join(' × ');
function C(ask,good,bad,why,o){ /* QCM : good = html juste, bad = [[html, pourquoi]…] */
  const all=[[good,null],...bad.filter((x,i,a)=>x[0]!==good&&a.findIndex(y=>y[0]===x[0])===i)];
  const ord=shuf(all.map((_,i)=>i));
  return Object.assign({t:'choice',ask,choices:ord.map(i=>all[i][0]),ok:ord.indexOf(0),why:ord.map(i=>all[i][1]),good:why},o||{});
}
function F(ask,tpl,ans,hint,o){return Object.assign({t:'fill',ask,tpl:Array.isArray(tpl)?tpl:[tpl],ans:ans.map(String),hint},o||{})}

  rule:`${c}√${N2} = ${c} × ${k}√${b} = ${c*k}√${b}.`}},
 ()=>{const r=pick([2,3,5,7]);const k=ri(2,5),l=ri(1,k-1),m=ri(2,6);const r2=pick([2,3,5,7].filter(x=>x!==r)),k2=ri(2,6),l2=ri(1,3);
  return{scene:{mode:'row',rows:[{rad:r,col:'#e8c766'},{rad:r2,col:'#9fb4ff'}]},prompt:`Même famille = même carreau. On aligne des carreaux de côté √${r} (et d'autres de côté √${r2}).`,

/* ====================================================================
   MOTEUR DE JEU
   ==================================================================== */
const GAME='zoom-carre';
const S={lvl:0,qi:0,qs:[],q:null,pi:0,qerr:0,score:0,res:[],busy:false};
function stars(L){try{const g=SigmaKit.passport().games[GAME];return g&&g.levels[L+1]||0}catch(e){return 0}}
function renderLv(){
  $('lv').innerHTML=LV.map((l,i)=>{const s=stars(i);return `<button data-l="${i}" aria-pressed="${i===S.lvl}">${i+1}. ${l.name}${s?`<span class="ck" aria-label="${s} étoile${s>1?'s':''}">${'★'.repeat(s)}</span>`:''}</button>`}).join('')+
   `<span class="sp"></span><button class="tool" id="snd" aria-pressed="${soundOn}">♪ Bruitages : ${soundOn?'oui':'non'}</button>`;
}
$('lv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='snd'){soundOn=!soundOn;try{localStorage.setItem('sigma-fanfare',soundOn?'1':'0')}catch(err){}renderLv();if(soundOn)sfx('pop');return}
  if(S.busy)return;startLevel(+b.dataset.l)});
function startLevel(L){S.lvl=L;S.qi=0;S.score=0;S.res=[];S.qs=LV[L].gen().map(f=>f());renderLv();
  $('kick').textContent=`Niveau ${L+1} · ${LV[L].kick}`;$('lt').textContent=LV[L].name;$('rule').innerHTML=LV[L].cours;showQ()}
function dots(){$('dots').innerHTML=S.qs.map((_,i)=>`<span class="dot ${i<S.res.length?(S.res[i]?'g':'r'):i===S.qi?'c':''}"></span>`).join('');$('qn').textContent=`Question ${S.qi+1} sur ${S.qs.length}`}
function showQ(){
  const q=S.q=S.qs[S.qi];S.pi=0;S.qerr=0;
  dots();$('prompt').innerHTML=q.prompt;$('work').innerHTML='';$('fbw').innerHTML='';$('winw').innerHTML='';
  setScene(q.scene);renderPart();
}
function fb(msg,kind){$('fbw').innerHTML=msg?`<div class="fb ${kind||''}" id="fb"><span class="mk">${SigmaKit.maki(kind==='info'?'neutre':'pense')}</span><div>${msg}</div></div>`:''}
function err(msg){S.qerr++;sfx('ko');fb(`<b>Pas tout à fait.</b><p>${msg}</p>`)}
async function busy(fn){S.busy=true;document.body.classList.add('busy');try{await fn()}finally{S.busy=false;document.body.classList.remove('busy')}}
function partDone(el){el.classList.add('done');el.querySelectorAll('button,input').forEach(x=>x.disabled=true);fb('');S.pi++;
  if(S.pi<S.q.parts.length)renderPart();else win()}
function win(){
  const ok=!S.qerr;if(ok)S.score++;S.res.push(ok);dots();sfx('ok');
  const last=S.qi===S.qs.length-1;
  $('winw').innerHTML=`<div class="win" id="win"><div class="top"><span class="mk">${SigmaKit.maki(ok?'bravo':'joie')}</span><div class="big">${ok?'Du premier coup&nbsp;!':'Réussi&nbsp;!'}</div></div><p>${S.q.rule}</p><button class="btn or" id="next">${last?'Terminer le niveau':'Question suivante →'}</button></div>`;
  $('next').onclick=()=>{if(S.busy)return;if(last)endLevel();else{S.qi++;showQ();window.scrollTo({top:Math.min(window.scrollY,$('panel').offsetTop-8)})}};
  setTimeout(()=>{try{$('next').focus({preventScroll:true})}catch(e){}},60);
}
function endLevel(){
  const L=S.lvl;
  SigmaKit.levelComplete({level:L+1,score:S.score,total:S.qs.length}).then(v=>{renderLv();
    if(v==='next'&&L+1<LV.length)startLevel(L+1);else if(v==='replay')startLevel(L)});
}
const nw=t=>t.replace(/(\{\d+\}) × 10<sup>(\{\d+\})<\/sup>/g,'<span class="nw">$1 × 10<sup>$2</sup></span>');
const KP=['1','2','3','4','5','6','7','8','9','0','−',',','/','⌫'];/* 5 colonnes */
function renderPart(){
  const p=S.q.parts[S.pi],el=document.createElement('div');el.className='part';el.dataset.t=p.t;
  let h=p.ask?`<p class="ask">${p.ask}</p>`:'';
  if(p.t==='zoom'){p.cur=SC.n;h+=`<div class="btns">${p.ops.map((op,i)=>`<button class="btn ${i===0?'or':''} zb" data-op="${op}">${op==='mul'?'×':'÷'}${bLab(SC.base)}</button>`).join('')}</div><p class="hint">Exposant atteint&nbsp;: <b class="zn">${N(SC.n)}</b> · objectif&nbsp;: ${N(p.target)}</p>`}
  else if(p.t==='jumps'){p.left=p.btns.map(b=>b.times||1);h+=`<div class="btns">${p.btns.map((b,i)=>`<button class="btn ${i===0?'or':''} jb" data-j="${i}">${b.label}${(b.times||1)>1?`<span class="cnt">${b.times} fois</span>`:''}</button>`).join('')}</div>`}

function wire(p,el){
  if(p.t==='zoom'){el.querySelectorAll('.zb').forEach(b=>b.onclick=()=>{if(S.busy)return;busy(async()=>{
    await zStep(b.dataset.op==='mul'?1:-1);el.querySelector('.zn').textContent=N(SC.n);
    if(SC.n===p.target){sfx('ok');partDone(el)}
    else if((b.dataset.op==='mul'&&SC.n>p.target&&p.ops.length===1)){SC.n=0;await wait(250);sceneZoom({base:SC.base,lo:SC.lo,hi:SC.hi});el.querySelector('.zn').textContent='0';fb('Trop loin&nbsp;! On repart de zéro.','info')}
    else if(Math.abs(SC.n-p.target)>6){fb('Tu t’éloignes&nbsp;: change de sens.','info')}
  })})}
  else if(p.t==='jumps'){el.querySelectorAll('.jb').forEach(b=>b.onclick=()=>{if(S.busy)return;const j=+b.dataset.j;if(!p.left[j])return;busy(async()=>{
    const d=p.btns[j].d;await zJump(d,(d>0?'+':MI)+Math.abs(d));p.left[j]--;
    const c=b.querySelector('.cnt');if(c)c.textContent=p.left[j]?`encore ${p.left[j]}`:'fait';if(!p.left[j])b.disabled=true;
    if(p.left.every(x=>!x))partDone(el)})})}
  else if(p.t==='sci'){el.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{if(S.busy)return;busy(async()=>{await sciZoom(+b.dataset.d);if(sciNorm()){sfx('ok');partDone(el)}})})}
  else if(p.t==='side'){const chk=()=>{p.seen.add(SC.s);if(p.target!==undefined?SC.s===p.target:p.visit.every(v=>p.seen.has(v))){SQ_CB=null;sfx('ok');partDone(el)}};
    SQ_CB=(end)=>{p.seen.add(SC.s);if(end)chk()};
    el.querySelectorAll('.qb').forEach(b=>b.onclick=()=>{if(S.busy)return;const s=SC.s+(+b.dataset.d),mx=SC.max*(SC.dec?10:1);if(s<1||s>mx){fb('Le carré ne peut pas sortir du viseur.','info');return}SC.s=s;sfx('clic');drawSq();chk()})}
  else if(p.t==='tile'){el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(S.busy)return;const k=+b.dataset.k;SC.k=k;drawTile();
    if(p.N%(k*k)){b.classList.add('no');err(`${k} × ${k} = ${k*k} carreaux : ${N(p.N)} ÷ ${k*k} n'est pas un nombre entier.`)}
    else if(k<p.kmax){b.classList.add('mid');sfx('pop');fb(`Juste&nbsp;: √${p.N} = ${k}√${p.N/(k*k)}. Mais √${p.N/(k*k)} se simplifie encore&nbsp;: essaie plus de carreaux.`,'info')}
    else{b.classList.add('yes');sfx('ok');partDone(el)}})}
  else if(p.t==='act'){el.querySelector('.act').onclick=()=>{if(S.busy)return;busy(async()=>{await p.run();partDone(el)})}}
  else if(p.t==='choice'){el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.busy)return;const j=+b.dataset.j;
    if(j===p.ok){b.classList.add('ok');sfx('ok');if(p.then)busy(async()=>{el.querySelectorAll('.opt').forEach(x=>x.disabled=true);await p.then();partDone(el)});else partDone(el)}
    else{b.classList.add('ko');b.disabled=true;err(p.why[j]||'Relis la règle du cours.')}})}
  else if(p.t==='fill'){const f=el.querySelector('form'),ins=[...el.querySelectorAll('.in')];let last=ins[0];
    if(document.body.classList.contains('touch'))ins.forEach(i=>i.setAttribute('inputmode','none'));
    ins.forEach(i=>{i.onfocus=()=>{last=i};i.oninput=()=>i.classList.remove('ko')});
    el.querySelectorAll('.kp button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(!last||last.disabled)return;if(k==='⌫')last.value=last.value.slice(0,-1);else last.value+=k;last.classList.remove('ko')});
    setTimeout(()=>{try{if(!document.body.classList.contains('touch'))ins[0].focus({preventScroll:true})}catch(e){}},30);
    f.onsubmit=e=>{e.preventDefault();if(S.busy)return;
      let all=true;ins.forEach(i=>{const k=+i.dataset.i,ok=eqNum(parseNum(i.value),parseNum(p.ans[k]));i.classList.toggle('ok',ok);i.classList.toggle('ko',!ok);if(!ok)all=false});
      if(all){sfx('ok');if(p.then)busy(async()=>{ins.forEach(x=>x.disabled=true);await p.then();partDone(el)});else partDone(el);return}
      p.tries++;const empty=ins.some(i=>!i.value.trim());
      err((empty?'Remplis chaque case. ':'')+p.hint+(p.tries>=2?`<br>Réponse attendue&nbsp;: <b style="display:inline">${p.ans.join(' ; ')}</b>. Recopie-la pour continuer.`:''));
      const bad=ins.find(i=>i.classList.contains('ko'));if(bad&&!document.body.classList.contains('touch'))bad.focus()}}
}

function buildFinal(t){
  for(let tries=0;tries<200;tries++){
    let lv=[1,2,3,4,5,6,7];
    lv=lv.concat(t==='b'?shuf([1,2,4,6,1,6]).slice(0,3):shuf([1,2,3,4,5,6,7]).slice(0,3));

    lv=shuf(lv);const Q=[],seen=new Set();let ok=true;
    for(let i=0;i<10;i++){let q=null;for(let k=0;k<30&&!q;k++){const pool=FIN[t][types[i]][lv[i]];const g=pick(pool);const c=g();if(c&&!seen.has(c.prompt))q=c}
      if(!q){ok=false;break}seen.add(q.prompt);Q.push(q)}
    if(ok){window.ZC_lastFinal=Q;return Q}
  }
  throw new Error('épreuve impossible');
}
