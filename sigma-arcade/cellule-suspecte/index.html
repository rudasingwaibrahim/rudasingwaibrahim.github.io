<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellule suspecte · Sigma Arcade</title>
<meta name="description" content="Terminale technologique : des feuilles de calcul remplies par des stagiaires cachent une erreur fréquente (suites, exponentielles, logarithme, inverse, probabilités, loi binomiale, statistiques, pourcentages)… ou aucune. Trouver la cellule source, la corriger, nommer la règle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sigma-arcade/sigma-theme.css">
<style>
/* VOICE : complice et précis, entre jeunes adultes ; on vérifie le travail d'un stagiaire, jamais celui de l'élève.
   IDEA : la notion est le mouvement du tableur — une formule fausse propage son erreur ; les flèches remontent
          jusqu'à la cellule source, et la correction redescend en cascade dans les cellules qui l'utilisent.
   PICTURE : une feuille de calcul de nuit (grille bleu profond, références colorées), un tampon doré à la fin.
   LAYOUT : la feuille à gauche (barre de formule, grille, onglets = progression), le dossier de contrôle à droite. */
:root{--ink:var(--sg-text);--mut:var(--sg-muted);--line:var(--sg-border-strong);--soft:var(--sg-border);
--ac:var(--sg-accent);--acsoft:var(--sg-accent-soft);--on:var(--sg-on-accent);--ok:var(--sg-ok);--ko:var(--sg-coral);
--gold:var(--sg-gold);--gold2:var(--sg-gold-bright);--solid:var(--sg-panel-solid);--raise:var(--sg-raise);
--r1:#7fb2ff;--r2:#e8c766;--r3:#62d6c4;--r4:#c39bff;--grid:rgba(120,160,255,.13);--mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{overflow-x:clip}
body{margin:0;color:var(--ink);font:17px/1.55 var(--sg-font)}
header{max-width:1320px;margin:auto;padding:18px max(3vw,16px) 4px;padding-right:max(3vw,190px)}
h1{font-size:clamp(32px,4vw,46px);font-weight:800;letter-spacing:-.01em;line-height:1.08;margin:2px 0 6px}
header p{margin:0;color:var(--mut);max-width:74ch}
.back{display:inline-flex;align-items:center;min-height:32px;margin:0 0 6px;font-weight:600;text-decoration:none;border-bottom:2px solid var(--ac)}
button{font-family:var(--sg-font)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.lv{max-width:1320px;margin:10px auto 0;padding:0 max(3vw,16px);display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.lv button{min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 15px var(--sg-font);cursor:pointer;transition:background .15s,border-color .15s}
.lv button:hover{background:var(--sg-hover);border-color:var(--ac)}
.lv button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 6px 20px -10px var(--sg-glow)}
.lv .ck{margin-left:6px;color:var(--gold2);letter-spacing:-1px}
.lv button[aria-pressed=true] .ck{color:#3b2c00}
.lv .sp{flex:1}
.lv .tool{border-style:dashed;font-size:14px;padding:0 11px}
.lv .tool[aria-pressed=true]{background:var(--acsoft);color:var(--ink);border-color:var(--ac);box-shadow:none}
.app{max-width:1320px;margin:auto;padding:14px max(3vw,16px) 48px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,1fr);gap:clamp(18px,2.4vw,32px);align-items:start}
/* ---------- fenêtre du tableur ---------- */
.win{position:relative;border-radius:16px;border:1px solid var(--soft);background:linear-gradient(170deg,#0d1c36,#081224 80%);box-shadow:var(--sg-shadow-card);overflow:hidden}
.wtop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--soft);background:rgba(255,255,255,.025)}
.wtop .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--acsoft);color:var(--r1);font:800 13px var(--sg-font)}
.wtop .fn{font-weight:700;font-size:16px;line-height:1.2}
.wtop .fn small{display:block;font-weight:500;font-size:13px;color:var(--mut)}
.wtop .who{margin-left:auto;font-size:13px;color:var(--mut);text-align:right;line-height:1.3}
.wtop .who b{color:var(--ink);font-weight:600}
.win:has(.stamp) .who{visibility:hidden}
.win:has(.stamp) .fn{padding-right:120px}
.brief{margin:0;padding:10px 14px 12px;font-size:16px;line-height:1.5;border-bottom:1px solid var(--soft);background:rgba(200,168,75,.045)}
.brief sub,.brief sup{line-height:0}
.fbar{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--soft);background:#0a1730}
.nmbox{min-width:52px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);font:700 15px var(--sg-font);font-variant-numeric:tabular-nums}
.fx{font:italic 700 15px Georgia,serif;color:var(--gold2)}
.fml{min-height:34px;display:flex;align-items:center;flex-wrap:wrap;gap:0 2px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.04);font:600 16px/1.35 var(--mono);overflow-wrap:anywhere}
.fml .rf{border-radius:4px;padding:0 2px}
.fml .rf.c0{color:var(--r1)}.fml .rf.c1{color:var(--r2)}.fml .rf.c2{color:var(--r3)}.fml .rf.c3{color:var(--r4)}
.fml .chip{font:600 13px var(--sg-font);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-right:6px}
.fml .txt{font-family:var(--sg-font)}
.fml .ph{font:500 15px var(--sg-font);color:var(--mut)}
.trad{min-height:28px;padding:4px 14px 6px;font-size:15px;color:var(--mut);border-bottom:1px solid var(--soft);font-variant-numeric:tabular-nums}
.trad b{color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--soft)}
.note{flex-basis:100%;padding:8px 12px;border-radius:10px;font-size:15px;line-height:1.45;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.35)}
.note.ok{background:rgba(95,210,124,.12);border-color:rgba(95,210,124,.35)}
.note sub,.note sup{line-height:0}
.gwrap{position:relative;padding:10px 10px 12px}
.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:auto;font-variant-numeric:tabular-nums}
.grid th{font:600 12px var(--sg-font);color:rgba(200,215,255,.5);background:#0e1f3e;border:1px solid var(--grid);padding:2px 4px;height:22px}
.grid th.rh{width:24px}
.grid td{border:1px solid var(--grid);padding:0;height:44px;vertical-align:middle;background:rgba(5,12,26,.55)}
.grid td.lab{padding:4px 8px;font-size:15px;line-height:1.25;color:#d6e0ff}
.grid td.hd{padding:4px 8px;font-size:14px;font-weight:700;color:var(--gold2);background:rgba(200,168,75,.06);text-align:center;line-height:1.2}
.grid td.empty{background:rgba(5,12,26,.3)}
.cell{position:relative;display:flex;align-items:center;justify-content:flex-end;width:100%;min-height:44px;min-width:44px;padding:4px 8px;border:0;background:transparent;color:var(--ink);font:600 16px/1.25 var(--sg-font);text-align:right;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s}
.cell.t{justify-content:flex-start;text-align:left;font-weight:600;font-size:15px}
.cell.k-d{color:#aebfdc;font-weight:500}
.cell.k-m::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--r4) transparent transparent;opacity:.8}
.cell:hover{background:var(--sg-hover)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ac);background:rgba(108,142,255,.12)}
.cell.p0{box-shadow:inset 0 0 0 2px var(--r1)}.cell.p1{box-shadow:inset 0 0 0 2px var(--r2)}.cell.p2{box-shadow:inset 0 0 0 2px var(--r3)}.cell.p3{box-shadow:inset 0 0 0 2px var(--r4)}
.cell.cleared{color:#9fe3b0}
.cell.fault{box-shadow:inset 0 0 0 2px var(--ko);background:rgba(255,107,107,.13)}
.cell.fault::before{content:"!";position:absolute;left:4px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--ko);color:#2a0606;font:800 11px/16px var(--sg-font);text-align:center}
.cell.fixed{box-shadow:inset 0 0 0 2px var(--ok);background:rgba(95,210,124,.12);animation:pop .5s ease-out}
.cell.wave{animation:wave .7s ease-out}
.cell.okc{background:rgba(95,210,124,.08)}
.cell.lookw{box-shadow:inset 0 0 0 2px rgba(200,168,75,.8)}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:none}}
@keyframes wave{0%{background:rgba(95,210,124,.38)}100%{background:rgba(95,210,124,.08)}}
.cell sup,.cell sub,.lab sup,.lab sub{line-height:0}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.arrows path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:6 5;animation:flow 1s linear infinite}
svg.arrows circle{stroke:none}
@keyframes flow{to{stroke-dashoffset:-22}}
.tree{padding:0 10px 10px}
.tree svg{display:block;width:100%;height:auto;max-height:220px}
.tree text{font-family:var(--sg-font)}
.tree .tl{cursor:pointer}
.tabs{display:flex;gap:4px;align-items:flex-end;padding:0 10px;border-top:1px solid var(--soft);background:#081225;overflow:hidden}
.tab{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:0 0 8px 8px;font:600 13px var(--sg-font);color:var(--mut);border:1px solid transparent;border-top:0}
.tab.on{background:#0d1c36;color:var(--ink);border-color:var(--soft)}
.tab i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.tab.on i{background:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}.tab.g i{background:var(--ok)}.tab.r i{background:var(--ko)}
.stamp{position:absolute;right:16px;top:12px;z-index:5;padding:6px 14px;border:3px solid var(--gold2);border-radius:10px;color:var(--gold2);font:800 18px/1 var(--sg-font);letter-spacing:.12em;transform:rotate(-8deg);background:rgba(8,18,37,.72);box-shadow:0 0 0 2px rgba(8,18,37,.6);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
/* ---------- dossier de contrôle ---------- */
.panel{background:var(--sg-panel);border:1px solid var(--soft);box-shadow:var(--sg-shadow-card);border-radius:16px;padding:20px clamp(16px,2.2vw,26px)}
.chap{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#aebfff}
.panel h2{font-size:24px;line-height:1.2;margin:2px 0 8px}
.ctx{margin:0 0 12px;font-size:16px;line-height:1.55}
.ctx sub,.ctx sup{line-height:0}
.steps{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mut)}
.steps span b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px}
.steps span.on{border-color:var(--ac);color:var(--ink)}.steps span.on b{background:var(--ac);color:var(--on)}
.steps span.ok{border-color:rgba(95,210,124,.5);color:var(--ok)}.steps span.ok b{background:var(--ok);color:#06210f}
.ask{font-weight:700;font-size:18px;margin:0 0 10px;line-height:1.4}
.hint{color:var(--mut);font-size:15px;margin:6px 0 0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--raise);color:var(--ink);font:600 16px var(--sg-font);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){border-color:var(--ac);background:#18305a}.btn:active:not(:disabled){transform:translateY(1px)}
.btn.or{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 6px 20px -8px var(--sg-glow)}.btn.or:hover:not(:disabled){background:#86a2ff;border-color:#86a2ff}
.btn.gh{background:transparent}.btn.gh:hover:not(:disabled){background:var(--sg-hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.opts.long{grid-template-columns:1fr}
.opt{min-height:52px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);color:var(--ink);font:600 17px/1.4 var(--sg-font);text-align:left;cursor:pointer;transition:border-color .15s,background .15s;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:var(--ac);background:rgba(108,142,255,.1)}
.opt.ok{border-color:var(--ok);background:rgba(95,210,124,.14)}.opt.ko{border-color:var(--ko);background:rgba(255,107,107,.1);opacity:.75}
.opt:disabled{cursor:default}
.opt.rule{font-weight:500;font-size:16px}
.opt sup,.opt sub{line-height:0}
.in{width:8em;height:48px;padding:0 10px;font:700 20px var(--sg-font);text-align:center;border:1.5px solid var(--line);border-bottom:3px solid var(--ac);border-radius:10px;background:var(--solid);color:var(--ink);font-variant-numeric:tabular-nums}
.in.ok{border-color:var(--ok);color:var(--ok)}.in.ko{border-color:var(--ko);color:var(--ko)}
.fb{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;margin-top:14px;padding:12px 14px;border-radius:12px;line-height:1.5;font-size:16px}
.fb.ok{background:rgba(95,210,124,.12);border:1px solid rgba(95,210,124,.35)}
.fb.ko{background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.35)}
.fb.inf{background:rgba(108,142,255,.1);border:1px solid rgba(108,142,255,.3)}
.fb .mk svg{width:52px;height:52px;display:block}
.fb b.t{display:block;font-size:17px}
.fb sub,.fb sup{line-height:0}
.recap{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.recap li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--soft);font-size:16px}
.recap li span{color:var(--mut);font-size:14px;font-weight:600;padding-top:1px}
.recap sub,.recap sup{line-height:0}
.cours{margin:16px 0 0;border:1px solid var(--soft);border-radius:12px;background:rgba(255,255,255,.025)}
.cours summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:0 14px;font-weight:600;color:var(--mut);list-style:none}
.cours summary::-webkit-details-marker{display:none}
.cours summary::before{content:"▸";margin-right:8px;transition:transform .2s}
.cours[open] summary::before{transform:rotate(90deg)}
.cours ul{margin:0;padding:0 16px 12px 34px;font-size:15px}
.cours li{margin:5px 0}
.cours sub,.cours sup{line-height:0}
.score{margin-top:10px;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.ov{text-decoration:overline}
.bn{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.85em;margin:0 .15em;padding:0 .3em;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-radius:.6em}
.rn{color:var(--mut);font-size:.85em;font-weight:500}
@media (max-width:980px){.app{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  header{padding-right:16px;padding-top:64px}
  .lv{gap:6px}.lv button{padding:0 11px;font-size:14px}
  .app{padding:12px 10px 40px;gap:14px}
  .wtop{padding:8px 10px}.wtop .who{display:none}
  .fbar{padding:6px 8px;gap:6px}.fml{font-size:14px;padding:4px 8px}
  .note{flex-basis:100%;padding:8px 12px;border-radius:10px;font-size:15px;line-height:1.45;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.35)}
.note.ok{background:rgba(95,210,124,.12);border-color:rgba(95,210,124,.35)}
.note sub,.note sup{line-height:0}
.gwrap{padding:8px 6px 10px}
  .grid td.lab{padding:3px 5px;font-size:13px}.grid td.hd{padding:3px 4px;font-size:12px}
  .grid th.rh{width:18px}.grid th{padding:1px 2px;font-size:11px}
  .cell{padding:3px 5px;font-size:14px}.cell.t{font-size:13px}
  .panel{padding:16px 14px}
  .stamp{top:10px;right:10px;font-size:14px;padding:5px 10px}
  .tab{padding:0 8px}.tab .tw{display:none}.brief{font-size:15px;padding:8px 10px 10px}
  .recap li{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
<a class="back" href="/sigma-arcade/">← Sigma Arcade</a>
<h1>Cellule suspecte</h1>
<p>Des stagiaires ont rempli des feuilles de calcul. Chaque feuille cache au plus <b>une</b> cellule fausse, une erreur fréquente de Terminale… ou aucune. Remonte jusqu'à la cellule source, corrige-la, nomme la règle oubliée.</p>
</header>
<nav class="lv" id="lv" aria-label="Niveaux"></nav>
<main class="app">
  <section class="scol" aria-label="Feuille de calcul">
    <div class="win" id="win">
      <div class="wtop"><span class="ic" aria-hidden="true">Σ</span><div class="fn" id="fname"></div><div class="who" id="who"></div></div>
      <p class="brief" id="brief"></p>
      <div class="fbar"><span class="nmbox" id="nm" aria-label="Cellule sélectionnée">—</span><span class="fx" aria-hidden="true">fx</span><div class="fml" id="fml" aria-live="polite"></div></div>
      <div class="trad" id="trad"></div>
      <div class="acts" id="acts"></div>
      <div class="gwrap" id="gwrap"><table class="grid" id="grid"></table><svg class="arrows" id="arrows" aria-hidden="true"></svg></div>
      <div class="tree" id="tree" hidden></div>
      <div class="tabs" id="tabs" aria-label="Feuilles du niveau"></div>
    </div>
  </section>
  <section class="panel" id="panel" aria-live="polite"></section>
</main>
<script>
/* =====================================================================
   CELLULE SUSPECTE — moteur (sans DOM) : hasard, formats, formules de tableur,
   feuilles, tirage des erreurs, épreuves. window.CS = {...}
   Une feuille = des cellules : en-têtes (h), étiquettes (l), données (d),
   calculs par formule (f) ou saisies à la main (m). Une seule cellule f/m
   (ou aucune) a été mal remplie ; les cellules qui l'utilisent sont recalculées
   par des formules justes (elles héritent de l'erreur, comme dans un vrai tableur).
   ===================================================================== */
(function (G) {
'use strict';
/* ---------------- hasard ---------------- */
function rng(seed) {
  let s = (seed === undefined ? Math.floor(Math.random() * 4294967296) : seed) >>> 0;
  const f = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return {
    f, int: (a, b) => a + Math.floor(f() * (b - a + 1)), pick: a => a[Math.floor(f() * a.length)],
    sh: a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
    ch: p => f() < p, some: (a, k) => { a = a.slice(); const o = []; while (o.length < k && a.length) o.push(a.splice(Math.floor(f() * a.length), 1)[0]); return o; }
  };
}
/* ---------------- formats ---------------- */
const MN = '−', NNB = ' ';
const F = {
  i: { d: 0 }, d1: { d: 1 }, d2: { d: 2 }, d3: { d: 3 }, d4: { d: 4 }, d5: { d: 5 },
  g2: { d: 2, t: 1 }, g3: { d: 3, t: 1 }, g4: { d: 4, t: 1 },
  e: { d: 2, u: '€' }, e0: { d: 0, u: '€' }, m: { d: 0, u: 'm' },
  p0: { d: 0, p: 1 }, p1: { d: 1, p: 1 }, p2: { d: 2, p: 1 }, p3: { d: 3, p: 1 },
  ps0: { d: 0, p: 1, s: 1 }, ps1: { d: 1, p: 1, s: 1, t: 1 }
};
/* arrondi décimal au plus proche (demi vers le haut, en valeur absolue), sans piège binaire */
function rstr(a, d) {
  const t = a.toFixed(Math.min(d + 6, 20)); const [ip, fp = ''] = t.split('.');
  let n = BigInt(ip + fp); const k = BigInt(10) ** BigInt(fp.length - d);
  n = (n + k / 2n) / k; let s = n.toString(); if (d) { s = s.padStart(d + 1, '0'); s = s.slice(0, -d) + '.' + s.slice(-d); } return s;

  const rows = r.sh(inc.map(t => t / 100).concat(dec.map(t => -t / 100)));
  const labs = r.some(['Loyer', 'Forfait mobile', 'Prix du scooter', 'Abonnés du club', 'Facture d\'eau', 'Ticket de barge'], 4);
  const S = new Sheet(1, 'cm', { rows });
  S.file = 'evolutions'; S.title = 'Coefficients multiplicateurs';
  S.ctx = 'Laïla a traduit chaque évolution en coefficient multiplicateur (à saisir à la main, sans formule).';
  S.h('A1', 'Grandeur').h('B1', 'Évolution').h('C1', 'Coefficient');
  rows.forEach((t, k) => {
    const R = k + 2, a = Math.abs(t), up = t > 0;
    S.l('A' + R, labs[k]).d('B' + R, t, F.ps1);
    S.m('C' + R, +(1 + t).toFixed(6), F.g4, `${up ? 'Hausse' : 'Baisse'} de ${nb(a * 100)} % : on multiplie par 1 ${up ? '+' : '−'} ${fl(+a.toFixed(6))} = ${fl(+(1 + t).toFixed(6))}.`, up ? [
      [+a.toFixed(6), 'R_cm', 'On a écrit le taux seul : il manque le 1.'],
      [+(1 + a * 10).toFixed(6), 'R_cm', 'Mauvaise conversion : t % = t ÷ 100.'],
      [+(1 - a).toFixed(6), 'R_cm', 'C\'est le coefficient d\'une baisse.']] : [
      [+(1 + a).toFixed(6), 'R_cm', 'C\'est le coefficient d\'une hausse.'],
      [+a.toFixed(6), 'R_cm', 'On a écrit le taux seul : diminuer de t %, c\'est multiplier par 1 − t/100.'],
      [+(-a).toFixed(6), 'R_cm', 'Un coefficient multiplicateur est positif : 1 − t/100.']]);
  });
  S.trap = 'C' + (rows.findIndex(t => t < 0) + 2);
  const k = r.int(0, 3), t = rows[k];
  S.fin('C' + (k + 2), 1, `${t > 0 ? 'Augmenter' : 'Diminuer'} une quantité de ${nb(Math.abs(t) * 100)} % revient à la multiplier par :`);
  return S;
});

/* ======================= NIVEAU 2 · EXPONENTIELLES ======================= */
T(2, 'exposants', 1, r => {
  const a = r.pick([2, 3, 5, 10]);
  const xv = () => r.pick([-4, -3, -2, -1, 2, 3, 4, 5, 6, 7, 0.5, 1.5, 2.5, -0.5]);
  const types = r.sh(['p', 'q', 'w']).concat([r.pick(['p', 'q'])]);
  const S = new Sheet(2, 'exposants', { a, types });
  S.file = 'regles-puissances'; S.title = 'Règles de calcul sur les exposants';
  S.ctx = `Hamza écrit chaque résultat sous la forme ${a}<sup>…</sup> et ne note que l'exposant obtenu.`;
  S.h('A1', 'Calcul').h('B1', 'x').h('C1', 'y').h('D1', 'Exposant');
  const lab = { p: `${a}<sup>x</sup> × ${a}<sup>y</sup>`, q: `${a}<sup>x</sup> ÷ ${a}<sup>y</sup>`, w: `(${a}<sup>x</sup>)<sup>y</sup>` };
  const P = [];
  types.forEach((ty, k) => {
    const R = k + 2; let x = xv(), y = ty === 'w' ? r.pick([2, 3, 4, -2]) : xv();
    while (ty !== 'w' && (Math.abs(x * y - (x + y)) < 1e-9 || (ty === 'p' && Math.abs(x + y) < 1e-9) || (ty === 'q' && Math.abs(x - y) < 1e-9))) y = y + 1;
    P.push([ty, x, y]);
    S.l('A' + R, lab[ty]).d('B' + R, x, F.g2).d('C' + R, y, F.g2);
    if (ty === 'p') S.f('D' + R, `=B${R}+C${R}`, F.g2, 'Produit : on additionne les exposants.', [[`=B${R}*C${R}`, 'R2_prod', 'On a multiplié les exposants : c\'est la règle de (a<sup>x</sup>)<sup>y</sup>.'], [`=B${R}-C${R}`, 'R2_prod', 'On a soustrait : c\'est la règle du quotient.']]);
    if (ty === 'q') S.f('D' + R, `=B${R}-C${R}`, F.g2, 'Quotient : on soustrait les exposants.', [[`=B${R}/C${R}`, 'R2_quot', 'On a divisé les exposants.'], [`=B${R}+C${R}`, 'R2_quot', 'On a additionné : c\'est la règle du produit.']]);
    if (ty === 'w') S.f('D' + R, `=B${R}*C${R}`, F.g2, 'Puissance d\'une puissance : on multiplie les exposants.', [[`=B${R}+C${R}`, 'R2_pow', 'On a additionné : c\'est la règle du produit.'], [`=B${R}^C${R}`, 'R2_pow', 'On a élevé l\'exposant à une puissance.']]);
  });
  S.P.rows = P;
  S.l('A7', `Valeur de ${a}<sup>0</sup>`).m('D7', 1, F.g2, `${a}<sup>0</sup> = 1, comme tout a<sup>0</sup> avec a > 0.`, [[0, 'R2_zero', 'a<sup>0</sup> vaut 1, pas 0.'], [a, 'R2_zero', 'a<sup>0</sup> vaut 1, pas a.']]);
  S.trap = 'D' + (2 + P.findIndex(p => (p[0] === 'p' ? p[1] + p[2] : p[0] === 'q' ? p[1] - p[2] : p[1] * p[2]) < 0)); if (S.trap === 'D1') S.trap = 'D7';
  const k = r.int(0, 3), [ty, x, y] = P[k], ex = ty === 'w' ? `(${a}<sup>${nb(x)}</sup>)<sup>${nb(y)}</sup>` : `${a}<sup>${nb(x)}</sup> ${ty === 'p' ? '×' : '÷'} ${a}<sup>${nb(y)}</sup>`;
  S.fin('D' + (k + 2), 1, `On écrit ${ex} sous la forme ${a}<sup>n</sup>. L'exposant n vaut :`, { trousPrompt: `${ex} = ${a}<sup>n</sup> avec n =` });
  S.fin('D7', 1, `Le nombre ${a}<sup>0</sup> est égal à :`);
  return S;
});

T(2, 'variations', 1, r => {
  const combos = r.sh([[1, 1], [1, -1], [-1, 1], [-1, -1]]);
  const S = new Sheet(2, 'variations', {});
  S.file = 'sens-variation'; S.title = 'Sens de variation de x ↦ k a<sup>x</sup>';
  S.ctx = 'Yanis a noté le sens de variation sur ℝ de chaque fonction f(x) = k × a<sup>x</sup>.';
  S.h('A1', 'Fonction').h('B1', 'k').h('C1', 'a').h('D1', 'Sens');
  const rows = [];
  combos.forEach(([sk, sa], i) => {
    const R = i + 2, k = sk * r.pick([2, 3, 4, 5, 0.5, 1.5]), a = sa > 0 ? r.pick([1.5, 2, 1.05, 3, 1.2]) : r.pick([0.8, 0.3, 0.5, 0.95, 0.7]);
    rows.push([k, a]);
    const good = (k > 0) === (a > 1) ? 'croissante' : 'décroissante', opp = good === 'croissante' ? 'décroissante' : 'croissante';
    const w = `k ${k > 0 ? '> 0' : '< 0'} et ${a > 1 ? 'a > 1' : '0 < a < 1'} : f est ${good}.`;
    S.l('A' + R, `${nb(k)} × ${nb(a)}<sup>x</sup>`).d('B' + R, k, F.g2).d('C' + R, a, F.g2);
    S.m('D' + R, good, null, w, [[opp, 'R2_var', k < 0 ? 'Avec k < 0, le sens de variation de a<sup>x</sup> est inversé.' : (a > 1 ? 'a > 1 : a<sup>x</sup> augmente, et k > 0 conserve le sens.' : '0 < a < 1 : a<sup>x</sup> diminue, et k > 0 conserve le sens.')], ['constante', 'R2_var', 'f serait constante seulement si a = 1.'], [good === 'croissante' ? 'décroissante puis croissante' : 'croissante puis décroissante', 'R2_var', 'x ↦ k a<sup>x</sup> garde le même sens de variation sur tout ℝ.']]);
  });
  S.P.rows = rows;
  S.trap = 'D' + (2 + rows.findIndex(([k, a]) => k < 0 && a < 1));
  const i = r.int(0, 3), [k, a] = rows[i];
  S.fin('D' + (i + 2), 1, `La fonction f définie sur ℝ par f(x) = ${nb(k)} × ${nb(a)}<sup>x</sup> est :`, { trous: false });
  return S;
});

T(2, 'tauxmoyen', 3, r => {
  const n = r.pick([4, 5, 8, 10]), C = r.pick([1.2, 1.5, 0.8, 1.35, 0.9, 2, 0.75, 1.6]), V0 = r.pick([200, 400, 500, 1000, 1200, 2500]), Vn = +(V0 * C).toFixed(6);
  const ctx = r.pick([['Abonnés d\'un club de handball', 'abonnés'], ['Prix d\'un ticket de barge', 'centimes'], ['Habitants d\'un village', 'habitants']]);
  const S = new Sheet(2, 'tauxmoyen', { n, C, V0, Vn });
  S.file = 'taux-moyen'; S.title = 'Taux d\'évolution moyen';
  S.ctx = `${ctx[0]} : ${nb(V0)} au départ, ${nb(Vn)} au bout de ${n} ans. Zaïna cherche le taux annuel moyen.`;
  S.l('A1', 'Valeur initiale').d('B1', V0, F.g2).l('A2', 'Valeur finale').d('B2', Vn, F.g2).l('A3', 'Nombre d\'années n').d('B3', n, F.i);
  S.l('A4', 'Coefficient global C').f('B4', '=B2/B1', F.g4, 'C = valeur finale ÷ valeur initiale.', [['=B1/B2', 'R_cm', 'On a divisé dans le mauvais sens : C = valeur finale ÷ valeur initiale.'], ['=(B2-B1)/B1', 'R_cm', 'C\'est le taux global, pas le coefficient.']]);
  S.l('A5', 'Taux global').f('B5', '=B4-1', F.p2, 'Taux global = C − 1.', [['=B4', 'R_cm', 'Le taux est C − 1, pas C.']]);
  S.l('A6', 'Coefficient moyen C<sup>1/n</sup>').f('B6', '=B4^(1/B3)', F.d4, '1 + t<sub>m</sub> = C<sup>1/n</sup>.', [['=B4/B3', 'R2_tm', 'On a divisé C par n au lieu d\'élever C à la puissance 1/n.'], ['=1+B5/B3', 'R2_tm', 'On a partagé le taux global en n parts égales : les évolutions se composent.']]);
  S.l('A7', 'Taux moyen t<sub>m</sub>').f('B7', '=B6-1', F.p2, 't<sub>m</sub> = C<sup>1/n</sup> − 1.', [['=B5/B3', 'R2_tm', 'Taux global ÷ n : faux, car les évolutions se composent.'], ['=B6', 'R2_tm', 'On a oublié de retirer 1.']]);
  S.trap = 'B7';
  S.fin('B7', 3, `En ${n} ans, une grandeur passe de ${nb(V0)} à ${nb(Vn)}. Le taux d'évolution annuel moyen est :`, { steps: 3 });
  S.fin('B6', 2, `Sur ${n} ans, le coefficient multiplicateur global d'une grandeur est ${fl(C)}. Le coefficient multiplicateur annuel moyen est :`);

T(2, 'modele', 2, r => {
  const up = r.ch(0.5), k = up ? r.pick([200, 150, 80, 50]) : r.pick([16, 80, 50, 12]), a = up ? r.pick([1.035, 1.2, 1.05, 1.5]) : r.pick([0.8, 0.9, 0.75, 0.6]);
  const S = new Sheet(2, 'modele', { k, a });
  S.file = up ? 'population' : 'concentration'; S.title = up ? 'Modèle de population' : 'Concentration d\'un médicament';
  S.ctx = up ? `La population d'une commune (en milliers) est modélisée par f(x) = ${k} × ${fl(a)}<sup>x</sup>, x en années.` : `La concentration (en mg/L) est modélisée par f(x) = ${k} × ${fl(a)}<sup>x</sup>, x en heures.`;
  S.h('A1', 'x').h('B1', 'f(x)');
  const xs = [0, 1, 2.5, -1, 4];
  xs.forEach((x, i) => S.d('A' + (i + 2), x, F.g2));
  S.l('A8', 'k').d('B8', k, F.g4).l('A9', 'a').d('B9', a, F.g4);
  const base = R => `=$B$8*$B$9^A${R}`, w = 'f(x) = k × a<sup>x</sup> : a est élevé à la puissance x, puis multiplié par k.';
  S.f('B2', base(2), F.d2, 'f(0) = k × a<sup>0</sup> = k × 1 = k.', [['=$B$8*0', 'R2_zero', 'a<sup>0</sup> = 1, donc f(0) = k, pas 0.'], ['=$B$9', 'R2_zero', 'f(0) = k × a<sup>0</sup> = k, pas a.']]);
  S.f('B3', base(3), F.d2, 'f(1) = k × a.', [['=$B$8+$B$9', 'R2_x', 'On a ajouté k et a au lieu de les multiplier.']]);
  S.f('B4', base(4), F.d2, w, [['=$B$8*$B$9*A4', 'R2_x', 'On a multiplié par x au lieu de l\'utiliser comme exposant.'], ['=($B$8*$B$9)^A4', 'R2_x', 'Seul a est élevé à la puissance x, pas k × a.']]);
  S.f('B5', base(5), F.d2, 'f(−1) = k × a<sup>−1</sup> = k ÷ a.', [['=-$B$8*$B$9', 'R2_neg', 'a<sup>−1</sup> = 1/a : ce n\'est pas −a.'], ['=$B$8*$B$9', 'R2_neg', 'On a oublié le signe − de l\'exposant.']]);
  S.f('B6', base(6), F.d2, w, [['=$B$8*$B$9*A6', 'R2_x', 'x multiplie au lieu d\'être un exposant.']]);
  S.trap = 'B5';
  S.fin('B5', 2, `On considère f(x) = ${k} × ${fl(a)}<sup>x</sup>. La valeur de f(−1) est :`);
  S.fin('B4', 2, `On considère f(x) = ${k} × ${fl(a)}<sup>x</sup>. La valeur de f(2,5) est :`);
  S.fin('B2', 1, `On considère f(x) = ${k} × ${fl(a)}<sup>x</sup>. La valeur de f(0) est :`);
  return S;
});

  S.l('A6', 'Coefficient global').f('C6', '=C2*C3*C4', F.g4, 'On multiplie les coefficients multiplicateurs.', [['=C2+C3+C4', 'R2_succ', 'On a additionné les coefficients au lieu de les multiplier.'], ['=1+B2+B3+B4', 'R2_succ', 'On a additionné les taux.']]);

T(3, 'logval', 1, r => {
  const es = r.some([3, -2, 0, 1, 5, -1, -3, 6, 2], 3);
  const S = new Sheet(3, 'logval', { es });
  S.file = 'calcul-mental-log'; S.title = 'Logarithmes sans calculatrice';
  S.ctx = 'Soilihi a rempli la colonne B de tête, sans calculatrice ni formule.';
  S.h('A1', 'Calcul').h('B1', 'Résultat');
  es.forEach((e, k) => {
    const R = k + 2, x = Math.pow(10, e);
    S.l('A' + R, `log(${nb(x, 6)})`);
    const alts = e === 0 ? [[1, 'R3_ref', 'log(1) = 0, car 10<sup>0</sup> = 1.'], [10, 'R3_ref', 'log(1) = 0, car 10<sup>0</sup> = 1.']]
      : e === 1 ? [[10, 'R3_ref', 'log(10) = 1, car 10<sup>1</sup> = 10.'], [0, 'R3_ref', 'C\'est log(1) qui vaut 0 ; log(10) = 1.']]
        : [[-e, 'R3_ref', e > 0 ? 'Le logarithme d\'un nombre supérieur à 1 est positif.' : 'Le logarithme d\'un nombre compris entre 0 et 1 est négatif.'], [e > 0 ? e + 1 : e - 1, 'R3_ref', `${nb(x, 6)} = 10<sup>${nb(e)}</sup> : on a mal compté les zéros.`], [+(x / 10).toFixed(8), 'R3_def', 'log(x) n\'est pas x ÷ 10 : c\'est l\'exposant de 10.']];
    S.m('B' + R, e, F.g4, `${nb(x, 6)} = 10<sup>${nb(e)}</sup>, donc son logarithme vaut ${nb(e)}.`, alts);
  });
  const b = r.pick([7, 5, 3, 2]);
  S.l('A5', `10<sup>log(${b})</sup>`).m('B5', b, F.g4, `10<sup>log(x)</sup> = x pour x > 0.`, [[+Math.log10(b).toFixed(3), 'R3_def', '10<sup>log(x)</sup> = x : la puissance de 10 et le logarithme se compensent.'], [10 * b, 'R3_def', '10<sup>log(x)</sup> = x, pas 10 × x.']]);
  const neg = es.findIndex(e => e < 0); S.trap = neg >= 0 ? 'B' + (neg + 2) : 'B5';
  const e = r.pick(es);
  S.fin('B' + (es.indexOf(e) + 2), 1, `Sans calculatrice : log(${nb(Math.pow(10, e), 6)}) =`);
  S.fin('B5', 1, `Pour tout x > 0, 10<sup>log(x)</sup> = x. Ainsi 10<sup>log(${b})</sup> =`);
  return S;
});

T(3, 'logprops', 2, r => {
  const bank = {
    6: ['=B1+B2', 'log(6) = log(2 × 3) = log 2 + log 3.', [['=B1*B2', 'R3_prod', 'log(2 × 3) = log 2 + log 3, pas log 2 × log 3.']]],
    5: ['=1-B1', 'log(5) = log(10 ÷ 2) = log 10 − log 2 = 1 − log 2.', [['=B1+B2', 'R3_prod', '5 = 2 + 3, mais log(2 + 3) n\'est pas log 2 + log 3.'], ['=1+B1', 'R3_quot', 'log(10 ÷ 2) = log 10 − log 2.']]],
    8: ['=3*B1', 'log(8) = log(2<sup>3</sup>) = 3 log 2.', [['=B1^3', 'R3_pow', 'log(2<sup>3</sup>) = 3 log 2, pas (log 2)<sup>3</sup>.'], ['=B1+3', 'R3_pow', 'L\'exposant 3 multiplie log 2.']]],
    1.5: ['=B2-B1', 'log(1,5) = log(3 ÷ 2) = log 3 − log 2.', [['=B2/B1', 'R3_quot', 'log(3 ÷ 2) = log 3 − log 2, pas un quotient de logarithmes.'], ['=B1-B2', 'R3_quot', 'Ordre inversé : c\'est log 3 − log 2.']]],
    '1/9': ['=-2*B2', 'log(1/9) = −log 9 = −2 log 3.', [['=1/(2*B2)', 'R3_inv', 'log(1 ÷ b) = −log b, pas 1 ÷ log b.'], ['=2*B2', 'R3_inv', 'Il manque le signe − : 1/9 < 1, son logarithme est négatif.']]],
    20: ['=1+B1', 'log(20) = log(10 × 2) = log 10 + log 2 = 1 + log 2.', [['=10*B1', 'R3_prod', 'log(10 × 2) = log 10 + log 2 = 1 + log 2.'], ['=2*B1', 'R3_prod', 'log(20) = log 10 + log 2 = 1 + log 2.']]]
  };
  const keys = r.some(Object.keys(bank), 4);
  const S = new Sheet(3, 'logprops', { keys });
  S.file = 'proprietes-log'; S.title = 'Propriétés du logarithme';
  S.ctx = 'Kassim n\'utilise que log(2) et log(3) (colonne B) pour obtenir les autres logarithmes.';
  S.l('A1', 'log(2)').f('B1', '=LOG(2)', F.d3, 'Valeur donnée par la calculatrice.').l('A2', 'log(3)').f('B2', '=LOG(3)', F.d3, 'Valeur donnée par la calculatrice.');
  keys.forEach((k, i) => { const R = i + 4, [f, w, al] = bank[k]; S.l('A' + R, `log(${k === '1/9' ? '1/9' : fl(k)})`).f('B' + R, f, F.d3, w, al); });

});

/* CELLULE SUSPECTE — interface */
(function () {
'use strict';

  const FN = { LOG: 'log', RACINE: '√', SOMME: 'somme', MOYENNE: 'moyenne', COMBIN: 'COMBIN', ENT: 'partie entière', 'ARRONDI.SUP': 'arrondi supérieur', ABS: 'valeur absolue' };

    const t = T[i];
    if (t === '(') { let d = 0, j = i; for (; j < T.length; j++) { if (T[j] === '(') d++; if (T[j] === ')') { d--; if (!d) break; } } return ['(' + seq(i + 1, j) + ')', j + 1]; }

}
function select(ref) {
  const S = G.S; G.st.sel = ref;
  $('grid').querySelectorAll('.cell').forEach(b => b.classList.remove('sel', 'p0', 'p1', 'p2', 'p3'));
  if (!ref) { $('nm').textContent = '—'; $('fml').innerHTML = '<span class="ph">Touche une cellule pour lire son contenu.</span>'; $('trad').innerHTML = ''; arrows([]); acts(); return; }
  const P = precs(ref); P.forEach((p, k) => { const e = cellEl(p); if (e) e.classList.add('p' + (k % 4)); });

/* flèches des antécédents */
function arrows(list) {
  const sv = $('arrows'), W = $('gwrap').getBoundingClientRect(); G.arrowList = list;
  sv.setAttribute('viewBox', `0 0 ${W.width} ${W.height}`);
  sv.innerHTML = list.map(([a, b, col]) => {
    const A = cellEl(a), B = cellEl(b); if (!A || !B) return '';

    const sameCol = Math.abs(ra.left - rb.left) < 2;

  }).join('');

window.addEventListener('resize', () => { if (G.arrowList) arrows(G.arrowList); });
/* arbre pondéré lié aux cellules */
function tree() {
  const S = G.S, T = S.tree, box = $('tree'); if (!T) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false; const v = r => r ? strip(G.st.values[r]) : '…', A = T.A, B = T.B;
  const lab = (x, y, r) => `<g class="tl" data-ref="${r || ''}"><rect x="${x - 30}" y="${y - 13}" width="60" height="24" rx="7" fill="#0e1f3e" stroke="${r && G.st.sel === r ? 'var(--ac)' : 'rgba(120,160,255,.3)'}"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="13" font-weight="700" fill="${r ? '#f0f4ff' : 'rgba(200,215,255,.5)'}">${v(r)}</text></g>`;
  const node = (x, y, t, ov) => `<text x="${x}" y="${y + 5}" font-size="16" font-weight="700" fill="#e8c766" text-anchor="middle" ${ov ? 'text-decoration="overline"' : ''}>${t}</text>`;

  box.innerHTML = `<svg viewBox="0 0 400 200" role="img" aria-label="Arbre pondéré">
    ${ln(18, 100, 150, 46)}${ln(18, 100, 150, 154)}${ln(168, 46, 330, 20)}${ln(168, 46, 330, 72)}${ln(168, 154, 330, 128)}${ln(168, 154, 330, 180)}
    <circle cx="14" cy="100" r="4" fill="#e8c766"/>${node(160, 46, A)}${node(160, 154, A, 1)}${node(344, 20, B)}${node(344, 72, B, 1)}${node(344, 128, B)}${node(344, 180, B, 1)}
    ${lab(84, 62, T.root[0])}${lab(84, 140, T.root[1])}${lab(250, 22, T.a[0])}${lab(250, 70, T.a[1])}${lab(250, 130, T.na[0])}${lab(250, 178, T.na[1])}</svg>`;
}
$('tree').addEventListener('click', e => { const g = e.target.closest('.tl'); if (g && g.dataset.ref) { select(g.dataset.ref); sfx.sel(); } });
function tabs() {
  $('tabs').innerHTML = G.sheets.map((_, k) => `<span class="tab${k === G.i ? ' on' : ''}${G.res[k] === true ? ' g' : G.res[k] === false ? ' r' : ''}"><i></i><span class="tw">Feuille </span>${k + 1}</span>`).join('');
}
/* ---------- barre d'actions (sous la formule) ---------- */
function acts() {
  const S = G.S, st = G.st, a = $('acts'); if (!S) return;

  } else { a.hidden = true; a.innerHTML = ''; }

/* ---------- dossier ---------- */
const MK = mood => SK && SK.maki ? `<span class="mk">${SK.maki(mood)}</span>` : '<span></span>';
function fb(kind, title, body) { G.st.msg = { kind, title, body }; }
function panel() {
  const S = G.S, st = G.st, L = CS.LEVELS[G.lv - 1];

  let h = `<div class="chap">${S.id === 'cm' || S.id === 'succ' || S.id === 'sci' || S.id === 'fractions' || S.id === 'ineq' || S.id === 'pp' || S.id === 'formes' || S.id === 'pct' || S.id === 'indice' ? L.a : L.ch}</div><h2>Contrôle de la feuille ${G.i + 1}</h2>`;

  if (st.step === 'loc') h += `<p class="ask">Quelle cellule est la source de l'erreur ?</p><p class="hint">Touche une cellule pour lire sa formule ; les flèches montrent les cellules qu'elle utilise. Les données de l'énoncé sont justes. Puis « Accuser », ou « Aucune erreur ».</p>`;

    else h += `<div class="opts${S.choices.some(c => strip(c).length > 16) ? ' long' : ''}" id="opts">` + S.choices.map((c, k) => `<button type="button" class="opt" data-k="${k}">${c}</button>`).join('') + '</div>';
  }
  if (st.step === 'rule') h += `<p class="ask">Quelle règle du cours a été oubliée ?</p><div class="opts long" id="opts">` + S.ruleChoices.map((id, k) => `<button type="button" class="opt rule" data-k="${k}">${CS.RULES[id].t}</button>`).join('') + '</div>';
  if (st.msg) h += `<div class="fb ${st.msg.kind}">${MK(st.msg.kind === 'ok' ? 'joie' : st.msg.kind === 'ko' ? 'pense' : 'neutre')}<div><b class="t">${st.msg.title}</b>${String(st.msg.body || '').replace(/^<br>/, '')}</div></div>`;
  if (st.step === 'done') {
    if (S.bad) h += `<ul class="recap"><li><span>Erreur</span><div>${S.bad} : ${S.why}</div></li><li><span>Correction</span><div>${S.bad} = <b>${S.fix.s}</b></div></li><li><span>Règle</span><div>${CS.RULES[S.rule].t}</div></li></ul>`;
    h += `<div class="btns"><button type="button" class="btn or" id="nx">${G.i < G.sheets.length - 1 ? 'Feuille suivante →' : 'Terminer le niveau'}</button></div>`;
  }
  const ok = G.res.filter(x => x === true).length;
  h += `<p class="score">Feuille ${G.i + 1} sur ${G.sheets.length} · réussies du premier coup : ${ok}</p>`;
  h += `<details class="cours"><summary>Rappels du cours · niveau ${G.lv}</summary><ul>${Object.values(CS.RULES).filter(r => r.lv === G.lv).map(r => `<li>${r.t}</li>`).join('')}</ul></details>`;
  $('panel').innerHTML = CS.typo(h);
  if (st.step === 'fix' || st.step === 'rule') $('panel').querySelectorAll('.opt').forEach(b => b.onclick = () => (st.step === 'fix' ? pickFix : pickRule)(+b.dataset.k, b));

}
function focusPanel(sel) { setTimeout(() => { const p = $('panel'), r = p.getBoundingClientRect(); if (r.top > innerHeight - 160 || r.bottom < 80) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); const t = sel && p.querySelector(sel); if (t) t.focus({ preventScroll: true }); }, 30); }
/* ---------- étape 1 : localiser ---------- */
function accuse(ref) {
  const S = G.S, st = G.st;

    sfx.ok();
    if (!S.bad) { fb('ok', 'Feuille validée : aucune erreur.', `<br>Le piège : ${S.trap} semblait suspecte, mais elle est juste. ${S.cells[S.trap].w}`); finish(); return; }
    mark(S.bad, 'fault'); fb('ok', `Bien vu : ${S.bad} est la source.`, `<br>${S.why}${S.down.length ? ` Les cellules ${S.down.join(', ')} l'utilisent : elles héritent de l'erreur.` : ''}`);

function mark(ref, cls) { const e = cellEl(ref); if (e) e.classList.add(cls); }
function toFix() {

/* ---------- étape 2 : corriger ---------- */
function pickFix(k, btn) {

  st.fixTries++; st.first = false; sfx.ko();
  if (st.fixTries >= 2) { fb('ko', `La bonne valeur est ${S.fix.s}.`, '<br>' + (S.cells[S.bad].w || '')); return toRule(); }

}
function typed(v) {
  const S = G.S, st = G.st, x = parseFloat(String(v).replace(/[\s €%m]/g, '').replace(/[−–]/g, '-').replace(',', '.'));
  if (isFinite(x) && Math.abs(x - S.fix.v) < 1e-9 * Math.max(1, Math.abs(S.fix.v))) { sfx.ok(); fb('ok', `Oui : ${S.bad} doit afficher ${S.fix.s}.`, ''); return toRule(); }
  st.fixTries++; st.first = false; sfx.ko();

function toRule() { G.st.step = 'rule'; panel(); focusPanel('.opt'); }
/* ---------- étape 3 : la règle ---------- */
function pickRule(k, btn) {

/* ---------- fin d'une feuille : la correction redescend en cascade ---------- */
function finish() {
  const S = G.S, st = G.st; st.step = 'done'; G.res[G.i] = st.first; tabs();

function depth(r) { const S = G.S; let d = 0, P = precs(r); while (P.length && d < 12) { const n = P.filter(p => S.down.includes(p) || p === S.bad); if (!n.length) break; d++; P = [].concat(...n.map(precs)); } return d; }
function next() {

/* ---------- démarrage ---------- */
if (SK) SK.init({ game: GAME, title: TITLE, levels: 7, levelNames: CS.LEVELS.map(l => l.t), music: 'aventure',
  finals: { bronze: () => CS.buildFinal('bronze'), argent: () => CS.buildFinal('argent'), or: () => CS.buildFinal('or') } });
window.CSUI = { G, start, open, accuse, select, pickFix, pickRule, typed, next };
start(1);
})();
